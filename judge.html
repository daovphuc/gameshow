<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ban Giám Khảo - Hội Thi PCCC &amp; CNCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="tablet-container">
    <div id="judge-app-root"></div>
  </div>

  <script type="module">
    import {
      fetchQuizData,
      renderAvatarHtml,
      escapeHtml,
      showToast,
      lockAppSession
    } from "./js/app.js";
    import { clampScore } from "./js/judges.js";
    import { set, update, listen, get } from "./js/backend.js";

    const JUDGE_ID_KEY = "gameshow_judge_id";

    let quizData = null;
    let selectedJudgeId = localStorage.getItem(JUDGE_ID_KEY) || "";

    // Live state mirror
    let liveState = {
      currentRound: "round1",
      stageTeamId: null,
      round1: {},
      round2: {},
      round3: {},
      judgeScores: { round1: {}, round3: {} }
    };

    function saveSelectedJudge(judgeId) {
      selectedJudgeId = judgeId;
      if (judgeId) {
        localStorage.setItem(JUDGE_ID_KEY, judgeId);
      } else {
        localStorage.removeItem(JUDGE_ID_KEY);
      }
      renderJudgePortal();
    }

    function renderJudgePicker(root) {
      const judges = quizData.judges || [];
      const judgesHtml = judges
        .map(
          (j) => `
          <button type="button" class="btn btn-lg" style="width: 100%; justify-content: space-between; padding: 1.2rem 1.4rem; font-size: 1.15rem;" data-pick-judge="${escapeHtml(j.id)}">
            <span style="font-weight: 700;">${escapeHtml(j.name)}</span>
            <span style="color: var(--accent);">Chọn →</span>
          </button>
        `
        )
        .join("");

      root.innerHTML = `
        <div class="tablet-stage-card" style="margin-top: 2rem;">
          <h1 style="font-family: var(--font-serif); font-size: 1.8rem; margin: 0 0 0.5rem; text-align: center;">
            Chọn Danh Tính Giám Khảo
          </h1>
          <p style="text-align: center; color: var(--text-muted); margin: 0 0 1.8rem;">
            Vui lòng chọn danh xưng của bạn trong Ban Giám khảo để bắt đầu chấm điểm.
          </p>
          <div style="display: flex; flex-direction: column; gap: 0.85rem;">
            ${judgesHtml}
          </div>
        </div>
      `;

      root.querySelectorAll("[data-pick-judge]").forEach((btn) => {
        btn.addEventListener("click", () => {
          saveSelectedJudge(btn.dataset.pickJudge);
        });
      });
    }

    function renderJudgeHeader() {
      const judgeObj = quizData.judges.find((j) => j.id === selectedJudgeId);
      const judgeName = judgeObj ? judgeObj.name : "Giám khảo";

      return `
        <header class="tablet-header">
          <div class="tablet-identity-banner">
            <span style="font-size: 1.5rem;">📋</span>
            <div>
              <div style="font-size: 0.78rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">
                Ban Giám Khảo
              </div>
              <div class="tablet-identity-name">${escapeHtml(judgeName)}</div>
            </div>
          </div>

          <div style="display: flex; gap: 0.5rem;">
            <button type="button" id="btn-change-judge" class="btn btn-sm">
              Đổi giám khảo
            </button>
            <button type="button" id="btn-lock-judge" class="btn btn-sm">
              🔒 Khóa
            </button>
          </div>
        </header>
      `;
    }

    function renderRound1Or3Scoring(root, roundKey) {
      const isR1 = roundKey === "round1";
      const roundName = isR1 ? quizData.config.round1_name : quizData.config.round3_name;
      const maxContent = isR1
        ? Number(quizData.config.round1_max_content) || 45
        : Number(quizData.config.round3_max_content) || 25;
      const maxManner = isR1
        ? Number(quizData.config.round1_max_manner) || 5
        : Number(quizData.config.round3_max_manner) || 5;

      const activeTeamId =
        liveState.stageTeamId ||
        (isR1
          ? liveState.round1?.activeSession?.teamId
          : liveState.round3?.activeTile?.selectedTeamId);

      const activeTeam = quizData.teams.find((t) => t.id === activeTeamId);

      // Check if team round is locked by host
      const isLocked = isR1 && liveState.round1?.lockedTeams?.includes(activeTeamId);

      // Current judge score for this team
      const existing =
        liveState.judgeScores?.[roundKey]?.[activeTeamId]?.[selectedJudgeId] || {
          content: 0,
          manner: 0
        };

      let contentVal = clampScore(existing.content, maxContent);
      let mannerVal = clampScore(existing.manner, maxManner);

      // Title or question being answered
      let topicText = "";
      if (isR1 && liveState.round1?.activeSession) {
        const pkg = quizData.round1Packages.find(
          (p) => p.id === liveState.round1.activeSession.packageId
        );
        topicText = pkg ? `${pkg.package}: ${pkg.question}` : "";
      } else if (!isR1 && liveState.round3?.activeTile) {
        const tile = quizData.round3Questions.find(
          (q) => q.number === liveState.round3.activeTile.number
        );
        topicText = tile ? `Ô số #${tile.number}: ${tile.question}` : "";
      }

      root.innerHTML = `
        ${renderJudgeHeader()}

        <main class="tablet-stage-card">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem;">
            <span class="meta-pill accent">${escapeHtml(roundName)}</span>
            <span style="font-size: 0.88rem; color: var(--text-muted); font-weight: 600;">
              ${isLocked ? "🔒 Đã khóa phần thi" : "Đang mở chấm điểm"}
            </span>
          </div>

          ${
            !activeTeam
              ? `<div style="text-align: center; padding: 2.5rem 1rem; color: var(--text-muted);">
                  <div style="font-size: 2.5rem; margin-bottom: 0.8rem;">⏳</div>
                  <h2 style="font-size: 1.25rem; margin: 0 0 0.5rem; color: var(--text);">Đang chờ MC mời đội lên sân khấu</h2>
                  <p style="font-size: 0.95rem; margin: 0;">Phiếu chấm điểm sẽ tự động xuất hiện khi MC chọn đội thi.</p>
                </div>`
              : `
              <div style="display: flex; align-items: center; gap: 0.85rem; margin-bottom: 1.2rem;">
                ${renderAvatarHtml(activeTeam, "team-avatar-lg")}
                <div>
                  <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">
                    Đội đang thi đấu
                  </div>
                  <h2 style="font-family: var(--font-serif); font-size: 1.5rem; margin: 0;">
                    ${escapeHtml(activeTeam.name)}
                  </h2>
                </div>
              </div>

              ${
                topicText
                  ? `<div style="background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.85rem 1rem; margin-bottom: 1.5rem; font-size: 0.96rem; line-height: 1.45;">
                      <strong>Nội dung:</strong> ${escapeHtml(topicText)}
                    </div>`
                  : ""
              }

              <!-- Content Score Input -->
              <div class="judge-score-input-group">
                <div style="display: flex; justify-content: space-between; font-weight: 700;">
                  <span>Điểm nội dung:</span>
                  <span style="color: var(--accent); font-family: var(--font-mono);">Tối đa ${maxContent}đ</span>
                </div>
                <div class="judge-stepper-wrap">
                  <button type="button" class="judge-stepper-btn" id="btn-content-minus" ${isLocked ? "disabled" : ""}>-1</button>
                  <input
                    type="number"
                    id="input-content"
                    class="judge-score-input"
                    value="${contentVal}"
                    min="0"
                    max="${maxContent}"
                    step="0.5"
                    ${isLocked ? "disabled" : ""}
                  />
                  <button type="button" class="judge-stepper-btn" id="btn-content-plus" ${isLocked ? "disabled" : ""}>+1</button>
                </div>
              </div>

              <!-- Manner Score Input -->
              <div class="judge-score-input-group">
                <div style="display: flex; justify-content: space-between; font-weight: 700;">
                  <span>Điểm hình thức / tác phong:</span>
                  <span style="color: var(--accent); font-family: var(--font-mono);">Tối đa ${maxManner}đ</span>
                </div>
                <div class="judge-stepper-wrap">
                  <button type="button" class="judge-stepper-btn" id="btn-manner-minus" ${isLocked ? "disabled" : ""}>-0.5</button>
                  <input
                    type="number"
                    id="input-manner"
                    class="judge-score-input"
                    value="${mannerVal}"
                    min="0"
                    max="${maxManner}"
                    step="0.5"
                    ${isLocked ? "disabled" : ""}
                  />
                  <button type="button" class="judge-stepper-btn" id="btn-manner-plus" ${isLocked ? "disabled" : ""}>+0.5</button>
                </div>
              </div>

              <!-- Live Total -->
              <div style="display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; background-color: var(--surface); border: 2px dashed var(--border); border-radius: var(--radius-md); margin-top: 1.5rem;">
                <span style="font-weight: 700; font-size: 1.15rem;">Tổng điểm của bạn:</span>
                <span id="judge-live-total" style="font-family: var(--font-mono); font-size: 2rem; font-weight: 900; color: var(--accent);">
                  ${(contentVal + mannerVal).toFixed(1)}đ
                </span>
              </div>

              <div style="margin-top: 1.5rem;">
                <button type="button" id="btn-save-score" class="btn btn-primary btn-lg" style="width: 100%; justify-content: center;" ${isLocked ? "disabled" : ""}>
                  ✓ Lưu điểm cho ${escapeHtml(activeTeam.name)}
                </button>
              </div>
            `
          }
        </main>
      `;

      wireHeaderControls();

      if (!activeTeam || isLocked) return;

      const contentInput = document.getElementById("input-content");
      const mannerInput = document.getElementById("input-manner");
      const totalDisplay = document.getElementById("judge-live-total");

      function updateTotal() {
        const c = clampScore(contentInput?.value, maxContent);
        const m = clampScore(mannerInput?.value, maxManner);
        if (totalDisplay) {
          totalDisplay.textContent = `${(c + m).toFixed(1)}đ`;
        }
      }

      document.getElementById("btn-content-minus")?.addEventListener("click", () => {
        if (!contentInput) return;
        contentInput.value = Math.max(0, (Number(contentInput.value) || 0) - 1);
        updateTotal();
      });

      document.getElementById("btn-content-plus")?.addEventListener("click", () => {
        if (!contentInput) return;
        contentInput.value = Math.min(maxContent, (Number(contentInput.value) || 0) + 1);
        updateTotal();
      });

      document.getElementById("btn-manner-minus")?.addEventListener("click", () => {
        if (!mannerInput) return;
        mannerInput.value = Math.max(0, (Number(mannerInput.value) || 0) - 0.5);
        updateTotal();
      });

      document.getElementById("btn-manner-plus")?.addEventListener("click", () => {
        if (!mannerInput) return;
        mannerInput.value = Math.min(maxManner, (Number(mannerInput.value) || 0) + 0.5);
        updateTotal();
      });

      contentInput?.addEventListener("input", updateTotal);
      mannerInput?.addEventListener("input", updateTotal);

      document.getElementById("btn-save-score")?.addEventListener("click", async () => {
        const c = clampScore(contentInput?.value, maxContent);
        const m = clampScore(mannerInput?.value, maxManner);
        const path = `live/judgeScores/${roundKey}/${activeTeamId}/${selectedJudgeId}`;

        await set(path, { content: c, manner: m });
        showToast(`Đã lưu điểm cho ${activeTeam.name}: ${(c + m).toFixed(1)}đ`);
      });
    }

    function renderRound2View(root) {
      const q = liveState.round2?.activeQuestion;
      const status = liveState.round2?.status || "idle";
      const answers = liveState.round2?.answers || {};
      const results = liveState.round2?.results || {};

      const teamsListHtml = quizData.teams
        .map((team) => {
          const ansRecord = answers[team.id];
          const resRecord = results[team.id];
          const answered = Boolean(ansRecord);
          return `
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background-color: var(--surface);">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              ${renderAvatarHtml(team, "team-avatar-sm")}
              <span style="font-weight: 600; font-size: 0.95rem;">${escapeHtml(team.name)}</span>
            </div>
            <div>
              ${
                status === "revealed" && resRecord
                  ? `<span style="font-family: var(--font-mono); font-weight: 800; color: ${resRecord.isCorrect ? "#2E7D4F" : "#C94A38"};">
                      ${resRecord.answer} (${resRecord.isCorrect ? `+${resRecord.points}đ` : "0đ"})
                    </span>`
                  : answered
                    ? `<span style="color: var(--success); font-weight: 700; font-size: 0.88rem;">✓ Đã trả lời</span>`
                    : `<span style="color: var(--text-muted); font-size: 0.88rem;">Chưa chọn</span>`
              }
            </div>
          </div>
        `;
        })
        .join("");

      root.innerHTML = `
        ${renderJudgeHeader()}

        <main class="tablet-stage-card">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem;">
            <span class="meta-pill accent">${escapeHtml(quizData.config.round2_name)}</span>
            <span style="font-size: 0.88rem; color: var(--text-muted); font-weight: 600;">Theo dõi trực tiếp</span>
          </div>

          <div style="margin-bottom: 1.5rem;">
            <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">
              Câu hỏi hiện tại
            </div>
            <p style="font-size: 1.15rem; font-weight: 700; margin: 0.35rem 0 0;">
              ${q ? escapeHtml(q.question) : "MC chưa mở câu hỏi."}
            </p>
          </div>

          <h3 style="font-size: 1rem; margin: 0 0 0.75rem;">Bảng theo dõi các đội thi:</h3>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.65rem;">
            ${teamsListHtml}
          </div>
        </main>
      `;

      wireHeaderControls();
    }

    function wireHeaderControls() {
      document.getElementById("btn-change-judge")?.addEventListener("click", () => {
        saveSelectedJudge("");
      });
      document.getElementById("btn-lock-judge")?.addEventListener("click", () => {
        lockAppSession("judge", quizData.config);
      });
    }

    function renderJudgePortal() {
      const root = document.getElementById("judge-app-root");
      if (!root || !quizData) return;

      if (!selectedJudgeId) {
        renderJudgePicker(root);
        return;
      }

      const currentRound = liveState.currentRound || "round1";
      if (currentRound === "round2") {
        renderRound2View(root);
      } else {
        renderRound1Or3Scoring(root, currentRound);
      }
    }

    async function initJudge() {
      quizData = await fetchQuizData({ portal: "judge" });
      document.title = `Ban Giám Khảo - ${quizData.config.show_title}`;

      let lastJudgeSubscribedQKey = null;
      let judgeAnswersUnsub = null;

      // Subscribe to live state from host and database
      listen("live", (data) => {
        if (!data) return;
        liveState = { ...liveState, ...data };
        const qKey = liveState.round2?.questionKey;
        if (qKey && qKey !== lastJudgeSubscribedQKey) {
          lastJudgeSubscribedQKey = qKey;
          if (judgeAnswersUnsub) judgeAnswersUnsub();
          judgeAnswersUnsub = listen(`answers/${qKey}`, (incomingAnswers) => {
            if (!liveState.round2) liveState.round2 = {};
            liveState.round2.answers = incomingAnswers || {};
            renderJudgePortal();
          });
        }
        renderJudgePortal();
      });

      renderJudgePortal();
    }

    initJudge();
  </script>
</body>
</html>
