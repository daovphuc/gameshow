  <!-- Building base and colonnade -->
  <rect x="12" y="32" width="40" height="20" rx="1" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <!-- Arched doors -->
  <path d="M18 52v-8a4 4 0 0 1 8 0v8h-8zM38 52v-8a4 4 0 0 1 8 0v8h-8zM28 52v-10a4 4 0 0 1 8 0v10h-8z" fill="#B45309"/>
  <!-- Roof -->
  <path d="M8 32l8-10h32l8 10H8z" fill="#B91C1C"/>
  <!-- Twin dragons on roof -->
  <path d="M18 18c3-4 7-2 10 2" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <path d="M46 18c-3-4-7-2-10 2" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <!-- Center pearl/globe -->
