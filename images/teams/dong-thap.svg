<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Sếu đầu đỏ & Sen Tháp Mười - Đồng Tháp -->
  <!-- Lotus at bottom -->
  <path d="M12 56c8-6 16-6 20 0 4-6 12-6 20 0" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Flying Red-crowned Crane -->
  <!-- Crane slender body -->
  <path d="M24 32c4-2 10-2 16 2l8 8-4 2-12-6-8-6z" fill="#E2E8F0"/>
  <!-- Wings spreading -->
  <path d="M30 30L20 8l10 14 12-4-8 12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Black wingtips -->
  <path d="M20 8l4 6-2 4-4-4 2-6z" fill="#0F172A"/>
  <!-- Long slender neck & beak -->
  <path d="M40 34c4 2 10 2 14-2l4 1-6 3-8 1-4-3z" fill="#E2E8F0"/>
  <!-- Distinctive red crown (đầu đỏ) -->
  <circle cx="53" cy="33" r="2.5" fill="#EF4444"/>
  <!-- Trailing legs -->
  <path d="M24 34L8 42M26 36L10 46" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
</svg>