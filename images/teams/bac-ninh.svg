<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Nón quai thao Quan họ - Bắc Ninh -->
  <!-- Flat wide brim hat body -->
  <ellipse cx="32" cy="24" rx="26" ry="10" fill="#FEF08A" stroke="#EAB308" stroke-width="2"/>
  <!-- Top crown dome -->
  <ellipse cx="32" cy="22" rx="14" ry="5" fill="#FDE047"/>
  <!-- Conical hat rings -->
  <ellipse cx="32" cy="24" rx="20" ry="7" stroke="#CA8A04" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- Silk ribbon straps (Quai thao) -->
  <path d="M18 28c4 14 8 26 12 30" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
  <path d="M46 28c-4 14-8 26-12 30" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
  <!-- Silk tassel knot -->
  <circle cx="30" cy="58" r="2.5" fill="#DB2777"/>
  <path d="M30 58v4" stroke="#DB2777" stroke-width="2"/>
</svg>