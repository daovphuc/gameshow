<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Đội Thi Đấu - Hội Thi PCCC &amp; CNCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="tablet-container">
    <div id="team-app-root"></div>
  </div>

  <script type="module">
    import {
      fetchQuizData,
      renderAvatarHtml,
      escapeHtml,
      showToast,
      lockAppSession
    } from "./js/app.js";
    import { resolveImageUrl } from "./js/data.js";
    import { formatTimer } from "./js/timer.js";
    import { set, listen, getServerTime, serverTimestamp } from "./js/backend.js";

    const TEAM_ID_KEY = "gameshow_team_id";

    let quizData = null;
    let selectedTeamId = localStorage.getItem(TEAM_ID_KEY) || "";
    let myAnswers = {};
    let currentTeamAnswerUnsub = null;
    let lastSubscribedQKey = null;

    // Live state mirror
    let liveState = {
      currentRound: "round1",
      round2: {
        status: "idle",
        questionKey: null,
        activeQuestion: null,
        shownAt: null,
        deadline: null,
        answers: {},
        results: null
      }
    };

    let timerInterval = null;

    function saveSelectedTeam(teamId) {
      selectedTeamId = teamId;
      if (teamId) {
        localStorage.setItem(TEAM_ID_KEY, teamId);
      } else {
        localStorage.removeItem(TEAM_ID_KEY);
      }
      renderTeamPortal();
    }

    function renderTeamPicker(root) {
      const teams = quizData.teams || [];
      const cardsHtml = teams
        .map(
          (t) => `
          <button type="button" class="btn btn-lg" style="width: 100%; justify-content: flex-start; gap: 1rem; padding: 1.1rem 1.4rem; font-size: 1.15rem;" data-pick-team="${escapeHtml(t.id)}">
            ${renderAvatarHtml(t, "team-avatar-sm")}
            <span style="font-weight: 700;">${escapeHtml(t.name)}</span>
          </button>
        `
        )
        .join("");

      root.innerHTML = `
        <div class="tablet-stage-card" style="margin-top: 1.5rem;">
          <h1 style="font-family: var(--font-serif); font-size: 1.8rem; margin: 0 0 0.5rem; text-align: center;">
            Đăng Nhập Thiết Bị Đội Thi
          </h1>
          <p style="text-align: center; color: var(--text-muted); margin: 0 0 1.8rem;">
            Theo quy định Điều lệ, mỗi đội thi sử dụng 01 thiết bị đăng nhập bằng tên đội của mình.
          </p>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.85rem;">
            ${cardsHtml}
          </div>
        </div>
      `;

      root.querySelectorAll("[data-pick-team]").forEach((btn) => {
        btn.addEventListener("click", () => {
          saveSelectedTeam(btn.dataset.pickTeam);
        });
      });
    }

    function renderTeamHeader() {
      const team = quizData.teams.find((t) => t.id === selectedTeamId) || { name: selectedTeamId };

      return `
        <header class="tablet-header">
          <div class="tablet-identity-banner">
            ${renderAvatarHtml(team, "team-avatar-sm")}
            <div>
              <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">
                Đội Thi Đấu
              </div>
              <div class="tablet-identity-name">${escapeHtml(team.name)}</div>
            </div>
          </div>

          <div style="display: flex; gap: 0.5rem;">
            <button type="button" id="btn-change-team" class="btn btn-sm">
              Đổi đội
            </button>
            <button type="button" id="btn-lock-team" class="btn btn-sm">
              🔒 Khóa
            </button>
          </div>
        </header>
      `;
    }

    function stopTimerLoop() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function startTimerLoop() {
      stopTimerLoop();
      timerInterval = setInterval(() => {
        const deadline = liveState.round2?.deadline;
        if (!deadline) return;
        const now = getServerTime();
        const remMs = Math.max(0, deadline - now);
        const remSec = Math.ceil(remMs / 1000);

        const digits = document.getElementById("team-timer-digits");
        const box = document.getElementById("team-timer-box");
        if (digits) digits.textContent = formatTimer(remSec);
        if (box) {
          box.classList.toggle("warning", remSec <= 5 && remSec > 0);
          box.classList.toggle("finished", remSec <= 0);
        }

        if (remMs <= 0) {
          stopTimerLoop();
          disableAnswerButtons();
        }
      }, 100);
    }

    function disableAnswerButtons() {
      document.querySelectorAll(".team-btn-choice").forEach((btn) => {
        btn.disabled = true;
      });
    }

    async function handleChoice(letter) {
      if (!selectedTeamId || !letter) return;
      const r2 = liveState.round2;
      if (r2.status !== "open" || !r2.questionKey) return;

      const now = getServerTime();
      if (r2.deadline && now > r2.deadline) {
        showToast("Đã hết giờ trả lời!");
        return;
      }

      // Check if already answered locally
      if (myAnswers[r2.questionKey]) {
        return;
      }

      // Lock buttons immediately for feedback
      disableAnswerButtons();
      const choiceBtn = document.querySelector(`[data-choice="${letter}"]`);
      if (choiceBtn) {
        choiceBtn.classList.add("selected");
      }

      const statusNote = document.getElementById("team-answer-status");
      if (statusNote) {
        statusNote.innerHTML = `
          <div style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1.25rem; border-radius: 100px; background-color: rgba(46, 125, 79, 0.12); color: #2E7D4F; font-weight: 700;">
            <span>✓ Đã ghi nhận đáp án: <strong>${letter}</strong></span>
          </div>
        `;
      }

      myAnswers[r2.questionKey] = letter;

      // Write answer directly to database path: answers/<questionKey>/<selectedTeamId>
      const path = `answers/${r2.questionKey}/${selectedTeamId}`;
      try {
        await set(path, {
          answer: letter,
          answeredAt: serverTimestamp()
        });
        showToast(`Đã gửi đáp án ${letter}!`);
      } catch (err) {
        showToast("Lỗi gửi đáp án. Vui lòng thử lại!");
      }
    }

    function renderWaitingScreen(root) {
      stopTimerLoop();
      root.innerHTML = `
        ${renderTeamHeader()}

        <main class="tablet-stage-card" style="text-align: center; padding: 4rem 1.5rem;">
          <div style="font-size: 3.5rem; margin-bottom: 1rem;">⏳</div>
          <h2 style="font-family: var(--font-serif); font-size: 1.6rem; margin: 0 0 0.6rem;">
            Đang Chờ Lệnh Thi Đấu
          </h2>
          <p style="color: var(--text-muted); font-size: 1.05rem; max-width: 480px; margin: 0 auto;">
            Màn hình sẽ tự động hiển thị câu hỏi và 4 nút chọn đáp án A / B / C / D khi Ban tổ chức bắt đầu phần thi trắc nghiệm.
          </p>
        </main>
      `;

      wireHeaderControls();
    }

    function renderQuestionScreen(root) {
      const r2 = liveState.round2;
      const q = r2.activeQuestion;
      if (!q) {
        renderWaitingScreen(root);
        return;
      }

      const mySavedAnswer = (r2.questionKey && myAnswers[r2.questionKey]) || r2.results?.[selectedTeamId]?.answer;
      const hasAnswered = Boolean(mySavedAnswer);
      const chosenLetter = mySavedAnswer;

      const isRevealed = r2.status === "revealed";
      const isLocked = r2.status === "locked" || isRevealed;

      const result = r2.results?.[selectedTeamId];
      const correctLetter = isRevealed && q.correct ? String(q.correct).toUpperCase() : "";

      const options = [
        { letter: "A", text: q.option_a, cls: "choice-a" },
        { letter: "B", text: q.option_b, cls: "choice-b" },
        { letter: "C", text: q.option_c, cls: "choice-c" },
        { letter: "D", text: q.option_d, cls: "choice-d" }
      ];

      const choicesHtml = options
        .map((opt) => {
          const isSelected = chosenLetter === opt.letter;
          let extraCls = "";
          if (isSelected) extraCls += " selected";
          if (isRevealed) {
            if (correctLetter === opt.letter) {
              extraCls += " revealed-correct";
            } else if (isSelected && !result?.isCorrect) {
              extraCls += " revealed-wrong";
            }
          }

          const shouldDisable = hasAnswered || isLocked;

          return `
            <button
              type="button"
              class="team-btn-choice ${opt.cls} ${extraCls}"
              data-choice="${opt.letter}"
              ${shouldDisable ? "disabled" : ""}
            >
              <span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 10px; background: rgba(0,0,0,0.2); font-size: 1.4rem; font-weight: 900;">
                ${opt.letter}
              </span>
              <span style="flex: 1; font-size: 1.15rem; line-height: 1.3;">
                ${escapeHtml(opt.text)}
              </span>
            </button>
          `;
        })
        .join("");

      root.innerHTML = `
        ${renderTeamHeader()}

        <main class="tablet-stage-card">
          <!-- Top Bar: Question number + Countdown -->
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;">
            <span class="meta-pill accent">Câu hỏi #${q.number || 1}</span>

            <div id="team-timer-box" class="top-timer-box">
              <span id="team-timer-digits" class="top-timer-digits">00:00</span>
            </div>
          </div>

          <!-- Question Text -->
          <div style="margin-bottom: 1.5rem;">
            <p style="font-size: clamp(1.2rem, 2.2vw, 1.6rem); font-weight: 700; line-height: 1.35; margin: 0 0 1rem;">
              ${escapeHtml(q.question)}
            </p>
            ${
              resolveImageUrl(q.image_url)
                ? `<div style="text-align: center; margin: 1rem 0;">
                    <img src="${escapeHtml(resolveImageUrl(q.image_url))}" alt="" style="max-height: 220px; max-width: 100%; border-radius: var(--radius-md);" />
                  </div>`
                : ""
            }
          </div>

          <!-- Status Banner -->
          <div id="team-answer-status" style="text-align: center; min-height: 42px; margin-bottom: 1rem;">
            ${
              isRevealed && result
                ? `<div style="display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.75rem 1.5rem; border-radius: 100px; font-weight: 800; font-size: 1.1rem; background-color: ${result.isCorrect ? "rgba(46, 125, 79, 0.15)" : "rgba(201, 74, 56, 0.15)"}; color: ${result.isCorrect ? "#2E7D4F" : "#C94A38"};">
                    <span>${result.isCorrect ? `✓ Chính xác! (+${result.points} điểm)` : `✕ Rất tiếc! Đáp án đúng là ${correctLetter}`}</span>
                  </div>`
                : hasAnswered
                  ? `<div style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1.25rem; border-radius: 100px; background-color: rgba(46, 125, 79, 0.12); color: #2E7D4F; font-weight: 700;">
                      <span>✓ Đã ghi nhận đáp án: <strong>${chosenLetter}</strong></span>
                    </div>`
                  : isLocked
                    ? `<div style="color: var(--text-muted); font-weight: 700;">Đã hết giờ làm bài</div>`
                    : `<div style="color: var(--text-muted); font-weight: 600;">Chạm vào 1 trong 4 đáp án bên dưới để trả lời:</div>`
            }
          </div>

          <!-- 4 Big Choice Buttons -->
          <div class="team-answers-grid">
            ${choicesHtml}
          </div>
        </main>
      `;

      wireHeaderControls();

      if (!hasAnswered && !isLocked) {
        root.querySelectorAll(".team-btn-choice").forEach((btn) => {
          btn.addEventListener("click", () => {
            handleChoice(btn.dataset.choice);
          });
        });
      }

      if (r2.status === "open") {
        startTimerLoop();
      } else {
        stopTimerLoop();
      }
    }

    function wireHeaderControls() {
      document.getElementById("btn-change-team")?.addEventListener("click", () => {
        saveSelectedTeam("");
      });
      document.getElementById("btn-lock-team")?.addEventListener("click", () => {
        lockAppSession("team", quizData.config);
      });
    }

    function renderTeamPortal() {
      const root = document.getElementById("team-app-root");
      if (!root || !quizData) return;

      if (!selectedTeamId) {
        renderTeamPicker(root);
        return;
      }

      const r2 = liveState.round2;
      if (liveState.currentRound === "round2" && (r2.status === "open" || r2.status === "locked" || r2.status === "revealed")) {
        renderQuestionScreen(root);
      } else {
        renderWaitingScreen(root);
      }
    }

    async function initTeam() {
      quizData = await fetchQuizData({ portal: "team" });
      document.title = `Đội Thi - ${quizData.config.show_title}`;

      // Listen for live round and question broadcasts
      listen("live", (data) => {
        if (!data) return;
        liveState = { ...liveState, ...data };
        const qKey = liveState.round2?.questionKey;
        if (qKey && selectedTeamId && qKey !== lastSubscribedQKey) {
          lastSubscribedQKey = qKey;
          if (currentTeamAnswerUnsub) currentTeamAnswerUnsub();
          currentTeamAnswerUnsub = listen(`answers/${qKey}/${selectedTeamId}`, (ans) => {
            if (ans?.answer) {
              myAnswers[qKey] = ans.answer;
              renderTeamPortal();
            }
          });
        }
        renderTeamPortal();
      });

      renderTeamPortal();
    }

    initTeam();
  </script>
</body>
</html>
