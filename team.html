<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Đội Thi Đấu - Hội Thi PCCC &amp; CNCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="tablet-container">
    <div id="team-app-root"></div>
  </div>

  <script type="module">
    import {
      fetchQuizData,
      renderAvatarHtml,
      escapeHtml,
      showToast,
      logoutUser
    } from "./js/app.js";
    import { resolveImageUrl } from "./js/data.js";
    import { isTeamInRound } from "./js/content.js";
    import { formatTimer } from "./js/timer.js";
    import { set, listen, getServerTime, serverTimestamp, onStatusChange } from "./js/backend.js";
    import { getActiveSession } from "./js/auth.js";

    let quizData = null;
    let selectedTeamId = "";
    let teamDisplayName = "";
    let myAnswers = {};
    let currentTeamAnswerUnsub = null;
    let lastSubscribedQKey = null;

    let connStatus = { code: "local", label: "Chế độ thử trên 1 máy" };

    // Live state mirror
    const initialLiveState = () => ({
      currentRound: "round1",
      stageTeamId: null,
      round1: {},
      round2: {
        status: "idle",
        questionKey: null,
        activeQuestion: null,
        shownAt: null,
        deadline: null,
        answers: {},
        results: null
      },
      round3: {}
    });
    let liveState = initialLiveState();

    let timerInterval = null;

    function renderTeamHeader() {
      const team = quizData.teams.find((t) => t.id === selectedTeamId) || { name: teamDisplayName || selectedTeamId };

      return `
        <header class="tablet-header">
          <div class="tablet-identity-banner">
            ${renderAvatarHtml(team, "team-avatar-sm")}
            <div>
              <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">
                Đội Thi Đấu
              </div>
              <div class="tablet-identity-name">${escapeHtml(team.name)}</div>
            </div>
          </div>

          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <div class="conn-status-badge ${connStatus.code || 'local'}" title="${escapeHtml(connStatus.label)}">
              <span class="conn-status-dot"></span>
              <span style="font-size: 0.8rem;">${escapeHtml(connStatus.label)}</span>
            </div>

            <button type="button" id="btn-team-logout" class="btn btn-sm">
              ⎋ Đăng xuất (${escapeHtml(team.name)})
            </button>
          </div>
        </header>
      `;
    }

    function stopTimerLoop() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function startTimerLoop() {
      stopTimerLoop();
      timerInterval = setInterval(() => {
        const deadline = liveState.round2?.deadline;
        if (!deadline) return;
        const now = getServerTime();
        const remMs = Math.max(0, deadline - now);
        const remSec = Math.ceil(remMs / 1000);

        const digits = document.getElementById("team-timer-digits");
        const box = document.getElementById("team-timer-box");
        if (digits) digits.textContent = formatTimer(remSec);
        if (box) {
          box.classList.toggle("warning", remSec <= 5 && remSec > 0);
          box.classList.toggle("finished", remSec <= 0);
        }

        if (remMs <= 0) {
          stopTimerLoop();
          disableAnswerButtons();
        }
      }, 100);
    }

    function disableAnswerButtons() {
      document.querySelectorAll(".team-btn-choice").forEach((btn) => {
        btn.disabled = true;
      });
    }

    async function handleChoice(letter) {
      if (!selectedTeamId || !letter) return;
      if (!isTeamInRound(selectedTeamId, quizData.teams, quizData.round_order, "round2")) {
        showToast("Đội không tham gia thi vòng này!");
        return;
      }

      const r2 = liveState.round2;
      if (r2.status !== "open" || !r2.questionKey) return;

      const now = getServerTime();
      if (r2.deadline && now > r2.deadline) {
        showToast("Đã hết giờ trả lời!");
        return;
      }

      // Check if already answered locally
      if (myAnswers[r2.questionKey]) {
        return;
      }

      // Lock buttons immediately for feedback
      disableAnswerButtons();
      const choiceBtn = document.querySelector(`[data-choice="${letter}"]`);
      if (choiceBtn) {
        choiceBtn.classList.add("selected");
      }

      const statusNote = document.getElementById("team-answer-status");
      if (statusNote) {
        statusNote.innerHTML = `
          <div style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1.25rem; border-radius: 100px; background-color: rgba(46, 125, 79, 0.12); color: var(--success); font-weight: 700;">
            <span>✓ Đã ghi nhận đáp án: <strong>${letter}</strong></span>
          </div>
        `;
      }

      myAnswers[r2.questionKey] = letter;

      // Write answer directly to database path: answers/<questionKey>/<selectedTeamId>
      const path = `answers/${r2.questionKey}/${selectedTeamId}`;
      try {
        await set(path, {
          answer: letter,
          answeredAt: serverTimestamp()
        });
        showToast(`Đã gửi đáp án ${letter}!`);
      } catch (err) {
        showToast("Lỗi gửi đáp án. Vui lòng thử lại!");
      }
    }

    function renderNonParticipatingScreen(root, roundKey) {
      stopTimerLoop();
      const roundName = roundKey === "round1"
        ? quizData.config.round1_name
        : roundKey === "round2"
          ? quizData.config.round2_name
          : quizData.config.round3_name;

      root.innerHTML = `
        ${renderTeamHeader()}

        <main class="tablet-stage-card" style="text-align: center; padding: 4.5rem 1.5rem;">
          <div style="margin-bottom: 1rem;">
            <span class="meta-pill accent">${escapeHtml(roundName)}</span>
          </div>
          <div style="font-size: 3.5rem; margin-bottom: 1rem;">ℹ️</div>
          <h2 style="font-family: var(--font-serif); font-size: 1.7rem; margin: 0 0 0.6rem;">
            Đội không tham gia vòng này
          </h2>
          <p style="color: var(--text-muted); font-size: 1.1rem; max-width: 520px; margin: 0 auto;">
            Theo danh sách và thứ tự thi đấu, đội của bạn không tham gia thi vòng này. Vui lòng chú ý theo dõi phần thi của các đội bạn!
          </p>
        </main>
      `;

      wireHeaderControls();
    }

    function renderRound1Or3WaitingScreen(root, roundKey) {
      stopTimerLoop();
      const isR1 = roundKey === "round1";
      const roundName = isR1 ? quizData.config.round1_name : quizData.config.round3_name;

      let isMyTurn = false;
      let stageTeam = null;
      let topicText = "";

      if (isR1) {
        const activeSession = liveState.round1?.activeSession;
        if (activeSession) {
          isMyTurn = activeSession.teamId === selectedTeamId;
          stageTeam = quizData.teams.find((t) => t.id === activeSession.teamId);
          topicText = activeSession.packageQuestion || "";
        } else if (liveState.stageTeamId) {
          isMyTurn = liveState.stageTeamId === selectedTeamId;
          stageTeam = quizData.teams.find((t) => t.id === liveState.stageTeamId);
        }
      } else {
        const activeTile = liveState.round3?.activeTile;
        if (activeTile) {
          isMyTurn = activeTile.selectedTeamId === selectedTeamId;
          stageTeam = quizData.teams.find((t) => t.id === activeTile.selectedTeamId);
          topicText = activeTile.question || "";
        }
      }

      root.innerHTML = `
        ${renderTeamHeader()}

        <main class="tablet-stage-card" style="text-align: center; padding: 3.5rem 1.5rem;">
          <div style="margin-bottom: 1.25rem;">
            <span class="meta-pill accent">${escapeHtml(roundName)}</span>
          </div>

          ${
            isMyTurn
              ? `
                <div style="font-size: 3.5rem; margin-bottom: 0.8rem;">🔔</div>
                <h2 style="font-family: var(--font-serif); font-size: clamp(1.6rem, 3.2vw, 2.2rem); margin: 0 0 0.8rem; color: var(--accent);">
                  ĐẾN LƯỢT ĐỘI CỦA BẠN LÊN SÂN KHẤU!
                </h2>
                <p style="font-size: 1.15rem; color: var(--text-muted); max-width: 550px; margin: 0 auto 1.5rem;">
                  Đội của bạn đang thực hiện phần thi trên sân khấu. Hãy chuẩn bị và tự tin trả lời!
                </p>

                ${
                  topicText
                    ? `<div style="text-align: left; max-width: 600px; margin: 1.5rem auto 0; padding: 1.2rem; border-radius: var(--radius-md); background-color: var(--surface-elevated); border: 1px solid var(--border);">
                        <strong style="display: block; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.4rem;">
                          ${isR1 ? "Gói câu hỏi bốc thăm:" : "Tình huống truyền thông:"}
                        </strong>
                        <div style="font-size: 1.15rem; font-weight: 600; line-height: 1.4;">
                          ${escapeHtml(topicText)}
                        </div>
                      </div>`
                    : ""
                }
              `
              : stageTeam
                ? `
                  <div style="font-size: 3.2rem; margin-bottom: 1rem;">🎤</div>
                  <h2 style="font-family: var(--font-serif); font-size: 1.6rem; margin: 0 0 0.6rem;">
                    Đang thi đấu: <strong>${escapeHtml(stageTeam.name)}</strong>
                  </h2>
                  <p style="color: var(--text-muted); font-size: 1.05rem; max-width: 500px; margin: 0 auto;">
                    Đội của bạn đang ở hàng ghế chờ. Màn hình sẽ tự động thông báo khi đến lượt đội của bạn.
                  </p>
                `
                : `
                  <div style="font-size: 3.2rem; margin-bottom: 1rem;">⏳</div>
                  <h2 style="font-family: var(--font-serif); font-size: 1.6rem; margin: 0 0 0.6rem;">
                    Đang Chờ Lệnh Thi Đấu
                  </h2>
                  <p style="color: var(--text-muted); font-size: 1.05rem; max-width: 500px; margin: 0 auto;">
                    Ban tổ chức chuẩn bị bắt đầu phần thi. Màn hình sẽ tự động cập nhật theo tiến trình hội thi.
                  </p>
                `
          }
        </main>
      `;

      wireHeaderControls();
    }

    function renderRound2WaitingScreen(root) {
      stopTimerLoop();
      root.innerHTML = `
        ${renderTeamHeader()}

        <main class="tablet-stage-card" style="text-align: center; padding: 4rem 1.5rem;">
          <div style="margin-bottom: 1rem;">
            <span class="meta-pill accent">${escapeHtml(quizData.config.round2_name)}</span>
          </div>
          <div style="font-size: 3.5rem; margin-bottom: 1rem;">⚡</div>
          <h2 style="font-family: var(--font-serif); font-size: 1.7rem; margin: 0 0 0.6rem;">
            Chuẩn Bị Trả Lời Trắc Nghiệm
          </h2>
          <p style="color: var(--text-muted); font-size: 1.1rem; max-width: 520px; margin: 0 auto;">
            Màn hình sẽ tự động hiển thị câu hỏi và 4 nút chọn A / B / C / D khi MC phát lệnh tính giờ.
          </p>
        </main>
      `;

      wireHeaderControls();
    }

    function renderQuestionScreen(root) {
      const r2 = liveState.round2;
      const q = r2.activeQuestion;
      if (!q) {
        renderRound2WaitingScreen(root);
        return;
      }

      const mySavedAnswer = (r2.questionKey && myAnswers[r2.questionKey]) || r2.results?.[selectedTeamId]?.answer;
      const hasAnswered = Boolean(mySavedAnswer);
      const chosenLetter = mySavedAnswer;

      const isRevealed = r2.status === "revealed";
      const isLocked = r2.status === "locked" || isRevealed;

      const result = r2.results?.[selectedTeamId];
      const correctLetter = isRevealed && q.correct ? String(q.correct).toUpperCase() : "";

      const options = [
        { letter: "A", text: q.option_a, cls: "choice-a" },
        { letter: "B", text: q.option_b, cls: "choice-b" },
        { letter: "C", text: q.option_c, cls: "choice-c" },
        { letter: "D", text: q.option_d, cls: "choice-d" }
      ];

      const choicesHtml = options
        .map((opt) => {
          const isSelected = chosenLetter === opt.letter;
          let extraCls = "";
          if (isSelected) extraCls += " selected";
          if (isRevealed) {
            if (correctLetter === opt.letter) {
              extraCls += " revealed-correct";
            } else if (isSelected && !result?.isCorrect) {
              extraCls += " revealed-wrong";
            }
          }

          const shouldDisable = hasAnswered || isLocked;

          return `
            <button
              type="button"
              class="team-btn-choice ${opt.cls} ${extraCls}"
              data-choice="${opt.letter}"
              ${shouldDisable ? "disabled" : ""}
            >
              <span style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; background: rgba(0,0,0,0.22); font-size: 1.5rem; font-weight: 900;">
                ${opt.letter}
              </span>
              <span style="flex: 1; font-size: 1.15rem; line-height: 1.35;">
                ${escapeHtml(opt.text)}
              </span>
            </button>
          `;
        })
        .join("");

      root.innerHTML = `
        ${renderTeamHeader()}

        <main class="tablet-stage-card">
          <!-- Top Bar: Question number + Countdown -->
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;">
            <span class="meta-pill accent">Câu hỏi #${q.number || 1}</span>

            <div id="team-timer-box" class="top-timer-box">
              <span id="team-timer-digits" class="top-timer-digits">00:00</span>
            </div>
          </div>

          <!-- Question Text -->
          <div style="margin-bottom: 1.5rem;">
            <p style="font-size: clamp(1.25rem, 2.3vw, 1.65rem); font-weight: 700; line-height: 1.35; margin: 0 0 1rem;">
              ${escapeHtml(q.question)}
            </p>
            ${
              resolveImageUrl(q.image_url)
                ? `<div style="text-align: center; margin: 1rem 0;">
                    <img src="${escapeHtml(resolveImageUrl(q.image_url))}" alt="" style="max-height: 220px; max-width: 100%; border-radius: var(--radius-md);" />
                  </div>`
                : ""
            }
          </div>

          <!-- Status Banner -->
          <div id="team-answer-status" style="text-align: center; min-height: 44px; margin-bottom: 1rem;">
            ${
              isRevealed && result
                ? `<div style="display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.75rem 1.5rem; border-radius: 100px; font-weight: 800; font-size: 1.15rem; background-color: ${result.isCorrect ? "rgba(46, 125, 79, 0.15)" : "rgba(201, 74, 56, 0.15)"}; color: ${result.isCorrect ? "#2E7D4F" : "#C94A38"};">
                    <span>${result.isCorrect ? `✓ Chính xác! (+${result.points} điểm)` : `✕ Rất tiếc! Đáp án đúng là ${correctLetter}`}</span>
                  </div>`
                : hasAnswered
                  ? `<div style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1.25rem; border-radius: 100px; background-color: rgba(46, 125, 79, 0.12); color: #2E7D4F; font-weight: 700;">
                      <span>✓ Đã ghi nhận đáp án: <strong>${chosenLetter}</strong></span>
                    </div>`
                  : isLocked
                    ? `<div style="color: var(--text-muted); font-weight: 700; font-size: 1.05rem;">Đã hết giờ làm bài</div>`
                    : `<div style="color: var(--text-muted); font-weight: 600; font-size: 1.05rem;">Chạm vào 1 trong 4 đáp án bên dưới để trả lời:</div>`
            }
          </div>

          <!-- 4 Big Choice Buttons -->
          <div class="team-answers-grid">
            ${choicesHtml}
          </div>
        </main>
      `;

      wireHeaderControls();

      if (!hasAnswered && !isLocked) {
        root.querySelectorAll(".team-btn-choice").forEach((btn) => {
          btn.addEventListener("click", () => {
            handleChoice(btn.dataset.choice);
          });
        });
      }

      if (r2.status === "open") {
        startTimerLoop();
      } else {
        stopTimerLoop();
      }
    }

    function wireHeaderControls() {
      document.getElementById("btn-team-logout")?.addEventListener("click", () => {
        logoutUser("team");
      });
    }

    function renderTeamPortal() {
      const root = document.getElementById("team-app-root");
      if (!root || !quizData) return;

      const curRound = liveState.currentRound || "round1";

      if (selectedTeamId && !isTeamInRound(selectedTeamId, quizData.teams, quizData.round_order, curRound)) {
        renderNonParticipatingScreen(root, curRound);
        return;
      }

      if (curRound === "round2") {
        const r2 = liveState.round2;
        if (r2?.status === "open" || r2?.status === "locked" || r2?.status === "revealed") {
          renderQuestionScreen(root);
        } else {
          renderRound2WaitingScreen(root);
        }
      } else {
        renderRound1Or3WaitingScreen(root, curRound);
      }
    }

    async function initTeam() {
      quizData = await fetchQuizData({ portal: "team" });

      const session = getActiveSession(undefined, "team");
      selectedTeamId = session?.ref_id || "";
      const matchedTeam = quizData.teams.find((t) => t.id === selectedTeamId);
      teamDisplayName = matchedTeam ? matchedTeam.name : (session?.display_name || "Đội thi");

      document.title = `Đội Thi (${teamDisplayName}) - ${quizData.config.show_title}`;

      onStatusChange((st) => {
        connStatus = st;
        const badge = document.querySelector(".tablet-header .conn-status-badge");
        if (badge) {
          badge.className = `conn-status-badge ${st.code || 'local'}`;
          badge.title = st.label || "Chế độ thử trên 1 máy";
          const labelSpan = badge.querySelector("span:not(.conn-status-dot)");
          if (labelSpan) labelSpan.textContent = st.label || "Chế độ thử trên 1 máy";
        }
      });

      // Listen for live round and question broadcasts
      listen("live", (data) => {
        if (!data) return;
        const prevRound2 = liveState.round2 || {};
        liveState = { ...initialLiveState(), ...data };
        if (prevRound2.answers && liveState.round2 && liveState.round2.questionKey === prevRound2.questionKey && !liveState.round2.answers) {
          liveState.round2 = { ...liveState.round2, answers: prevRound2.answers };
        }
        const qKey = liveState.round2?.questionKey;
        if (qKey && selectedTeamId && qKey !== lastSubscribedQKey) {
          lastSubscribedQKey = qKey;
          if (currentTeamAnswerUnsub) currentTeamAnswerUnsub();
          currentTeamAnswerUnsub = listen(`answers/${qKey}/${selectedTeamId}`, (ans) => {
            if (ans?.answer) {
              myAnswers[qKey] = ans.answer;
              renderTeamPortal();
            }
          });
        }
        renderTeamPortal();
      });

      renderTeamPortal();
    }

    initTeam();
  </script>
</body>
</html>
