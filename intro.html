<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lễ Khai Mạc - Hội Thi PCCC &amp; CNCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="ceremony-body">
  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar" aria-label="Thanh điều hướng bên trái"></aside>

    <main class="stage-main ceremony-stage-main">
      <div class="ceremony-container">
        <!-- Canvas for continuous fireworks on both sides -->
        <canvas id="ceremony-fireworks" class="ceremony-fireworks-canvas" aria-hidden="true"></canvas>

        <div class="ceremony-content">
          <!-- Authority / Host department header -->
          <div class="ceremony-agency-block">
            <div class="ceremony-agency-ministry">BỘ CÔNG AN</div>
            <div class="ceremony-agency-dept">CỤC CẢNH SÁT PCCC VÀ CNCH</div>
            <div class="ceremony-star-divider" aria-hidden="true">★ ★ ★</div>
          </div>

          <!-- Central Trống Đồng Bronze Drum Pattern -->
          <div class="ceremony-drum-wrap" aria-hidden="true">
            <svg class="ceremony-bronze-drum" viewBox="0 0 500 500">
              <defs>
                <radialGradient id="ceremonyDrumGold" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#FFE082" stop-opacity="0.9" />
                  <stop offset="45%" stop-color="#D97706" stop-opacity="0.6" />
                  <stop offset="85%" stop-color="#B45309" stop-opacity="0.3" />
                  <stop offset="100%" stop-color="#78350F" stop-opacity="0.05" />
                </radialGradient>
              </defs>
              <circle cx="250" cy="250" r="242" fill="none" stroke="currentColor" stroke-width="3" opacity="0.4" stroke-dasharray="8 6" />
              <circle cx="250" cy="250" r="226" fill="none" stroke="currentColor" stroke-width="2" opacity="0.6" />
              <circle cx="250" cy="250" r="208" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5" stroke-dasharray="3 4" />
              <circle cx="250" cy="250" r="185" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.7" />
              <circle cx="250" cy="250" r="158" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5" stroke-dasharray="6 6" />
              <circle cx="250" cy="250" r="130" fill="none" stroke="currentColor" stroke-width="2" opacity="0.6" />
              <circle cx="250" cy="250" r="95" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7" />
              <circle cx="250" cy="250" r="60" fill="none" stroke="currentColor" stroke-width="2" opacity="0.8" />
              <circle cx="250" cy="250" r="248" fill="url(#ceremonyDrumGold)" opacity="0.35" />
              <!-- 14-pointed central star of Dong Son bronze drum -->
              <polygon points="250,195 260,235 298,215 273,245 305,250 273,255 298,285 260,265 250,305 240,265 202,285 227,255 195,250 227,245 202,215 240,235" fill="currentColor" opacity="0.85" />
            </svg>
          </div>

          <!-- Contest Name -->
          <div class="ceremony-title-block">
            <h1 id="intro-show-title" class="ceremony-contest-title">
              Hội thi cán bộ tuyên truyền, kiểm tra giỏi về PCCC và CNCH
            </h1>
          </div>

          <!-- Cluster, Venue, and Date -->
          <div class="ceremony-meta-block">
            <span id="intro-cluster-name" class="ceremony-pill ceremony-pill-cluster">Cụm thi đấu</span>
            <span id="intro-venue" class="ceremony-pill">📍 Địa điểm: Đang cập nhật</span>
            <span id="intro-date" class="ceremony-pill">📅 Thời gian: 2026</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { fetchQuizData, wireStageLayout } from "./js/app.js";

    function startCeremonyFireworks(canvas) {
      if (!canvas) return () => {};
      const ctx = canvas.getContext("2d");
      let animId = null;
      let width = (canvas.width = canvas.parentElement?.clientWidth || window.innerWidth);
      let height = (canvas.height = canvas.parentElement?.clientHeight || window.innerHeight);

      const resize = () => {
        if (!canvas.parentElement) return;
        width = canvas.width = canvas.parentElement.clientWidth;
        height = canvas.height = canvas.parentElement.clientHeight;
      };
      window.addEventListener("resize", resize);

      const particles = [];
      const rockets = [];
      const colors = ["#FFD700", "#FF4500", "#FF6347", "#00E5FF", "#76FF03", "#FF1744", "#E040FB", "#FFEA00"];

      function launchRocket(isLeft) {
        const startX = isLeft ? width * (0.04 + Math.random() * 0.18) : width * (0.78 + Math.random() * 0.18);
        const targetY = height * (0.12 + Math.random() * 0.38);
        const targetX = startX + (Math.random() - 0.5) * 50;
        const speed = 7 + Math.random() * 3.5;
        rockets.push({
          x: startX,
          y: height,
          targetX,
          targetY,
          speed,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }

      function explode(x, y, color) {
        const count = 35 + Math.floor(Math.random() * 20);
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
          const speed = 1.6 + Math.random() * 4.2;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            decay: 0.012 + Math.random() * 0.018,
            color,
            size: 1.8 + Math.random() * 1.8
          });
        }
      }

      let lastLaunchLeft = 0;
      let lastLaunchRight = 0;

      function loop(now) {
        ctx.clearRect(0, 0, width, height);

        if (now - lastLaunchLeft > 1100 + Math.random() * 800) {
          launchRocket(true);
          lastLaunchLeft = now;
        }
        if (now - lastLaunchRight > 1200 + Math.random() * 800) {
          launchRocket(false);
          lastLaunchRight = now;
        }

        // Update rockets
        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          r.y -= r.speed;
          r.x += (r.targetX - r.x) * 0.04;
          ctx.fillStyle = r.color;
          ctx.beginPath();
          ctx.arc(r.x, r.y, 2.5, 0, Math.PI * 2);
          ctx.fill();

          if (r.y <= r.targetY) {
            explode(r.x, r.y, r.color);
            rockets.splice(i, 1);
          }
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.05; // gravity
          p.vx *= 0.98;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            particles.splice(i, 1);
          } else {
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 6;
            ctx.shadowColor = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        animId = requestAnimationFrame(loop);
      }

      animId = requestAnimationFrame(loop);
      return () => {
        cancelAnimationFrame(animId);
        window.removeEventListener("resize", resize);
      };
    }

    async function initIntroPage() {
      const data = await fetchQuizData({ portal: "host" });
      const cfg = data.config || {};

      document.title = `${cfg.show_title || "Hội thi PCCC & CNCH"} - Giới thiệu`;

      const titleEl = document.getElementById("intro-show-title");
      if (titleEl && cfg.show_title) {
        titleEl.textContent = cfg.show_title;
      }

      // Determine active cluster, venue, date
      const clusters = data.clusters || [];
      let activeCluster = clusters[0] || null;
      if (cfg.show_subtitle) {
        const found = clusters.find((c) => c.subtitle === cfg.show_subtitle || (c.name && cfg.show_subtitle.includes(c.name)));
        if (found) activeCluster = found;
      }

      const clusterPill = document.getElementById("intro-cluster-name");
      const venuePill = document.getElementById("intro-venue");
      const datePill = document.getElementById("intro-date");

      if (activeCluster) {
        if (clusterPill) clusterPill.textContent = activeCluster.name || "Cụm thi đấu";
        if (venuePill) venuePill.textContent = activeCluster.venue ? `📍 ${activeCluster.venue}` : "📍 Hội trường thi";
        if (datePill) datePill.textContent = activeCluster.date ? `📅 ${activeCluster.date}` : "📅 Năm 2026";
      }

      const canvas = document.getElementById("ceremony-fireworks");
      startCeremonyFireworks(canvas);

      wireStageLayout({
        activePage: "intro",
        config: cfg,
        teams: data.teams
      });
    }

    initIntroPage();
  </script>
</body>
</html>
