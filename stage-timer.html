<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đồng Hồ Sân Khấu - Hội Thi PCCC &amp; CNCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body style="background: var(--bg); color: var(--text); overflow: hidden; margin: 0; padding: 0;">
  <div class="stage-timer-viewport">
    <!-- Header: Round Title + Phase Badge -->
    <header class="stage-timer-header">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <span id="st-round-title" class="stage-timer-round">HỘI THI PCCC &amp; CNCH</span>
        <span id="st-phase-badge" class="stage-timer-phase-badge" style="display: none;">CHUẨN BỊ</span>
      </div>
    </header>

    <!-- Center: Massive Digits Readable from 10m -->
    <main class="stage-timer-center">
      <div id="st-timer-digits" class="stage-timer-digits-giant">00:00</div>
      <div id="st-timer-label" style="font-size: clamp(1.2rem, 2.5vw, 2.2rem); font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 1rem; color: var(--text-muted); min-height: 2.5rem;">
        ĐANG CHỜ TÍNH GIỜ
      </div>
    </main>

    <!-- Footer: Stage Team Display -->
    <footer class="stage-timer-footer">
      <div class="stage-timer-team-display">
        <div id="st-team-avatar-slot"></div>
        <div>
          <div style="font-size: clamp(0.85rem, 1.2vw, 1.15rem); color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">
            Đội đang trên sân khấu
          </div>
          <div id="st-team-name" class="stage-timer-team-name">Chưa có đội</div>
        </div>
      </div>
    </footer>
  </div>

  <script type="module">
    import { fetchQuizData, renderAvatarHtml, escapeHtml } from "./js/app.js";
    import { formatTimer, getRemainingSeconds } from "./js/timer.js";
    import { listen, getServerTime } from "./js/backend.js";
    import { getActiveSession, isRoleAllowedForPortal } from "./js/auth.js";
    import { getRound3PhaseSeconds } from "./js/state.js";

    let quizData = null;
    let liveState = null;
    let tickInterval = null;

    async function initStageTimer() {
      const session = getActiveSession(undefined, "host") || getActiveSession(undefined, "head_judge");
      if (!session || !isRoleAllowedForPortal(session.role, "stage_timer")) {
        window.location.href = "./index.html";
        return;
      }
      const portal = session.role === "head_judge" ? "judge" : "host";
      quizData = await fetchQuizData({ portal });
      const cfg = quizData.config || {};

      listen("live", (data) => {
        liveState = data || {};
        updateStageDisplay();
      });

      tickInterval = setInterval(() => {
        updateTimerTick();
      }, 100);
    }

    function updateStageDisplay() {
      if (!liveState || !quizData) return;
      const cfg = quizData.config || {};
      const currentRound = liveState.currentRound || "round1";

      const roundTitleEl = document.getElementById("st-round-title");
      const phaseBadgeEl = document.getElementById("st-phase-badge");
      const teamNameEl = document.getElementById("st-team-name");
      const avatarSlotEl = document.getElementById("st-team-avatar-slot");

      // 1. Round Title & Phase Badge
      if (currentRound === "round1") {
        if (roundTitleEl) roundTitleEl.textContent = `VÒNG 1: ${cfg.round1_name || "TUYÊN TRUYỀN"}`.toUpperCase();
        const phase = liveState.round1?.activeSession?.phase || liveState.round1?.timer?.phase || (liveState.round1?.phase) || "prep";
        if (phaseBadgeEl) {
          phaseBadgeEl.style.display = "inline-flex";
          phaseBadgeEl.className = `stage-timer-phase-badge ${phase}`;
          phaseBadgeEl.textContent = phase === "prep" ? "CHUẨN BỊ (3 PHÚT)" : "THUYẾT TRÌNH (15 PHÚT)";
        }
      } else if (currentRound === "round2") {
        if (roundTitleEl) roundTitleEl.textContent = `VÒNG 2: ${cfg.round2_name || "KIẾN THỨC PHÁP LUẬT"}`.toUpperCase();
        if (phaseBadgeEl) {
          const qIdx = Number(liveState.round2?.questionIndex) || 0;
          phaseBadgeEl.style.display = "inline-flex";
          phaseBadgeEl.className = "stage-timer-phase-badge";
          phaseBadgeEl.textContent = `CÂU HỎI #${qIdx + 1}`;
        }
      } else {
        if (roundTitleEl) roundTitleEl.textContent = `VÒNG 3: ${cfg.round3_name || "XỬ LÝ TÌNH HUỐNG"}`.toUpperCase();
        if (phaseBadgeEl) {
          const tileNum = liveState.round3?.activeTile?.number;
          const r3Phase = liveState.round3?.activeTile?.phase === "answer" ? "answer" : "prep";
          const r3Secs = getRound3PhaseSeconds(cfg);
          phaseBadgeEl.style.display = tileNum ? "inline-flex" : "none";
          phaseBadgeEl.className = `stage-timer-phase-badge ${r3Phase === "prep" ? "prep" : "performance"}`;
          phaseBadgeEl.textContent = tileNum
            ? `Ô SỐ ${tileNum} • ${r3Phase === "prep" ? `CHUẨN BỊ (${Math.round(r3Secs.prep / 60)} PHÚT)` : `TRẢ LỜI (${Math.round(r3Secs.answer / 60)} PHÚT)`}`
            : "XỬ LÝ TÌNH HUỐNG";
        }
      }

      // 2. Team Display
      const stageTeamId = liveState.stageTeamId || liveState.round1?.activeSession?.teamId || liveState.round3?.activeTile?.selectedTeamId;
      if (currentRound === "round2") {
        if (teamNameEl) teamNameEl.textContent = "TẤT CẢ CÁC ĐỘI THI ĐẤU";
        if (avatarSlotEl) avatarSlotEl.innerHTML = `<div class="team-avatar team-avatar-sm" style="--team-color: var(--accent); background: var(--accent);">⚡</div>`;
      } else if (stageTeamId) {
        const team = (quizData.allTeams || quizData.teams || []).find((t) => t.id === stageTeamId) || { name: stageTeamId };
        if (teamNameEl) teamNameEl.textContent = team.name || stageTeamId;
        if (avatarSlotEl) avatarSlotEl.innerHTML = renderAvatarHtml(team, "team-avatar-lg");
      } else {
        if (teamNameEl) teamNameEl.textContent = "Chờ đội lên sân khấu";
        if (avatarSlotEl) avatarSlotEl.innerHTML = "";
      }

      updateTimerTick();
    }

    function updateTimerTick() {
      if (!liveState) return;
      const digitsEl = document.getElementById("st-timer-digits");
      const labelEl = document.getElementById("st-timer-label");
      if (!digitsEl) return;

      const currentRound = liveState.currentRound || "round1";
      const now = getServerTime();

      let remainingSec = 0;
      let isRunning = false;
      let isFinished = false;

      if (currentRound === "round1") {
        const r1Timer = liveState.round1?.timer;
        if (r1Timer?.startedAt && r1Timer?.status === "running") {
          remainingSec = getRemainingSeconds(r1Timer.durationSeconds || 900, r1Timer.startedAt, now);
          isRunning = remainingSec > 0;
          isFinished = remainingSec <= 0 || r1Timer.status === "finished";
        } else if (r1Timer?.status === "finished") {
          remainingSec = 0;
          isFinished = true;
        } else {
          const session = liveState.round1?.activeSession;
          remainingSec = session?.durationSeconds || (session?.phase === "prep" ? 180 : 900);
        }
      } else if (currentRound === "round2") {
        const r2 = liveState.round2;
        if (r2?.status === "open" && r2?.deadline) {
          const remMs = Math.max(0, r2.deadline - now);
          remainingSec = Math.ceil(remMs / 1000);
          isRunning = remainingSec > 0;
          isFinished = remainingSec <= 0;
        } else if (r2?.status === "locked" || r2?.status === "revealed") {
          remainingSec = 0;
          isFinished = true;
        } else {
          remainingSec = Number(r2?.activeQuestion?.time_seconds) || 30;
        }
      } else {
        const r3Timer = liveState.round3?.timer;
        if (r3Timer?.startedAt && r3Timer?.status === "running") {
          remainingSec = getRemainingSeconds(r3Timer.durationSeconds || 300, r3Timer.startedAt, now);
          isRunning = remainingSec > 0;
          isFinished = remainingSec <= 0 || r3Timer.status === "finished";
        } else if (r3Timer?.status === "finished") {
          remainingSec = 0;
          isFinished = true;
        } else {
          const r3Secs = getRound3PhaseSeconds(quizData?.config);
          remainingSec = liveState.round3?.activeTile?.phase === "answer" ? r3Secs.answer : r3Secs.prep;
        }
      }

      digitsEl.textContent = formatTimer(remainingSec);

      const isWarning = isRunning && remainingSec <= 5 && remainingSec > 0;
      digitsEl.classList.toggle("warning", isWarning);
      digitsEl.classList.toggle("finished", isFinished);

      if (labelEl) {
        if (isFinished) {
          labelEl.textContent = "HẾT GIỜ!";
          labelEl.style.color = "var(--danger)";
        } else if (isWarning) {
          labelEl.textContent = `⚠ CHÚ Ý: CÒN ${remainingSec} GIÂY!`;
          labelEl.style.color = "var(--danger)";
        } else if (isRunning) {
          labelEl.textContent = "ĐANG TÍNH GIỜ";
          labelEl.style.color = "var(--accent)";
        } else {
          labelEl.textContent = "ĐANG CHỜ BẮT ĐẦU";
          labelEl.style.color = "var(--text-muted)";
        }
      }
    }

    initStageTimer();
  </script>
</body>
</html>
