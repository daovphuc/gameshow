<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vòng 2 - Dẫn Chương Trình</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar" aria-label="Thanh điều hướng bên trái"></aside>

    <main class="stage-main">
      <div id="round2-stage"></div>
    </main>
  </div>

  <!-- Modal Thống Kê Vòng 2 -->
  <div id="r2-stats-modal" class="scoreboard-modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 9999; align-items: center; justify-content: center; padding: clamp(1rem, 2vw, 2.5rem);">
    <div class="scoreboard-modal-card r2-stats-card">
      <div class="r2-stats-head">
        <div class="r2-stats-tabs" role="tablist">
          <button type="button" role="tab" class="r2-stats-tab" data-tab="results" id="r2-tab-results">Kết quả trả lời</button>
          <button type="button" role="tab" class="r2-stats-tab" data-tab="table" id="r2-tab-table">Bảng thống kê Vòng 2</button>
        </div>
        <button type="button" id="btn-close-r2-stats-modal" class="btn btn-icon" title="Đóng" aria-label="Đóng">✕</button>
      </div>
      <div id="r2-stats-modal-body" class="r2-stats-body"></div>
    </div>
  </div>

  <script type="module">
    import {
      fetchQuizData,
      loadAppState,
      saveAppState,
      renderAvatarHtml,
      escapeHtml,
      showToast,
      wireStageLayout
    } from "./js/app.js";
    import { resolveImageUrl } from "./js/data.js";
    import { getRoundTeams } from "./js/content.js";
    import {
      groupRound2BySet,
      startRound2Question,
      lockRound2Question,
      revealRound2Question,
      nextRound2Question,
      calculateRound2Score,
      computeRound2Ranking,
      filterQuestionForTablet,
      buildQuestionKey,
      recomputeRound2FromAnswers,
      calculateRound2AnswerTime,
      openRound2QuestionPreview,
      shouldAutoLockRound2,
      canResumeRound2Question,
      resumeRound2Question,
      getAdjustedShownAt
    } from "./js/round2.js";
    import { formatTimer } from "./js/timer.js";
    import { formatSeconds, shortenTeamName, buildScoreboardRows, renderScoreboardTableHtml } from "./js/leaderboard.js";
    import { computeTeamScores } from "./js/state.js";
    import { get, set, update, listen, getServerTime } from "./js/backend.js";
    import { showLotteryDrawModal } from "./js/draw-ui.js";
    import { createCountdownSound } from "./js/sound.js";
    import { isTestMode, getRound2DrawPool, getRound2SetLabel } from "./js/draw.js";

    let quizData = null;
    let setsGrouped = {};
    let availableSets = [];
    let selectedSet = "1";
    let currentQuestionIdx = 0; // 0 to 9
    let showingRules = true;

    // Local live state mirror
    let liveR2 = {
      status: "idle", // "idle" | "open" | "locked" | "revealed"
      questionKey: null,
      activeQuestion: null,
      shownAt: null,
      deadline: null,
      answers: {},
      results: null,
      history: [],
      questionsMeta: {}
    };

    let timerInterval = null;
    // Final 5-second countdown and buzzer on the projector speakers.
    const countdownSound = createCountdownSound();
    let currentAnswersUnsub = null;
    let autoLockRevealing = false;
    // Latest snapshot of live/ (scores and round 2 stats) for the stats modal.
    let latestLive = null;
    let lastHandledDrawRequest = 0;
    // Index of an earlier question the MC is looking at again (null = live question).
    let reviewIdx = null;
    let statsTab = "results";

    function subscribeToQuestionAnswers(questionKey) {
      if (currentAnswersUnsub) {
        currentAnswersUnsub();
        currentAnswersUnsub = null;
      }
      if (!questionKey) return;
      currentAnswersUnsub = listen(`answers/${questionKey}`, async (incomingAnswers) => {
        liveR2.answers = incomingAnswers || {};
        const counterEl = document.getElementById("r2-answered-counter");
        if (counterEl && quizData && reviewIdx === null) {
          const participatingTeams = getRoundTeams(quizData.teams, quizData.round_order, "round2");
          const count = participatingTeams.filter((t) => liveR2.answers && liveR2.answers[t.id]).length;
          counterEl.textContent = `${count}/${participatingTeams.length} đội đã trả lời`;
        }
        updateLiveAnswersDisplay();

        // Auto-lock and auto-reveal when all participating teams answer
        if (quizData && liveR2.status === "open" && !autoLockRevealing) {
          const participatingTeams = getRoundTeams(quizData.teams, quizData.round_order, "round2");
          if (shouldAutoLockRound2(participatingTeams, liveR2.answers)) {
            autoLockRevealing = true;
            await handleAutoLockAndReveal();
            autoLockRevealing = false;
          }
        }
      });
    }

    async function handleAutoLockAndReveal() {
      stopTimerTick();
      await handleLockQuestion();
      await handleRevealQuestion();
      showToast("Tất cả các đội đã trả lời! Đã tự động khóa và công bố đáp án.");
    }

    function renderLiveTeamsAnswersHtml() {
      if (!quizData) return "";
      const participatingTeams = getRoundTeams(quizData.teams, quizData.round_order, "round2");
      return participatingTeams
        .map((t) => {
          const ansRecord = liveR2.answers && liveR2.answers[t.id];
          const hasAnswered = Boolean(ansRecord);
          const timeMs = hasAnswered && Number.isFinite(ansRecord.answeredAt) && Number.isFinite(liveR2.shownAt)
            ? calculateRound2AnswerTime(getAdjustedShownAt(liveR2.shownAt, ansRecord.answeredAt, liveR2.pauses), ansRecord.answeredAt)
            : (hasAnswered && Number.isFinite(ansRecord.responseTimeMs) ? ansRecord.responseTimeMs : null);
          const timeStr = timeMs !== null ? formatSeconds(timeMs / 1000) : "";
          const shortName = shortenTeamName(t.name) || t.name;
          return `
            <div class="r2-live-team-cell ${hasAnswered ? "answered" : ""}" title="${escapeHtml(t.name)}">
              <div class="r2-live-team-info">
                ${renderAvatarHtml(t, "team-avatar-sm")}
                <span class="r2-live-team-name">${escapeHtml(shortName)}</span>
              </div>
              <div class="r2-live-team-status">
                ${
                  hasAnswered
                    ? `<span style="color: #2E7D4F;">✓ ${timeStr}</span>`
                    : `<span style="color: var(--text-muted); font-size: 0.78rem;">Chưa gửi</span>`
                }
              </div>
            </div>
          `;
        })
        .join("");
    }

    function updateLiveAnswersDisplay() {
      const grid = document.getElementById("r2-live-teams-grid");
      if (grid) {
        grid.innerHTML = renderLiveTeamsAnswersHtml();
      }
    }

    function renderRulesStage(container) {
      stopTimerTick();

      const rulesText = quizData.config?.round2_rules || "";
      const roundTitle = quizData.config?.round2_name || "Phần thi thứ hai: Trả lời câu hỏi trắc nghiệm";

      container.innerHTML = `
        <div class="rules-stage" style="max-width: 960px; margin: 0 auto; padding: 1.5rem;">
          <div class="section-header" style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 1rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
              Quy định & Thể lệ
            </div>
            <h1 class="section-title" style="font-size: clamp(1.8rem, 3.5vw, 2.5rem); margin-bottom: 0.5rem;">
              ${escapeHtml(roundTitle)}
            </h1>
            <p class="section-subtitle" style="font-size: 1.1rem; color: var(--text-muted); margin: 0 auto;">
              MC đọc phổ biến thể lệ thi đấu trước khi bắt đầu phần thi
            </p>
          </div>

          <div class="rules-card" style="background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius-lg, 16px); padding: clamp(1.5rem, 3vw, 2.5rem); box-shadow: var(--shadow-md, 0 4px 20px rgba(0,0,0,0.06)); margin-bottom: 2rem;">
            <div style="white-space: pre-wrap; font-family: var(--font-sans, system-ui); font-size: clamp(1.05rem, 1.8vw, 1.25rem); line-height: 1.8; color: var(--text);">${escapeHtml(rulesText)}</div>
          </div>

          <div style="display: flex; justify-content: center; gap: 1rem;">
            <button type="button" id="btn-dismiss-rules" class="btn btn-primary btn-lg" style="font-size: 1.25rem; padding: 0.85rem 2.5rem; font-weight: 700; border-radius: var(--radius-full, 9999px);">
              ${liveR2.setStarted ? "Quay lại phần thi →" : "Vào phần thi →"}
            </button>
          </div>
        </div>
      `;

      document.getElementById("btn-dismiss-rules")?.addEventListener("click", () => {
        showingRules = false;
        renderStage();
      });
    }

    function getQuestionsInActiveSet() {
      return setsGrouped[selectedSet] || [];
    }

    function getCurrentQuestion() {
      const list = getQuestionsInActiveSet();
      return list[currentQuestionIdx] || null;
    }

    function stopTimerTick() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function startTimerTick() {
      stopTimerTick();
      countdownSound.reset();
      timerInterval = setInterval(() => {
        if (!liveR2.deadline) return;
        const now = getServerTime();
        const remainingMs = Math.max(0, liveR2.deadline - now);
        const remainingSec = Math.ceil(remainingMs / 1000);

        updateTimerDisplay(remainingSec);
        countdownSound.update(remainingSec, liveR2.status === "open");

        // Auto-lock and auto-reveal when time is up
        if (remainingMs <= 0 && liveR2.status === "open" && !autoLockRevealing) {
          stopTimerTick();
          autoLockRevealing = true;
          handleAutoLockAndReveal().finally(() => {
            autoLockRevealing = false;
          });
        }
      }, 100);
    }

    function updateTimerDisplay(remainingSec) {
      const digits = document.getElementById("r2-timer-digits");
      const box = document.getElementById("r2-timer-box");
      const warnText = document.getElementById("r2-timer-warning");
      if (!digits || !box) return;

      digits.textContent = formatTimer(remainingSec);
      const isWarn = remainingSec <= 5 && remainingSec > 0;
      const isZero = remainingSec <= 0;

      box.classList.toggle("running", liveR2.status === "open" && !isWarn && !isZero);
      box.classList.toggle("warning", isWarn);
      box.classList.toggle("finished", isZero || liveR2.status === "locked" || liveR2.status === "revealed");

      if (warnText) {
        warnText.textContent = isZero
          ? "HẾT GIỜ!"
          : isWarn
            ? `⚠ Còn ${remainingSec}s!`
            : liveR2.status === "reading"
              ? "ĐANG ĐỌC ĐỀ"
              : "";
      }
    }

    async function handleStartQuestion() {
      const q = getCurrentQuestion();
      if (!q) return;

      const serverTime = getServerTime();
      liveR2 = startRound2Question(liveR2, q, serverTime);
      const questionKey = buildQuestionKey(selectedSet, currentQuestionIdx);
      liveR2.questionKey = questionKey;
      if (!liveR2.questionsMeta) liveR2.questionsMeta = {};
      liveR2.questionsMeta[questionKey] = {
        shownAt: liveR2.shownAt,
        deadline: liveR2.deadline
      };

      // Publish question to tablets (without correct answer)
      const tabletQuestion = filterQuestionForTablet(q);

      await update("live/round2", {
        status: "open",
        questionIndex: currentQuestionIdx,
        questionKey,
        activeQuestion: tabletQuestion,
        correct: null,
        explanation: null,
        results: null,
        pauses: null,
        lockedAt: null,
        lockedRemainingMs: null,
        shownAt: liveR2.shownAt,
        deadline: liveR2.deadline,
        [`questionsMeta/${questionKey}`]: liveR2.questionsMeta[questionKey]
      });

      subscribeToQuestionAnswers(questionKey);
      startTimerTick();
      renderStage();
    }

    async function handleLockQuestion() {
      stopTimerTick();
      liveR2 = lockRound2Question(liveR2, getServerTime());

      try {
        await update("live/round2", {
          status: "locked",
          lockedAt: liveR2.lockedAt ?? null,
          lockedRemainingMs: liveR2.lockedRemainingMs ?? null
        });
      } catch (err) {
        showToast(`Không khóa được câu hỏi: ${err?.message || err}`, 6000);
      }

      renderStage();
    }

    async function handleRevealQuestion() {
      const q = getCurrentQuestion();
      if (!q) return;

      const pointsPerCorrect = Number(quizData.config?.round2_points_per_correct) || 2;
      liveR2 = revealRound2Question(liveR2, q, { pointsPerCorrect });

      try {
        await update("live/round2", {
          status: "revealed",
          results: liveR2.results,
          correct: liveR2.correct,
          explanation: liveR2.explanation || null
        });

        // Update round 2 totals for teams in live state
        await updateAccumulatedScores();
      } catch (err) {
        showToast(`Không công bố được đáp án: ${err?.message || err}`, 6000);
      }
      renderStage();
    }

    async function updateAccumulatedScores() {
      const allAnswers = (await get("answers")) || {};
      const questions = getQuestionsInActiveSet();
      const meta = liveR2.questionsMeta || {};
      const pointsPerCorrect = Number(quizData.config?.round2_points_per_correct) || 2;

      const recomputed = recomputeRound2FromAnswers({
        questions,
        allAnswers,
        questionsMeta: meta,
        teams: quizData.teams,
        pointsPerCorrect
      });

      liveR2.history = recomputed.history;

      const updates = {};
      for (const [tId, score] of Object.entries(recomputed.scores)) {
        updates[`scores/${tId}/round2`] = score;
      }
      updates["round2Stats"] = recomputed.teamStats;
      await update("live", updates);
    }

    async function handleOpenQuestionPreview() {
      const q = getCurrentQuestion();
      if (!q) {
        renderStage();
        return;
      }

      stopTimerTick();
      autoLockRevealing = false;
      liveR2 = openRound2QuestionPreview(liveR2, q);
      const questionKey = buildQuestionKey(selectedSet, currentQuestionIdx);
      liveR2.questionKey = questionKey;
      if (!liveR2.questionsMeta) liveR2.questionsMeta = {};

      const tabletQuestion = filterQuestionForTablet(q);

      await update("live/round2", {
        status: "reading",
        questionIndex: currentQuestionIdx,
        questionKey,
        activeQuestion: tabletQuestion,
        correct: null,
        explanation: null,
        // The previous question's results must not reach the tablets, or
        // they show that answer as already chosen and lock the buttons.
        results: null,
        shownAt: null,
        deadline: null,
        pauses: null,
        lockedAt: null,
        lockedRemainingMs: null
      });

      reviewIdx = null;
      subscribeToQuestionAnswers(questionKey);
      renderStage();
    }

    async function startSet(setKey) {
      selectedSet = setKey;
      currentQuestionIdx = 0;
      liveR2.activeSet = selectedSet;
      liveR2.setStarted = true;
      liveR2.history = [];
      await update("live", {
        currentRound: "round2",
        draw: null
      });
      await update("live/round2", {
        set: selectedSet,
        setStarted: true,
        questionIndex: 0
      });
      // Show the drawn set first; the MC presses "Bắt đầu" to open question 1.
      liveR2.status = "idle";
      renderStage();
    }

    async function handleNextQuestion() {
      reviewIdx = null;
      currentQuestionIdx += 1;
      const questions = getQuestionsInActiveSet();
      if (currentQuestionIdx >= questions.length) {
        liveR2.status = "idle";
        liveR2.activeQuestion = null;
        liveR2.answers = {};
        liveR2.results = null;
        delete liveR2.correct;
        delete liveR2.explanation;

        await update("live/round2", {
          status: "idle",
          questionIndex: currentQuestionIdx,
          questionKey: null,
          activeQuestion: null,
          correct: null,
          explanation: null,
          results: null,
          stats: null
        });

        renderStage();
        return;
      }

      await handleOpenQuestionPreview();
    }

    function buildRound2RankingData() {
      const participatingTeams = getRoundTeams(quizData.teams, quizData.round_order, "round2");
      const teamStats = {};
      for (const t of participatingTeams) {
        teamStats[t.id] = { points: 0, correctCount: 0, totalCorrectTimeMs: 0 };
      }

      for (const h of liveR2.history) {
        if (!h.results) continue;
        for (const [tId, res] of Object.entries(h.results)) {
          if (!teamStats[tId]) {
            teamStats[tId] = { points: 0, correctCount: 0, totalCorrectTimeMs: 0 };
          }
          if (res.isCorrect) {
            teamStats[tId].points += Number(res.points) || 0;
            teamStats[tId].correctCount += 1;
            teamStats[tId].totalCorrectTimeMs += Number(res.responseTimeMs) || 0;
          }
        }
      }

      return computeRound2Ranking(participatingTeams, teamStats);
    }

    function renderRound2StatsTableHtml() {
      const derivedScores = computeTeamScores({
        teams: quizData.teams,
        live: latestLive || {},
        config: quizData.config
      });

      const participatingTeams = getRoundTeams(quizData.teams, quizData.round_order, "round2");
      const teamStats = { ...(latestLive?.round2Stats || {}) };
      for (const t of participatingTeams) {
        if (!teamStats[t.id]) {
          teamStats[t.id] = { points: 0, correctCount: 0, totalCorrectTimeMs: 0 };
        }
      }
      if (liveR2?.history) {
        for (const h of liveR2.history) {
          if (!h.results) continue;
          for (const [tId, res] of Object.entries(h.results)) {
            if (!teamStats[tId]) {
              teamStats[tId] = { points: 0, correctCount: 0, totalCorrectTimeMs: 0 };
            }
            if (res.isCorrect) {
              teamStats[tId].points = (teamStats[tId].points || 0) + (Number(res.points) || 0);
              teamStats[tId].correctCount = (teamStats[tId].correctCount || 0) + 1;
              teamStats[tId].totalCorrectTimeMs = (teamStats[tId].totalCorrectTimeMs || 0) + (Number(res.responseTimeMs) || 0);
            }
          }
        }
      }

      for (const [tId, stat] of Object.entries(teamStats)) {
        if (stat.points && derivedScores[tId]) {
          if (!derivedScores[tId].round2) {
            derivedScores[tId].round2 = stat.points;
            derivedScores[tId].total = Math.round(((derivedScores[tId].round1 || 0) + stat.points + (derivedScores[tId].round3 || 0)) * 100) / 100;
          }
        }
      }

      const rows = buildScoreboardRows(quizData.teams, derivedScores, {
        round2Stats: teamStats,
        mode: "round2"
      });

      // Many teams: side-by-side tables so the popup never scrolls.
      const perTable = rows.length > 14 ? Math.ceil(rows.length / Math.ceil(rows.length / 12)) : rows.length || 1;
      const chunks = [];
      for (let i = 0; i < rows.length; i += perTable) chunks.push(rows.slice(i, i + perTable));
      if (chunks.length === 0) chunks.push([]);
      return `<div class="r2-stats-tables" style="--r2-table-cols: ${chunks.length};">${chunks
        .map((chunk) => renderScoreboardTableHtml(chunk, {
          highlightMode: "round2",
          shortenName: chunks.length > 1,
          tableClass: "scoreboard-table modal-scoreboard-table",
          wrapClass: "scoreboard-table-wrap modal-scoreboard-wrap"
        }))
        .join("")}</div>`;
    }

    function openStatsModal() {
      const modal = document.getElementById("r2-stats-modal");
      if (!modal) return;
      // Open on this question's results once revealed, otherwise on the table.
      statsTab = getPresenterView().status === "revealed" ? "results" : "table";
      modal.style.display = "flex";
      renderStatsModalBody();
    }

    function closeStatsModal() {
      const modal = document.getElementById("r2-stats-modal");
      if (modal) modal.style.display = "none";
    }

    function runRound2Lottery() {
      // Test mode draws from the rehearsal sets, live mode from the official ones.
      const pool = getRound2DrawPool(availableSets, quizData.config);
      if (pool.length === 0) {
        showToast("Chế độ thử: chưa có bộ đề thử (set \"Chạy thử\") trong câu hỏi Vòng 2.", 6000);
        return;
      }

      showLotteryDrawModal({
        items: pool,
        title: "BỐC THĂM BỘ ĐỀ VÒNG 2",
        getLabel: (setKey) => getRound2SetLabel(setKey),
        onRolling: (drawnSet) => {
          set("live/draw", {
            round: "round2",
            status: "rolling",
            stageTeamId: null,
            pool,
            result: drawnSet
          });
        },
        onComplete: (drawnSet) => {
          set("live/draw", {
            round: "round2",
            status: "done",
            stageTeamId: null,
            pool,
            result: drawnSet
          });
          startSet(drawnSet);
        }
      });
    }

    function renderSetChooser(container) {
      update("live", {
        currentRound: "round2",
        draw: {
          round: "round2",
          status: "pending",
          stageTeamId: null
        }
      });

      const testMode = isTestMode(quizData.config);
      const drawPool = getRound2DrawPool(availableSets, quizData.config);

      container.innerHTML = `
        <div class="section-header">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; width: 100%;">
            <div>
              ${quizData.config?.show_subtitle ? `<div class="stage-cluster-subtitle" style="font-size: 1rem; color: var(--accent); font-weight: 700; margin-bottom: 0.35rem;">${escapeHtml(quizData.config.show_subtitle)}</div>` : ""}
              <h1 class="section-title">${escapeHtml(quizData.config.round2_name)}</h1>
              <p class="section-subtitle">
                Bốc thăm quay số chọn bộ đề 10 câu hỏi trắc nghiệm.
              </p>
            </div>

            <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;">
              <button type="button" id="btn-open-rules" class="btn btn-icon" title="Thể lệ" aria-label="Thể lệ">📜</button>
            </div>
          </div>
        </div>

        <div class="panel-card" style="margin-top: 1.5rem; text-align: center; padding: 2.75rem 1.5rem;">
          <h2 style="font-family: var(--font-serif); font-size: clamp(1.4rem, 2.8vw, 1.85rem); margin: 0 0 0.5rem; color: var(--text);">
            Bốc Thăm Chọn Bộ Đề Thi Đấu
          </h2>
          <p style="color: var(--text-muted); font-size: 1.05rem; margin: 0 auto 2rem; max-width: 580px;">
            ${
              testMode
                ? drawPool.length > 0
                  ? `<strong style="color: var(--warning);">Chế độ thử (DEMO):</strong> quay số trong ${drawPool.length} bộ đề thử, các bộ đề chính thức không được dùng.`
                  : `<strong style="color: var(--danger);">Chế độ thử (DEMO):</strong> chưa có bộ đề thử (set "Chạy thử") trong câu hỏi Vòng 2.`
                : `Bốc thăm ngẫu nhiên 1 trong ${drawPool.length} bộ đề chính thức.`
            }
          </p>

          <div style="display: flex; justify-content: center; align-items: center;">
            <button type="button" id="btn-lottery-set" class="btn btn-primary" style="font-size: 1.4rem; font-weight: 800; padding: 1.15rem 2.75rem; border-radius: var(--radius-full); box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 0.75rem;">
              <span>🎲</span>
              <span>QUAY SỐ BỘ ĐỀ</span>
            </button>
          </div>

        </div>
      `;

      document.getElementById("btn-open-rules")?.addEventListener("click", () => {
        showingRules = true;
        renderStage();
      });

      document.getElementById("btn-lottery-set")?.addEventListener("click", () => {
        runRound2Lottery();
      });
    }

    function renderSummaryStage(container) {
      stopTimerTick();

      container.innerHTML = `
        <div class="section-header">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; width: 100%;">
            <div>
              <h1 class="section-title">Thống Kê Vòng 2 — Bộ Đề #${escapeHtml(selectedSet)}</h1>
              <p class="section-subtitle">
                Hoàn thành các câu hỏi trắc nghiệm Vòng 2. Xếp hạng theo Điểm số giảm dần, ưu tiên tổng thời gian câu đúng ngắn hơn.
              </p>
            </div>

            <div style="display: flex; gap: 0.75rem; align-items: center;">
              <button type="button" id="btn-open-rules" class="btn btn-icon" title="Thể lệ" aria-label="Thể lệ">📜</button>
              <a href="./round3.html" class="btn btn-primary btn-lg">Sang Vòng 3 →</a>
            </div>
          </div>
        </div>

        <section class="panel-card" style="margin-top: 1.5rem;">
          ${renderRound2StatsTableHtml()}
        </section>
      `;

      document.getElementById("btn-open-rules")?.addEventListener("click", () => {
        showingRules = true;
        renderStage();
      });
    }

    function getHistoryEntry(idx) {
      return (liveR2.history || []).find((h) => h.questionIndex === idx) || null;
    }

    // What the MC screen shows: the live question, or an earlier one under review.
    function getPresenterView() {
      const questions = getQuestionsInActiveSet();
      if (reviewIdx !== null && reviewIdx >= 0 && reviewIdx < currentQuestionIdx) {
        const h = getHistoryEntry(reviewIdx);
        return {
          isReview: true,
          idx: reviewIdx,
          q: questions[reviewIdx] || null,
          status: "revealed",
          answers: h?.answers || {},
          results: h?.results || {},
          shownAt: h?.shownAt ?? null
        };
      }
      reviewIdx = null;
      return {
        isReview: false,
        idx: currentQuestionIdx,
        q: questions[currentQuestionIdx] || null,
        status: liveR2.status,
        answers: liveR2.answers || {},
        results: liveR2.results || null,
        shownAt: liveR2.shownAt
      };
    }

    function getBackAction() {
      if (reviewIdx !== null) {
        return { enabled: reviewIdx > 0, title: "Xem lại câu trước" };
      }
      switch (liveR2.status) {
        case "reading":
          return { enabled: true, title: currentQuestionIdx > 0 ? "Ẩn câu này, quay lại câu trước" : "Ẩn câu hỏi" };
        case "open":
          return { enabled: true, title: "Hủy tính giờ, quay lại đọc đề" };
        case "locked":
          return { enabled: canResumeRound2Question(liveR2), title: "Mở khóa, tiếp tục tính giờ" };
        case "revealed":
          return { enabled: currentQuestionIdx > 0, title: "Xem lại câu trước" };
        default:
          return { enabled: false, title: "Quay lại" };
      }
    }

    /** Puts an earlier, already revealed question back on all screens (undo "next"). */
    async function restoreRevealedQuestion(idx) {
      const q = getQuestionsInActiveSet()[idx];
      if (!q) return;
      const qKey = buildQuestionKey(selectedSet, idx);
      const h = getHistoryEntry(idx);
      const meta = liveR2.questionsMeta?.[qKey] || {};
      const pointsPerCorrect = Number(quizData.config?.round2_points_per_correct) || 2;

      currentQuestionIdx = idx;
      reviewIdx = null;
      liveR2 = revealRound2Question(
        {
          ...liveR2,
          status: "locked",
          questionKey: qKey,
          activeQuestion: filterQuestionForTablet(q),
          answers: h?.answers || {},
          shownAt: meta.shownAt ?? h?.shownAt ?? null,
          deadline: meta.deadline ?? h?.deadline ?? null,
          pauses: meta.pauses || [],
          lockedAt: null,
          lockedRemainingMs: null
        },
        q,
        { pointsPerCorrect }
      );

      await update("live/round2", {
        status: "revealed",
        questionIndex: idx,
        questionKey: qKey,
        activeQuestion: filterQuestionForTablet(q),
        results: liveR2.results,
        correct: liveR2.correct,
        explanation: liveR2.explanation || null,
        shownAt: liveR2.shownAt,
        deadline: liveR2.deadline,
        pauses: liveR2.pauses && liveR2.pauses.length ? liveR2.pauses : null,
        lockedAt: null,
        lockedRemainingMs: null
      });
      subscribeToQuestionAnswers(qKey);
      renderStage();
    }

    async function handleResumeQuestion() {
      const qKey = liveR2.questionKey;
      liveR2 = resumeRound2Question(liveR2, getServerTime());
      if (liveR2.status !== "open") return;
      if (!liveR2.questionsMeta) liveR2.questionsMeta = {};
      liveR2.questionsMeta[qKey] = {
        ...(liveR2.questionsMeta[qKey] || {}),
        shownAt: liveR2.shownAt,
        deadline: liveR2.deadline,
        pauses: liveR2.pauses
      };
      await update("live/round2", {
        status: "open",
        deadline: liveR2.deadline,
        pauses: liveR2.pauses,
        lockedAt: null,
        lockedRemainingMs: null,
        [`questionsMeta/${qKey}`]: liveR2.questionsMeta[qKey]
      });
      autoLockRevealing = false;
      startTimerTick();
      renderStage();
      showToast("Đã mở khóa, tiếp tục tính giờ.");
    }

    /**
     * One step back: review the previous question, or undo a mistaken action on
     * the live one (shown too early, timer started too early, locked too early).
     * Results of earlier questions are never changed.
     */
    async function handleBack() {
      if (reviewIdx !== null) {
        if (reviewIdx > 0) reviewIdx -= 1;
        renderStage();
        return;
      }
      const status = liveR2.status;
      if (status === "revealed") {
        if (currentQuestionIdx > 0) {
          reviewIdx = currentQuestionIdx - 1;
          renderStage();
        }
        return;
      }
      if (status === "locked") {
        await handleResumeQuestion();
        return;
      }
      if (status === "open") {
        if (Object.keys(liveR2.answers || {}).length > 0) {
          showToast("Đã có đội gửi đáp án, không thể hủy tính giờ câu này.", 5000);
          return;
        }
        stopTimerTick();
        const qKey = liveR2.questionKey;
        liveR2 = { ...liveR2, status: "reading", shownAt: null, deadline: null, pauses: [], lockedAt: null, lockedRemainingMs: null };
        if (liveR2.questionsMeta) delete liveR2.questionsMeta[qKey];
        await update("live/round2", {
          status: "reading",
          shownAt: null,
          deadline: null,
          pauses: null,
          [`questionsMeta/${qKey}`]: null
        });
        renderStage();
        return;
      }
      if (status === "reading") {
        stopTimerTick();
        if (currentQuestionIdx === 0) {
          liveR2 = { ...liveR2, status: "idle", activeQuestion: null, answers: {}, results: null };
          await update("live/round2", {
            status: "idle",
            questionKey: null,
            activeQuestion: null,
            correct: null,
            explanation: null,
            results: null,
            shownAt: null,
            deadline: null
          });
          subscribeToQuestionAnswers(null);
          renderStage();
          return;
        }
        await restoreRevealedQuestion(currentQuestionIdx - 1);
      }
    }

    function renderQuestionResultsHtml(view) {
      const participatingTeams = getRoundTeams(quizData.teams, quizData.round_order, "round2");
      if (view.status !== "revealed" || !view.results) {
        return `<div class="r2-stats-empty">Câu ${view.idx + 1} chưa công bố đáp án.</div>`;
      }
      const cells = participatingTeams
        .map((t) => {
          const res = view.results[t.id];
          const answered = Boolean(res || view.answers?.[t.id]);
          const choice = res?.answer || view.answers?.[t.id]?.answer || "—";
          const timeMs = res && Number.isFinite(res.responseTimeMs) ? res.responseTimeMs : null;
          const cls = res?.isCorrect ? "correct" : answered ? "wrong" : "none";
          return `
            <div class="r2-result-cell ${cls}" title="${escapeHtml(t.name)}">
              ${renderAvatarHtml(t, "team-avatar-sm")}
              <span class="r2-result-name">${escapeHtml(shortenTeamName(t.name) || t.name)}</span>
              <span class="r2-result-choice">${escapeHtml(choice)}</span>
              <span class="r2-result-time">${answered && timeMs !== null ? formatSeconds(timeMs / 1000) : "—"}</span>
              <span class="r2-result-points">+${res?.points || 0}đ</span>
            </div>
          `;
        })
        .join("");
      const cols = participatingTeams.length > 24 ? 4 : participatingTeams.length > 8 ? 3 : 2;
      return `
        <div class="r2-stats-caption">Câu ${view.idx + 1} — đáp án đúng: <strong>${escapeHtml(String(view.q?.correct || "").toUpperCase())}</strong></div>
        <div class="r2-result-grid" style="--r2-cols: ${cols};">${cells}</div>
      `;
    }

    /** Shrinks the open popup so everything fits on screen without scrolling. */
    function fitStatsModal() {
      const card = document.querySelector("#r2-stats-modal .r2-stats-card");
      const body = document.getElementById("r2-stats-modal-body");
      if (!card || !body) return;
      body.style.zoom = "1";
      const head = card.querySelector(".r2-stats-head");
      const cardStyle = getComputedStyle(card);
      const padding = parseFloat(cardStyle.paddingTop) + parseFloat(cardStyle.paddingBottom);
      const available = window.innerHeight * 0.92 - padding - (head?.offsetHeight || 0) - 16;
      const needed = body.scrollHeight;
      if (needed > available && needed > 0) {
        body.style.zoom = String(Math.max(0.45, available / needed));
      }
    }

    function renderStatsModalBody() {
      const body = document.getElementById("r2-stats-modal-body");
      if (!body) return;
      const view = getPresenterView();
      document.getElementById("r2-tab-results").textContent = `Kết quả trả lời (Câu ${view.idx + 1})`;
      document.getElementById("r2-tab-table").textContent = `Bảng thống kê Vòng 2 (tạm tính đến câu ${view.idx + 1})`;
      document.querySelectorAll(".r2-stats-tab").forEach((tab) => {
        const active = tab.dataset.tab === statsTab;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-selected", String(active));
      });
      body.innerHTML = statsTab === "results" ? renderQuestionResultsHtml(view) : renderRound2StatsTableHtml();
      fitStatsModal();
    }

    function renderQuestionPresenter(container) {
      const view = getPresenterView();
      const q = view.q;
      if (!q) {
        renderSummaryStage(container);
        return;
      }

      const totalQuestions = getQuestionsInActiveSet().length;
      const participatingTeams = getRoundTeams(quizData.teams, quizData.round_order, "round2");
      const answeredCount = participatingTeams.filter((t) => view.answers && view.answers[t.id]).length;

      const durationSec = Number(q.time_seconds) || 30;
      const isRevealed = view.status === "revealed";
      const isStopped = view.status === "locked" || isRevealed;
      const back = getBackAction();

      const allOptions = [
        { letter: "A", text: q.option_a },
        { letter: "B", text: q.option_b },
        { letter: "C", text: q.option_c },
        { letter: "D", text: q.option_d }
      ];
      const options = allOptions.filter((opt) => opt.text !== undefined && opt.text !== null && String(opt.text).trim() !== "");

      const optionsHtml = options
        .map((opt) => {
          const isCorrect = isRevealed && String(q.correct || "").toUpperCase() === opt.letter;
          return `
            <div class="r2-option-card opt-${opt.letter.toLowerCase()} ${isCorrect ? "revealed-correct" : ""}">
              <span class="opt-letter">${opt.letter}</span>
              <span class="opt-text">${escapeHtml(opt.text)}</span>
              ${isCorrect ? `<span style="font-weight: 800; color: #2E7D4F; flex-shrink: 0;">✓ ĐÁP ÁN ĐÚNG</span>` : ""}
            </div>
          `;
        })
        .join("");

      const explanationHtml = isRevealed && q.explanation
        ? `
          <div class="panel-card" style="margin-top: 1.5rem; border-left: 5px solid var(--accent); background: var(--surface-2, rgba(255,255,255,0.03)); padding: 1.25rem 1.5rem;">
            <div style="font-weight: 700; color: var(--accent); font-size: 1.15rem; margin-bottom: 0.5rem;">📖 Căn cứ pháp lý &amp; Giải thích đáp án:</div>
            <div style="font-size: 1.1rem; line-height: 1.6; color: var(--text);">${escapeHtml(q.explanation)}</div>
          </div>
        `
        : "";

      const liveTeamsListHtml = !view.isReview && !isRevealed && view.status !== "idle"
        ? `
          <div class="panel-card" style="margin-top: 1.5rem;">
            <h3 style="font-size: 1.15rem; font-weight: 700; margin: 0 0 0.85rem;">
              ⚡ Tiến độ trả lời của các đội (${answeredCount}/${participatingTeams.length}):
            </h3>
            <div id="r2-live-teams-grid" class="r2-live-teams-grid">
              ${renderLiveTeamsAnswersHtml()}
            </div>
          </div>
        `
        : "";

      const timerSeconds = isStopped
        ? 0
        : (view.status === "open" && liveR2.deadline)
          ? Math.max(0, Math.ceil((liveR2.deadline - getServerTime()) / 1000))
          : durationSec;

      const primaryButton = view.isReview
        ? `<button type="button" id="btn-review-forward" class="btn btn-primary r2-bar-main">${view.idx + 1 < currentQuestionIdx ? "Câu sau →" : "Về câu hiện tại →"}</button>`
        : view.status === "idle"
          ? `<button type="button" id="btn-show-question" class="btn btn-primary r2-bar-main">▶ Bắt đầu</button>`
          : view.status === "reading"
            ? `<button type="button" id="btn-open-question" class="btn btn-primary r2-bar-main">▶ Bắt đầu tính giờ</button>`
            : view.status === "open"
              ? `<button type="button" id="btn-lock-question" class="btn btn-danger r2-bar-main">🔒 Khóa câu trả lời</button>`
              : view.status === "locked"
                ? `<button type="button" id="btn-reveal-question" class="btn btn-primary r2-bar-main">★ Công bố đáp án</button>`
                : `<button type="button" id="btn-next-question" class="btn btn-primary r2-bar-main">${currentQuestionIdx + 1 < totalQuestions ? "Câu tiếp theo →" : "Tổng kết Vòng 2 →"}</button>`;

      container.innerHTML = `
        <div class="question-stage">
          <div class="screen-action-bar r2-bar">
            <div class="screen-left-group">
              <button type="button" id="btn-screen-back" class="btn btn-icon" title="${escapeHtml(back.title)}" aria-label="${escapeHtml(back.title)}" ${back.enabled ? "" : "disabled"}>←</button>
              <span class="r2-bar-chip accent">${view.isReview ? "Xem lại · " : ""}Câu ${view.idx + 1}/${totalQuestions}</span>
              <span class="r2-bar-chip">
                <span>⚡</span>
                <span id="r2-answered-counter">${answeredCount}/${participatingTeams.length} đội đã trả lời</span>
              </span>
              <button type="button" id="btn-toggle-r2-stats" class="btn btn-icon" title="Kết quả &amp; thống kê Vòng 2" aria-label="Kết quả và thống kê Vòng 2">📊</button>
              <button type="button" id="btn-open-rules" class="btn btn-icon" title="Thể lệ" aria-label="Thể lệ">📜</button>
            </div>

            <div class="screen-right-group">
              <div id="r2-timer-box" class="top-timer-box r2-bar-timer ${isStopped ? "finished" : ""}">
                <span id="r2-timer-digits" class="top-timer-digits">${formatTimer(timerSeconds)}</span>
                <span id="r2-timer-warning" class="top-timer-warning-text">${isStopped && !view.isReview ? "HẾT GIỜ!" : ""}</span>
              </div>
              ${primaryButton}
            </div>
          </div>

          ${
            view.status === "idle"
              ? `<div class="panel-card" style="margin-top: 1.5rem; text-align: center; padding: 4.5rem 2rem;">
                  <span class="meta-pill accent" style="font-size: 1.1rem; padding: 0.35rem 1.25rem;">
                    Câu ${view.idx + 1}/${totalQuestions}
                  </span>
                  <h2 style="font-family: var(--font-serif); font-size: 2.2rem; margin: 1.25rem 0 0.75rem;">
                    ${view.idx === 0 ? escapeHtml(getRound2SetLabel(selectedSet)) : `Sẵn Sàng Cho Câu Hỏi Số ${view.idx + 1}`}
                  </h2>
                  <p style="color: var(--text-muted); font-size: 1.15rem; max-width: 520px; margin: 0 auto;">
                    Bấm <strong>"▶ Bắt đầu"</strong> để hiện câu hỏi cho MC đọc.
                  </p>
                </div>`
              : `<article class="question-card" style="margin-top: 1rem;">
                  <p class="question-text" style="font-size: clamp(1.4rem, 2.5vw, 2.2rem);">${escapeHtml(q.question)}</p>
                  ${
                    resolveImageUrl(q.image_url)
                      ? `<div class="question-image-wrap">
                          <img class="question-image" src="${escapeHtml(resolveImageUrl(q.image_url))}" alt="" onerror="this.parentElement.remove()" />
                        </div>`
                      : ""
                  }
                  <div class="round2-options-grid">
                    ${optionsHtml}
                  </div>
                </article>`
          }

          ${liveTeamsListHtml}
          ${explanationHtml}
        </div>
      `;

      document.getElementById("btn-screen-back")?.addEventListener("click", handleBack);
      document.getElementById("btn-open-rules")?.addEventListener("click", () => {
        showingRules = true;
        renderStage();
      });
      document.getElementById("btn-toggle-r2-stats")?.addEventListener("click", openStatsModal);
      document.getElementById("btn-review-forward")?.addEventListener("click", () => {
        reviewIdx = reviewIdx !== null && reviewIdx + 1 < currentQuestionIdx ? reviewIdx + 1 : null;
        renderStage();
      });
      document.getElementById("btn-open-question")?.addEventListener("click", handleStartQuestion);
      document.getElementById("btn-show-question")?.addEventListener("click", handleOpenQuestionPreview);
      document.getElementById("btn-lock-question")?.addEventListener("click", handleLockQuestion);
      document.getElementById("btn-reveal-question")?.addEventListener("click", handleRevealQuestion);
      document.getElementById("btn-next-question")?.addEventListener("click", handleNextQuestion);
    }

    function renderStage() {
      const container = document.getElementById("round2-stage");
      const questions = getQuestionsInActiveSet();

      if (showingRules) {
        renderRulesStage(container);
      } else if (currentQuestionIdx >= questions.length && questions.length > 0) {
        renderSummaryStage(container);
      } else if (!liveR2.setStarted && liveR2.status === "idle" && currentQuestionIdx === 0 && !liveR2.activeQuestion) {
        renderSetChooser(container);
      } else {
        renderQuestionPresenter(container);
      }

      wireStageLayout({
        activePage: "round2",
        config: quizData.config,
        teams: quizData.teams,
        onReload: () => initRound2(true)
      });
    }

    async function initRound2(forceRefresh = false) {
      quizData = await fetchQuizData({ forceRefresh, portal: "host" });
      document.title = `${quizData.config.round2_name} - ${quizData.config.show_title}`;

      setsGrouped = groupRound2BySet(quizData.round2Questions);
      availableSets = Object.keys(setsGrouped);

      // Wire close modal
      document.getElementById("btn-close-r2-stats-modal")?.addEventListener("click", closeStatsModal);
      document.querySelectorAll(".r2-stats-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          statsTab = tab.dataset.tab === "results" ? "results" : "table";
          renderStatsModalBody();
        });
      });
      window.addEventListener("resize", () => {
        if (document.getElementById("r2-stats-modal")?.style.display === "flex") fitStatsModal();
      });
      document.getElementById("r2-stats-modal")?.addEventListener("click", (e) => {
        if (e.target.id === "r2-stats-modal") closeStatsModal();
      });

      // Restore state from database
      const remoteR2 = (await get("live/round2")) || {};
      const storedAnswers = (await get("answers")) || {};

      if (remoteR2.set && availableSets.includes(remoteR2.set)) {
        selectedSet = remoteR2.set;
      } else if (availableSets.length > 0 && !availableSets.includes(selectedSet)) {
        selectedSet = availableSets[0];
      }

      liveR2.questionsMeta = remoteR2.questionsMeta || {};

      // Recompute totals and history from stored answers
      const questions = getQuestionsInActiveSet();
      const pointsPerCorrect = Number(quizData.config?.round2_points_per_correct) || 2;
      const recomputed = recomputeRound2FromAnswers({
        questions,
        allAnswers: storedAnswers,
        questionsMeta: liveR2.questionsMeta,
        teams: quizData.teams,
        pointsPerCorrect
      });
      liveR2.history = recomputed.history;

      // Restore current position and active status
      if (remoteR2.questionIndex !== undefined && remoteR2.questionIndex !== null) {
        currentQuestionIdx = Number(remoteR2.questionIndex) || 0;
      } else {
        currentQuestionIdx = recomputed.currentQuestionIndex;
      }

      liveR2.status = remoteR2.status || "idle";
      liveR2.setStarted = Boolean(remoteR2.setStarted) || currentQuestionIdx > 0 || liveR2.status !== "idle";
      liveR2.shownAt = remoteR2.shownAt || null;
      liveR2.deadline = remoteR2.deadline || null;
      liveR2.questionKey = remoteR2.questionKey || buildQuestionKey(selectedSet, currentQuestionIdx);
      liveR2.pauses = Array.isArray(remoteR2.pauses) ? remoteR2.pauses : remoteR2.pauses ? Object.values(remoteR2.pauses) : [];
      liveR2.lockedAt = remoteR2.lockedAt ?? null;
      liveR2.lockedRemainingMs = remoteR2.lockedRemainingMs ?? null;

      if (liveR2.status === "reading" || liveR2.status === "open" || liveR2.status === "locked" || liveR2.status === "revealed") {
        liveR2.activeQuestion = remoteR2.activeQuestion || getCurrentQuestion();
        if (remoteR2.results) liveR2.results = remoteR2.results;
        if (remoteR2.stats) liveR2.stats = remoteR2.stats;
        subscribeToQuestionAnswers(liveR2.questionKey);
        if (liveR2.status === "open" && liveR2.deadline && liveR2.deadline > getServerTime()) {
          startTimerTick();
        }
      }

      // Update current round in live state
      await update("live", { currentRound: "round2" });
      // Republish totals rebuilt from stored answers
      await updateAccumulatedScores();

      listen("drawRequest", (req) => {
        if (!req || !req.requestedAt) return;
        if (req.requestedAt === lastHandledDrawRequest) return;
        if (req.round !== "round2") return;
        if (!liveR2.setStarted) {
          lastHandledDrawRequest = req.requestedAt;
          set("drawRequest", null);
          runRound2Lottery();
        }
      });

      listen("live", (remoteLive) => {
        if (!remoteLive) return;
        latestLive = remoteLive;
        if (remoteLive.currentRound === "round1" && !remoteLive.round2?.setStarted && remoteLive.round2?.status === "idle") {
          stopTimerTick();
          currentQuestionIdx = 0;
          liveR2.status = "idle";
          liveR2.setStarted = false;
          liveR2.activeQuestion = null;
          liveR2.answers = {};
          liveR2.results = null;
          liveR2.history = [];
          renderStage();
        }
      });

      renderStage();
    }

    initRound2(false);
  </script>
</body>
</html>
