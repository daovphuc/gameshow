<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng xếp hạng - Đấu Trường Tri Thức</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar" aria-label="Thanh điều hướng bên trái"></aside>

    <main class="stage-main">
      <div class="section-header">
        <div>
          <div id="leaderboard-subtitle" class="stage-cluster-subtitle" style="font-size: 1rem; color: var(--accent); font-weight: 700; margin-bottom: 0.35rem; display: none;"></div>
          <h1 class="section-title">Bảng Xếp Hạng Đội Thi</h1>
          <p class="section-subtitle">
            Top 5 đội dẫn đầu vinh danh trên bục cúp chiến thắng; điểm số tự động cập nhật trực tiếp theo thời gian thực.
          </p>
        </div>

        <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
          <div class="tabs-bar" role="tablist" aria-label="Chọn bảng xếp hạng">
            <button type="button" class="tab-btn active" data-tab="total">Tổng Điểm</button>
            <button type="button" class="tab-btn" data-tab="round1">Vòng 1</button>
            <button type="button" class="tab-btn" data-tab="round2">Vòng 2</button>
            <button type="button" class="tab-btn" data-tab="round3">Vòng 3</button>
          </div>
          <button type="button" id="btn-export-report-csv" class="btn btn-outline" title="Xuất báo cáo tổng kết dạng bảng CSV/Excel">
            ⬇ Tải báo cáo kết quả (CSV)
          </button>
        </div>
      </div>

      <canvas id="fireworks-canvas" class="fireworks-canvas" style="position: fixed; inset: 0; pointer-events: none; z-index: 1000; width: 100vw; height: 100vh;"></canvas>
      <section id="podium-section" class="trophy-podium-stage animate-rise" aria-label="Bục vinh danh Top 5"></section>
      <section id="leaderboard-list" class="leaderboard-list" aria-label="Danh sách các đội tiếp theo"></section>
    </main>
  </div>

  <script type="module">
    import {
      fetchQuizData,
      loadAppState,
      renderAvatarHtml,
      escapeHtml,
      wireStageLayout,
      showToast
    } from "./js/app.js";
    import {
      computeLeaderboard,
      buildPodiumSlots,
      formatSeconds,
      buildScoreboardRows,
      renderScoreboardTableHtml
    } from "./js/leaderboard.js";
    import { computeTeamScores } from "./js/state.js";
    import { listen, get } from "./js/backend.js";
    import { buildReportCsv } from "./js/report.js";

    const params = new URLSearchParams(window.location.search);
    let currentMode = params.get("tab") || "total";
    if (!["total", "round1", "round2", "round3"].includes(currentMode)) {
      currentMode = "total";
    }

    let quizData = null;
    let gameState = null;
    let lastPodiumSignature = "";

    function renderTrophySvg(trophyType, slotNumber) {
      const gradId = `trophy-grad-${trophyType}-${slotNumber}`;
      const shineId = `trophy-shine-${trophyType}-${slotNumber}`;
      const palettes = {
        gold: {
          stop1: "#FFF3B0",
          stop2: "#F6BD16",
          stop3: "#B77900",
          stroke: "#8C5800",
          base1: "#9C6500",
          base2: "#5E3A00",
          star: "#FFFDF2"
        },
        silver: {
          stop1: "#FFFFFF",
          stop2: "#CBD5E1",
          stop3: "#64748B",
          stroke: "#475569",
          base1: "#64748B",
          base2: "#334155",
          star: "#F8FAFC"
        },
        bronze: {
          stop1: "#FDE0C2",
          stop2: "#D97742",
          stop3: "#8C421A",
          stroke: "#692E0E",
          base1: "#7C3A16",
          base2: "#4A2009",
          star: "#FFF5EB"
        },
        clay: {
          stop1: "#F7C6AE",
          stop2: "#D97757",
          stop3: "#9E472A",
          stroke: "#7A3219",
          base1: "#8A3E24",
          base2: "#542210",
          star: "#FFF3EC"
        }
      };
      const p = palettes[trophyType] || palettes.clay;

      if (trophyType === "clay") {
        return `
          <svg class="podium-trophy-svg trophy-svg trophy-${trophyType}" viewBox="0 0 80 84" role="img" aria-label="Cúp hạng ${slotNumber}">
            <defs>
              <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="${p.stop1}" />
                <stop offset="50%" stop-color="${p.stop2}" />
                <stop offset="100%" stop-color="${p.stop3}" />
              </linearGradient>
            </defs>
            <!-- Handles -->
            <path d="M22 22 C11 22, 11 40, 24 42" fill="none" stroke="url(#${gradId})" stroke-width="4.5" stroke-linecap="round" />
            <path d="M58 22 C69 22, 69 40, 56 42" fill="none" stroke="url(#${gradId})" stroke-width="4.5" stroke-linecap="round" />
            <!-- Cup bowl -->
            <path d="M20 14 H60 V30 C60 44, 49 52, 40 52 C31 52, 20 44, 20 30 Z" fill="url(#${gradId})" stroke="${p.stroke}" stroke-width="2" />
            <!-- Star emblem -->
            <polygon points="40,22 42.6,27.5 48.6,28.3 44.2,32.5 45.3,38.4 40,35.5 34.7,38.4 35.8,32.5 31.4,28.3 37.4,27.5" fill="${p.star}" opacity="0.92" />
            <!-- Stem -->
            <rect x="36" y="52" width="8" height="12" rx="2" fill="url(#${gradId})" stroke="${p.stroke}" stroke-width="1.5" />
            <!-- Base -->
            <rect x="24" y="64" width="32" height="7" rx="3" fill="${p.base1}" stroke="${p.stroke}" stroke-width="1.5" />
            <rect x="19" y="71" width="42" height="8" rx="3" fill="${p.base2}" stroke="${p.stroke}" stroke-width="1.5" />
          </svg>
        `;
      }

      return `
        <svg class="podium-trophy-svg trophy-svg trophy-${trophyType}" viewBox="0 0 96 100" role="img" aria-label="Cúp vinh danh hạng ${slotNumber}">
          <defs>
            <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="${p.stop1}" />
              <stop offset="52%" stop-color="${p.stop2}" />
              <stop offset="100%" stop-color="${p.stop3}" />
            </linearGradient>
            <linearGradient id="${shineId}" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
            </linearGradient>
          </defs>
          <!-- Left & Right Handles -->
          <path d="M24 22 C8 22, 8 48, 27 50" fill="none" stroke="url(#${gradId})" stroke-width="5.5" stroke-linecap="round" />
          <path d="M72 22 C88 22, 88 48, 69 50" fill="none" stroke="url(#${gradId})" stroke-width="5.5" stroke-linecap="round" />
          <!-- Rim -->
          <rect x="20" y="10" width="56" height="6" rx="3" fill="url(#${gradId})" stroke="${p.stroke}" stroke-width="2" />
          <!-- Bowl -->
          <path d="M22 16 H74 V36 C74 54, 59 64, 48 64 C37 64, 22 54, 22 36 Z" fill="url(#${gradId})" stroke="${p.stroke}" stroke-width="2.2" />
          <!-- Highlight shine -->
          <path d="M28 20 H36 V36 C36 47, 32 54, 28 56 Z" fill="url(#${shineId})" />
          <!-- Center Star -->
          <polygon points="48,24 51.5,31.2 59.4,32.3 53.7,37.8 55.1,45.7 48,41.9 40.9,45.7 42.3,37.8 36.6,32.3 44.5,31.2" fill="${p.star}" stroke="${p.stroke}" stroke-width="1" />
          <!-- Stem -->
          <path d="M42 64 H54 L56 78 H40 Z" fill="url(#${gradId})" stroke="${p.stroke}" stroke-width="2" />
          <!-- Collar -->
          <rect x="33" y="76" width="30" height="6" rx="3" fill="url(#${gradId})" stroke="${p.stroke}" stroke-width="1.8" />
          <!-- Pedestal Base -->
          <rect x="24" y="82" width="48" height="12" rx="3.5" fill="${p.base2}" stroke="${p.stroke}" stroke-width="2" />
          <rect x="32" y="85" width="32" height="5" rx="1.5" fill="url(#${gradId})" />
        </svg>
      `;
    }

    function renderPodiumSlot(slotEntry) {
      const isWinner = slotEntry.slot === 1;
      const r2TimeStr = currentMode === "round2" && slotEntry.round2Seconds
        ? ` <span class="podium-r2-time" style="font-size: 0.88rem; font-weight: normal; color: var(--text-muted);">(${formatSeconds(slotEntry.round2Seconds)})</span>`
        : "";
      return `
        <div class="podium-column slot-${slotEntry.slot}" data-slot="${slotEntry.slot}" data-rank="${slotEntry.rank}">
          <div class="podium-team-card">
            ${renderAvatarHtml(slotEntry, isWinner ? "team-avatar-lg" : "")}
            <h2 class="podium-team-name" title="${escapeHtml(slotEntry.name)}">${escapeHtml(slotEntry.name)}</h2>
            <div class="podium-team-score">${slotEntry.score} <span>điểm</span>${r2TimeStr}</div>
            <div class="podium-team-rounds">
              V1: ${slotEntry.round1} • V2: ${slotEntry.round2} • V3: ${slotEntry.round3}
            </div>
          </div>

          <div class="podium-trophy-figure">
            ${renderTrophySvg(slotEntry.trophy, slotEntry.slot)}
          </div>

          <div class="podium-block slot-${slotEntry.slot}" aria-label="Bục vị trí ${slotEntry.slot}, hạng ${slotEntry.rank}">
            <span class="podium-block-rank">${slotEntry.slot}</span>
          </div>
        </div>
      `;
    }

    let fireworksRunning = false;
    let fireworksRafId = null;
    let lastBurstTime = 0;
    let lastFrameTime = 0;

    const MAX_PARTICLES = 180;
    const particlePool = Array.from({ length: MAX_PARTICLES }, () => ({
      active: false,
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      color: "#F59E0B",
      alpha: 0,
      decay: 0.015,
      radius: 2
    }));

    const FIREWORK_COLORS = [
      "#F59E0B", "#EF4444", "#10B981", "#3B82F6",
      "#8B5CF6", "#EC4899", "#FBBF24", "#FFFFFF"
    ];

    function getPodiumOrigins(width, height) {
      const podiumCols = document.querySelectorAll(".podium-column");
      const origins = [];
      podiumCols.forEach((col) => {
        const rect = col.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          origins.push({
            x: rect.left + rect.width / 2,
            y: Math.max(80, rect.top - 20)
          });
        }
      });
      if (origins.length === 0) {
        origins.push(
          { x: width * 0.3, y: height * 0.3 },
          { x: width * 0.5, y: height * 0.22 },
          { x: width * 0.7, y: height * 0.3 }
        );
      }
      return origins;
    }

    function spawnBurst(originX, originY, count = 22) {
      const baseColor = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
      let spawned = 0;

      for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
        const p = particlePool[i];
        if (!p.active) {
          p.active = true;
          p.x = originX + (Math.random() - 0.5) * 24;
          p.y = originY + (Math.random() - 0.5) * 16;
          const angle = (Math.PI * 2 * spawned) / count + (Math.random() - 0.5) * 0.35;
          const speed = 2.0 + Math.random() * 4.2;
          p.vx = Math.cos(angle) * speed;
          p.vy = Math.sin(angle) * speed - 0.5;
          p.color = Math.random() > 0.25 ? baseColor : FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
          p.alpha = 1;
          p.decay = 0.011 + Math.random() * 0.012;
          p.radius = 2 + Math.random() * 2;
          spawned++;
        }
      }
    }

    function stopPodiumFireworks() {
      fireworksRunning = false;
      if (fireworksRafId) {
        cancelAnimationFrame(fireworksRafId);
        fireworksRafId = null;
      }
      for (const p of particlePool) {
        p.active = false;
      }
      const canvas = document.getElementById("fireworks-canvas");
      if (canvas) {
        const ctx = canvas.getContext("2d");
        if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function startPodiumFireworks() {
      if (fireworksRunning) return;
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }

      const canvas = document.getElementById("fireworks-canvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;

      fireworksRunning = true;
      lastBurstTime = 0;
      lastFrameTime = performance.now();

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = window.innerWidth;
        const height = window.innerHeight;
        if (canvas.width !== width * dpr || canvas.height !== height * dpr) {
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.scale(dpr, dpr);
        }
      }

      resizeCanvas();

      function loop(now) {
        if (!fireworksRunning) return;

        if (document.hidden) {
          fireworksRafId = requestAnimationFrame(loop);
          return;
        }

        const elapsed = now - lastFrameTime;
        if (elapsed < 24) {
          fireworksRafId = requestAnimationFrame(loop);
          return;
        }
        lastFrameTime = now;

        resizeCanvas();
        const width = window.innerWidth;
        const height = window.innerHeight;

        if (now - lastBurstTime > 750) {
          lastBurstTime = now;
          const origins = getPodiumOrigins(width, height);
          if (origins.length > 0) {
            const origin = origins[Math.floor(Math.random() * origins.length)];
            spawnBurst(origin.x, origin.y, 22);
            if (origins.length > 2 && Math.random() > 0.5) {
              const second = origins[Math.floor(Math.random() * origins.length)];
              if (second !== origin) spawnBurst(second.x, second.y, 18);
            }
          }
        }

        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < MAX_PARTICLES; i++) {
          const p = particlePool[i];
          if (!p.active) continue;

          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.045;
          p.vx *= 0.985;
          p.vy *= 0.985;
          p.alpha -= p.decay;

          if (p.alpha <= 0 || p.y > height + 20) {
            p.active = false;
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        fireworksRafId = requestAnimationFrame(loop);
      }

      const origins = getPodiumOrigins(window.innerWidth, window.innerHeight);
      origins.forEach((orig, idx) => {
        setTimeout(() => {
          if (fireworksRunning) spawnBurst(orig.x, orig.y, 24);
        }, idx * 180);
      });

      fireworksRafId = requestAnimationFrame(loop);
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        const canvas = document.getElementById("fireworks-canvas");
        if (canvas) {
          const ctx = canvas.getContext("2d");
          if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      } else if (fireworksRunning) {
        lastFrameTime = performance.now();
        lastBurstTime = performance.now();
      }
    });

    if (window.matchMedia) {
      const mql = window.matchMedia("(prefers-reduced-motion: reduce)");
      mql.addEventListener?.("change", (e) => {
        if (e.matches) {
          stopPodiumFireworks();
        }
      });
    }

    function renderBoard() {
      if (!quizData || !gameState) return;

      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === currentMode);
      });

      const derivedScores = computeTeamScores({
        teams: quizData.teams,
        live: gameState,
        config: quizData.config
      });

      const ranked = computeLeaderboard(quizData.teams, derivedScores, currentMode, {
        tieBreak: true,
        round2Stats: gameState?.round2Stats || {}
      });
      const podiumEl = document.getElementById("podium-section");
      const listEl = document.getElementById("leaderboard-list");

      const podiumSlots = buildPodiumSlots(ranked);
      const rest = podiumSlots.length === 0 ? ranked : ranked.slice(Math.min(5, podiumSlots.length));

      const nextSignature = `${currentMode}::${podiumSlots
        .map((s) => `${s.slot}:${s.id}:${s.rank}:${s.score}:${s.round1}:${s.round2}:${s.round3}`)
        .join("|")}`;

      if (nextSignature !== lastPodiumSignature) {
        lastPodiumSignature = nextSignature;
        podiumEl.classList.remove("animate-rise");
        void podiumEl.offsetWidth;
        podiumEl.classList.add("animate-rise");

        if (podiumSlots.length === 0) {
          stopPodiumFireworks();
          podiumEl.innerHTML = `
            <div class="podium-waiting-card" style="text-align: center; padding: 3.5rem 1.5rem; color: var(--text-muted); font-size: 1.25rem; font-weight: 700;">
              Chưa có điểm
            </div>
          `;
        } else {
          podiumEl.innerHTML = `
            <div class="podium-columns-row">
              ${podiumSlots.map((slotEntry) => renderPodiumSlot(slotEntry)).join("")}
            </div>
            <div class="podium-striped-base" aria-hidden="true"></div>
          `;
          startPodiumFireworks();
        }
      }

      const scoreboardRows = buildScoreboardRows(quizData.teams, derivedScores, {
        round2Stats: gameState?.round2Stats || {},
        mode: currentMode
      });

      listEl.innerHTML = renderScoreboardTableHtml(scoreboardRows, {
        highlightMode: currentMode,
        tableClass: "scoreboard-table",
        wrapClass: "scoreboard-table-wrap"
      });
    }

    async function initLeaderboard(forceRefresh = false) {
      quizData = await fetchQuizData({ forceRefresh, portal: "host" });
      gameState = loadAppState(quizData.teams);
      document.title = `Bảng xếp hạng - ${quizData.config.show_title}`;

      renderBoard();

      // Listen to real-time updates from Firebase / Local Mode
      listen("live", (remoteLive) => {
        if (!remoteLive) return;
        gameState = { ...gameState, ...remoteLive };
        renderBoard();
      });

      const subEl = document.getElementById("leaderboard-subtitle");
      if (subEl && quizData?.config?.show_subtitle) {
        subEl.textContent = quizData.config.show_subtitle;
        subEl.style.display = "block";
      }

      wireStageLayout({
        activePage: "leaderboard",
        config: quizData.config,
        teams: quizData.teams,
        onReload: () => initLeaderboard(true)
      });
    }

    document.getElementById("btn-export-report-csv")?.addEventListener("click", async () => {
      try {
        const allAnswers = (await get("answers")) || {};
        const csvContent = buildReportCsv({
          teams: quizData.teams,
          judges: quizData.judges,
          gameState,
          round2Questions: quizData.round2Questions,
          allAnswers,
          config: quizData.config
        });

        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const dateStr = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `Ket_qua_Hoi_thi_PCCC_CNCH_${dateStr}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("Đã tải file báo cáo CSV thành công!");
      } catch (err) {
        showToast("Lỗi khi xuất báo cáo: " + err.message);
      }
    });

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        currentMode = btn.dataset.tab;
        renderBoard();
      });
    });

    window.addEventListener("storage", () => {
      if (quizData) {
        gameState = loadAppState(quizData.teams);
        renderBoard();
      }
    });

    initLeaderboard(false);
  </script>
</body>
</html>
