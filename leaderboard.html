<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng xếp hạng - Đấu Trường Tri Thức</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar" aria-label="Thanh điều hướng bên trái"></aside>

    <main class="stage-main">
      <div class="section-header">
        <div>
          <h1 class="section-title">Bảng Xếp Hạng Đội Thi</h1>
          <p class="section-subtitle">
            Top 5 đội dẫn đầu hiển thị theo tháp vinh danh; điểm số tự động cập nhật mỗi 10 giây.
          </p>
        </div>

        <div class="tabs-bar" role="tablist" aria-label="Chọn bảng xếp hạng">
          <button type="button" class="tab-btn active" data-tab="total">Tổng Điểm</button>
          <button type="button" class="tab-btn" data-tab="round1">Vòng 1</button>
          <button type="button" class="tab-btn" data-tab="round2">Vòng 2</button>
          <button type="button" class="tab-btn" data-tab="round3">Vòng 3</button>
        </div>
      </div>

      <section id="pyramid-section" class="pyramid-section" aria-label="Tháp vinh danh Top 5"></section>
      <section id="leaderboard-list" class="leaderboard-list" aria-label="Danh sách các đội tiếp theo"></section>
    </main>
  </div>

  <script type="module">
    import {
      fetchQuizData,
      fetchSheetScoresOnly,
      loadAppState,
      renderAvatarHtml,
      escapeHtml,
      wireStageLayout
    } from "./js/app.js";
    import { computeLeaderboard } from "./js/leaderboard.js";

    const params = new URLSearchParams(window.location.search);
    let currentMode = params.get("tab") || "total";
    if (!["total", "round1", "round2", "round3"].includes(currentMode)) {
      currentMode = "total";
    }

    let quizData = null;
    let gameState = null;

    function renderPyramidCard(entry, isTopOne = false) {
      return `
        <div class="pyramid-card rank-${entry.rank}">
          <span class="pyramid-rank-badge">Hạng #${entry.rank}</span>
          ${renderAvatarHtml(entry, isTopOne ? "team-avatar-lg" : "")}
          <h2 class="team-card-name" style="margin-top: 0.75rem;">${escapeHtml(entry.name)}</h2>
          <div class="pyramid-score">${entry.score} <span style="font-size: 0.95rem; font-weight: 600;">điểm</span></div>
          <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.35rem; font-family: var(--font-mono);">
            V1: ${entry.round1} • V2: ${entry.round2} • V3: ${entry.round3}
          </div>
        </div>
      `;
    }

    function renderBoard() {
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === currentMode);
      });

      const ranked = computeLeaderboard(quizData.teams, gameState, currentMode);
      const pyramidEl = document.getElementById("pyramid-section");
      const listEl = document.getElementById("leaderboard-list");

      // Top 5 pyramid: 1 on top, 2-3 in second row, 4-5 in third row
      const top5 = ranked.slice(0, 5);
      const rest = ranked.slice(5);

      const row1 = top5.slice(0, 1);
      const row2 = top5.slice(1, 3);
      const row3 = top5.slice(3, 5);

      pyramidEl.innerHTML = `
        ${
          row1.length
            ? `<div class="pyramid-row pyramid-row-1">${row1.map((e) => renderPyramidCard(e, true)).join("")}</div>`
            : ""
        }
        ${
          row2.length
            ? `<div class="pyramid-row pyramid-row-2">${row2.map((e) => renderPyramidCard(e, false)).join("")}</div>`
            : ""
        }
        ${
          row3.length
            ? `<div class="pyramid-row pyramid-row-3">${row3.map((e) => renderPyramidCard(e, false)).join("")}</div>`
            : ""
        }
      `;

      listEl.innerHTML = rest
        .map(
          (entry) => `
          <div class="leaderboard-row">
            <div class="rank-number">#${entry.rank}</div>
            <div class="leaderboard-team-info">
              ${renderAvatarHtml(entry)}
              <div class="leaderboard-team-name">${escapeHtml(entry.name)}</div>
            </div>
            <div class="leaderboard-subscores">
              <span>V1: <strong>${entry.round1}</strong></span>
              <span>V2: <strong>${entry.round2}</strong></span>
              <span>V3: <strong>${entry.round3}</strong></span>
              <span>Tổng: <strong>${entry.total}</strong></span>
            </div>
            <div class="leaderboard-main-score">${entry.score} đ</div>
          </div>
        `
        )
        .join("");
    }

    async function refreshScoresSilently() {
      if (!quizData) return;
      try {
        const latestSheetScores = await fetchSheetScoresOnly(quizData.teams);
        quizData.scores = latestSheetScores;
        gameState = loadAppState(quizData.teams, latestSheetScores);
        renderBoard();
      } catch {
        // Fallback to localStorage state if offline or sheet temporarily unreachable
        gameState = loadAppState(quizData.teams, quizData.scores);
        renderBoard();
      }
    }

    async function initLeaderboard(forceRefresh = false) {
      quizData = await fetchQuizData({ forceRefresh });
      gameState = loadAppState(quizData.teams, quizData.scores);
      document.title = `Bảng xếp hạng - ${quizData.config.show_title}`;

      renderBoard();

      wireStageLayout({
        activePage: "leaderboard",
        config: quizData.config,
        onBack: () => {
          window.location.href = "./round3.html";
        },
        onContinue: () => {
          window.location.href = "./scores.html";
        },
        onReload: () => initLeaderboard(true)
      });
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        currentMode = btn.dataset.tab;
        renderBoard();
      });
    });

    window.addEventListener("storage", () => {
      if (quizData) {
        gameState = loadAppState(quizData.teams, quizData.scores);
        renderBoard();
      }
    });

    // Auto-refresh scores every 10 seconds for secondary/stage screens
    setInterval(refreshScoresSilently, 10000);

    initLeaderboard(false);
  </script>
</body>
</html>
