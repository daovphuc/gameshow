<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hội Thi PCCC &amp; CNCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="home-page-body">
  <div class="home-page-wrap">
    <header class="home-hero">
      <h1 id="hero-title" class="home-hero-title">Hội Thi Cán Bộ PCCC &amp; CNCH</h1>
    </header>

    <div class="home-tiles-grid" role="group" aria-label="Các cổng truy cập">
      <!-- 1. Host Tile -->
      <button type="button" class="home-tile" data-portal="host">
        <div class="home-tile-icon" aria-hidden="true">🖥</div>
        <div class="home-tile-name">Dẫn chương trình</div>
      </button>

      <!-- 2. Judge Tile -->
      <button type="button" class="home-tile" data-portal="judge">
        <div class="home-tile-icon" aria-hidden="true">📋</div>
        <div class="home-tile-name">Ban Giám khảo</div>
      </button>

      <!-- 3. Team Tile -->
      <button type="button" class="home-tile" data-portal="team">
        <div class="home-tile-icon" aria-hidden="true">📱</div>
        <div class="home-tile-name">Đội thi đấu</div>
      </button>

      <!-- 4. Stage Timer Tile -->
      <button type="button" class="home-tile" data-portal="stage_timer">
        <div class="home-tile-icon" aria-hidden="true">⏱</div>
        <div class="home-tile-name">Đồng hồ sân khấu</div>
      </button>

      <!-- 5. Remote Draw Tile -->
      <button type="button" class="home-tile" data-portal="draw">
        <div class="home-tile-icon" aria-hidden="true">🎲</div>
        <div class="home-tile-name">Quay số từ xa</div>
      </button>
    </div>

    <!-- Active session banner if already logged in -->
    <div id="home-active-session" class="home-active-session" style="display: none;"></div>
  </div>

  <!-- Login Modal Dialog -->
  <div id="login-modal" class="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-modal-title" style="display: none;">
    <div class="login-modal-card">
      <button type="button" id="login-modal-close" class="login-modal-close" aria-label="Đóng">✕</button>
      <div class="login-modal-header">
        <div class="login-modal-icon">🔐</div>
        <h2 id="login-modal-title" class="login-modal-title">Đăng Nhập</h2>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div class="login-field">
          <label for="login-username" class="login-label">Tên đăng nhập</label>
          <input
            type="text"
            id="login-username"
            class="login-input"
            placeholder="Nhập tên đăng nhập..."
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          />
        </div>

        <div class="login-field">
          <label for="login-password" class="login-label">Mật khẩu</label>
          <input
            type="password"
            id="login-password"
            class="login-input"
            placeholder="Nhập mật khẩu..."
            autocomplete="current-password"
            required
          />
        </div>

        <div id="login-error" class="login-error" role="alert" aria-live="polite"></div>

        <button type="submit" id="login-submit" class="btn btn-primary btn-lg" style="width: 100%; justify-content: center;">
          Đăng nhập
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { fetchQuizData, escapeHtml, logoutUser, listenContent } from "./js/app.js";
    import { contentToQuizData } from "./js/content.js";
    import { isFirebaseBackend, signInAndResolveRole } from "./js/backend.js";
    import {
      authenticate,
      getActiveSession,
      saveActiveSession,
      validateSession,
      getPortalUrl,
      isRoleAllowedForPortal
    } from "./js/auth.js";

    let quizData = null;
    let currentTargetPortal = null;

    const PORTAL_PAGES = {
      host: "./host.html",
      judge: "./judge.html",
      team: "./team.html",
      stage_timer: "./stage-timer.html",
      "stage-timer": "./stage-timer.html",
      draw: "./draw.html"
    };

    function findStoredSessionForPortal(portal, accounts = []) {
      const clean = String(portal || "").toLowerCase().trim();
      let session = null;
      if (clean === "host") {
        session = getActiveSession(undefined, "host");
      } else if (clean === "judge") {
        session = getActiveSession(undefined, "judge") || getActiveSession(undefined, "head_judge");
      } else if (clean === "team") {
        session = getActiveSession(undefined, "team");
      } else if (clean === "stage_timer" || clean === "stage-timer") {
        session = getActiveSession(undefined, "host") || getActiveSession(undefined, "head_judge");
      } else if (clean === "draw") {
        session = getActiveSession(undefined, "host") || getActiveSession(undefined, "team");
      }

      if (!session) return null;

      if (isFirebaseBackend()) {
        if (isRoleAllowedForPortal(session.role, clean)) {
          return { session, url: PORTAL_PAGES[clean] || getPortalUrl(session.role) };
        }
      } else {
        const valid = validateSession(session, accounts, clean);
        if (valid) {
          return { session, url: PORTAL_PAGES[clean] || getPortalUrl(session.role) };
        }
      }
      return null;
    }

    function renderActiveSession(accounts = []) {
      const banner = document.getElementById("home-active-session");
      if (!banner) return;
      const session = getActiveSession();
      if (!session) {
        banner.style.display = "none";
        return;
      }

      let valid = null;
      if (isFirebaseBackend()) {
        const portal = (session.role === "judge" || session.role === "head_judge") ? "judge" : (session.role === "team" ? "team" : "host");
        if (isRoleAllowedForPortal(session.role, portal)) {
          valid = session;
        }
      } else {
        valid = validateSession(session, accounts);
      }

      if (valid) {
        const portalUrl = getPortalUrl(valid.role);
        const roleLabels = { host: "Dẫn chương trình", judge: "Ban Giám khảo", head_judge: "Giám khảo tổng", team: "Đội thi" };
        const roleName = roleLabels[valid.role] || valid.role;
        banner.style.display = "inline-flex";
        banner.innerHTML = `
          <span>Đang đăng nhập: <strong>${escapeHtml(valid.display_name || valid.username)}</strong> (${escapeHtml(roleName)})</span>
          <a href="${portalUrl}" class="btn btn-primary btn-sm" style="text-decoration: none;">Vào cổng →</a>
          <button type="button" id="btn-home-logout" class="btn btn-sm">Đăng xuất</button>
        `;
        document.getElementById("btn-home-logout")?.addEventListener("click", () => {
          logoutUser(valid.role);
          banner.style.display = "none";
        });
      } else {
        banner.style.display = "none";
      }
    }

    function openLoginModal(targetPortal = "") {
      currentTargetPortal = targetPortal;
      const modal = document.getElementById("login-modal");
      const usernameInput = document.getElementById("login-username");
      const passwordInput = document.getElementById("login-password");
      const errorEl = document.getElementById("login-error");
      const titleEl = document.getElementById("login-modal-title");
      if (!modal) return;

      if (errorEl) errorEl.textContent = "";

      const portalTitles = {
        host: "Đăng Nhập — Dẫn chương trình",
        judge: "Đăng Nhập — Ban Giám khảo",
        team: "Đăng Nhập — Đội thi đấu",
        stage_timer: "Đăng Nhập — Đồng hồ sân khấu",
        draw: "Đăng Nhập — Quay số từ xa"
      };
      if (titleEl) {
        titleEl.textContent = portalTitles[targetPortal] || "Đăng Nhập";
      }

      modal.style.display = "flex";

      if (usernameInput) {
        usernameInput.value = "";
        usernameInput.focus();
      }
      if (passwordInput) passwordInput.value = "";
    }

    function closeLoginModal() {
      const modal = document.getElementById("login-modal");
      if (modal) modal.style.display = "none";
      currentTargetPortal = null;
    }

    async function handleLoginFormSubmit(e) {
      e.preventDefault();
      const usernameInput = document.getElementById("login-username");
      const passwordInput = document.getElementById("login-password");
      const errorEl = document.getElementById("login-error");
      const submitBtn = document.getElementById("login-submit");

      const u = usernameInput ? usernameInput.value : "";
      const p = passwordInput ? passwordInput.value : "";
      const target = currentTargetPortal;

      if (submitBtn) submitBtn.disabled = true;
      try {
        if (isFirebaseBackend()) {
          const res = await signInAndResolveRole(u, p);
          if (res.ok) {
            if (target && !isRoleAllowedForPortal(res.role, target)) {
              if (errorEl) {
                errorEl.textContent = "Tài khoản không có quyền truy cập vào cổng này.";
              }
              return;
            }
            saveActiveSession(res.session);
            const targetUrl = target ? (PORTAL_PAGES[target] || getPortalUrl(res.role)) : res.portalUrl;
            window.location.href = targetUrl;
          } else {
            if (errorEl) {
              errorEl.textContent = res.error || "Tên đăng nhập hoặc mật khẩu không chính xác.";
            }
            if (passwordInput) {
              passwordInput.select();
              passwordInput.focus();
            }
          }
          return;
        }

        // Local Mode
        const accounts = quizData?.accounts || [];
        const res = authenticate(u, p, accounts);
        if (res.ok) {
          if (target && !isRoleAllowedForPortal(res.account.role, target)) {
            if (errorEl) {
              errorEl.textContent = "Tài khoản không có quyền truy cập vào cổng này.";
            }
            return;
          }
          saveActiveSession(res.account);
          const targetUrl = target ? (PORTAL_PAGES[target] || getPortalUrl(res.account.role)) : res.portalUrl;
          window.location.href = targetUrl;
        } else {
          if (errorEl) {
            errorEl.textContent = res.error || "Tên đăng nhập hoặc mật khẩu không chính xác.";
          }
          if (passwordInput) {
            passwordInput.select();
            passwordInput.focus();
          }
        }
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    }

    async function initHome() {
      try {
        quizData = await fetchQuizData({ portal: null });
        if (quizData?.config?.show_title) {
          document.title = quizData.config.show_title;
          const heroEl = document.getElementById("hero-title");
          if (heroEl) heroEl.textContent = quizData.config.show_title;
        }
        renderActiveSession(quizData?.accounts || []);
      } catch {
        // Fallback to static text
      }

      listenContent((newContent) => {
        if (newContent) {
          quizData = contentToQuizData(newContent);
          if (quizData?.config?.show_title) {
            document.title = quizData.config.show_title;
            const heroEl = document.getElementById("hero-title");
            if (heroEl) heroEl.textContent = quizData.config.show_title;
          }
          renderActiveSession(quizData?.accounts || []);
        }
      });

      // Wire tile clicks: reuse stored session or open login modal
      document.querySelectorAll(".home-tile").forEach((tile) => {
        tile.addEventListener("click", () => {
          const targetPortal = tile.dataset.portal || "";
          const stored = findStoredSessionForPortal(targetPortal, quizData?.accounts || []);
          if (stored) {
            window.location.href = stored.url;
            return;
          }
          openLoginModal(targetPortal);
        });
      });

      // Wire modal events
      document.getElementById("login-modal-close")?.addEventListener("click", closeLoginModal);
      const modal = document.getElementById("login-modal");
      modal?.addEventListener("click", (e) => {
        if (e.target === modal) closeLoginModal();
      });

      document.getElementById("login-form")?.addEventListener("submit", handleLoginFormSubmit);

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal?.style.display !== "none") {
          closeLoginModal();
        }
      });
    }

    initHome();
  </script>
</body>
</html>
