<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vòng 3 - Dẫn Chương Trình</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar" aria-label="Thanh điều hướng bên trái"></aside>

    <main class="stage-main">
      <div id="round3-stage"></div>
    </main>
  </div>

  <script type="module">
    import {
      fetchQuizData,
      loadAppState,
      saveAppState,
      renderAvatarHtml,
      escapeHtml,
      showToast,
      wireStageLayout
    } from "./js/app.js";
    import { resolveImageUrl } from "./js/data.js";
    import { getRoundTeams } from "./js/content.js";
    import {
      openRound3Tile,
      updateRound3TileSession,
      closeRound3Tile,
      startRound3Answer,
      getRound3PhaseSeconds
    } from "./js/state.js";
    import { createTimer, startTimer, tickTimer, formatTimer } from "./js/timer.js";
    import { set, update, listen, getServerTime } from "./js/backend.js";
    import { showLotteryDrawModal } from "./js/draw-ui.js";
    import { createCountdownSound } from "./js/sound.js";

    const SELECTED_TEAM_KEY = "gameshow_r3_selected_team";

    let quizData = null;
    let gameState = null;
    let selectedTeamId = sessionStorage.getItem(SELECTED_TEAM_KEY) || "";
    let showingRules = true;

    let currentTimer = null;
    let timerInterval = null;
    // Final 5-second countdown and buzzer on the projector speakers.
    const countdownSound = createCountdownSound();
    let activeTimerKey = null;

    function stopTimerLoop() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function ensureTileTimer(tileNumber, phase, durationSeconds) {
      const warnSec = Number(quizData?.config?.warning_seconds) || 5;
      const key = `r3_tile_${tileNumber}__${phase}`;
      if (activeTimerKey !== key || !currentTimer) {
        stopTimerLoop();
        activeTimerKey = key;
        currentTimer = createTimer(durationSeconds, warnSec);
      }
    }

    function triggerStartTimer() {
      if (!currentTimer || currentTimer.finished || currentTimer.status === "running") {
        return false;
      }
      const warnSec = Number(quizData?.config?.warning_seconds) || 5;
      const now = getServerTime();
      currentTimer = startTimer(currentTimer, now);
      updateTimerDom();
      stopTimerLoop();

      const phase = gameState.round3.activeTile?.phase || "prep";
      // Publish live timer for judges and secondary screens
      update("live/round3", {
        timer: {
          startedAt: now,
          durationSeconds: currentTimer.totalSeconds,
          status: "running",
          phase
        }
      });

      countdownSound.reset();
      timerInterval = setInterval(() => {
        currentTimer = tickTimer(currentTimer, getServerTime(), warnSec);
        updateTimerDom();
        countdownSound.update(currentTimer.remainingSeconds, true);
        if (currentTimer.finished) {
          stopTimerLoop();
          update("live/round3/timer", { status: "finished" });
          if (gameState.round3.activeTile?.phase === "prep") {
            handleFinishPrep();
          }
        }
      }, 100);
      return true;
    }

    /** Ends the preparation (on time or early) and starts the answer countdown. */
    function handleFinishPrep() {
      const tile = gameState.round3.activeTile;
      if (!tile || tile.phase === "answer") return;
      stopTimerLoop();

      gameState = startRound3Answer(gameState);
      saveAppState(gameState);
      syncLiveState();

      const { answer } = getRound3PhaseSeconds(quizData.config);
      ensureTileTimer(tile.number, "answer", answer);
      triggerStartTimer();
      renderStage();
      showToast(`Kết thúc chuẩn bị! Bắt đầu tính giờ trả lời (${Math.round(answer / 60)} phút).`);
    }

    function updateTimerDom() {
      const box = document.getElementById("r3-timer-box");
      const digits = document.getElementById("r3-timer-digits");
      const warnText = document.getElementById("r3-timer-warning");
      const startBtn = document.getElementById("btn-start-timer");
      if (!box || !currentTimer) return;

      box.classList.toggle("running", currentTimer.status === "running" && !currentTimer.warning);
      box.classList.toggle("warning", Boolean(currentTimer.warning));
      box.classList.toggle("finished", Boolean(currentTimer.finished));

      if (digits) {
        digits.textContent = formatTimer(currentTimer.remainingSeconds);
      }
      if (warnText) {
        if (currentTimer.finished) {
          warnText.textContent = "HẾT GIỜ!";
        } else if (currentTimer.warning) {
          warnText.textContent = `⚠ Còn ${currentTimer.remainingSeconds} giây!`;
        } else {
          warnText.textContent = "";
        }
      }
      if (startBtn) {
        startBtn.disabled = currentTimer.status === "running" || currentTimer.finished;
        startBtn.textContent = currentTimer.finished
          ? "Đã hết giờ"
          : currentTimer.status === "running"
            ? "Đang chạy..."
            : "▶ Bắt đầu";
      }
    }

    let lastHandledDrawRequest = 0;

    function setSelectedTeam(teamId) {
      selectedTeamId = teamId;
      if (teamId) {
        sessionStorage.setItem(SELECTED_TEAM_KEY, teamId);
      } else {
        sessionStorage.removeItem(SELECTED_TEAM_KEY);
      }

      if (gameState.round3.activeTile) {
        gameState = updateRound3TileSession(gameState, { selectedTeamId: teamId || null });
        saveAppState(gameState);
      }
      syncLiveState();
    }

    function syncLiveState() {
      const activeTile = gameState.round3.activeTile || null;
      set("live/round3", {
        openedTiles: gameState.round3.openedTiles || [],
        activeTile
      });
      set("live/currentRound", "round3");
      set("live/stageTeamId", activeTile?.selectedTeamId || selectedTeamId || null);

      if (!activeTile && selectedTeamId) {
        set("live/draw", {
          round: "round3",
          status: "pending",
          stageTeamId: selectedTeamId
        });
      } else {
        set("live/draw", null);
      }
    }

    function handleBack() {
      if (gameState.round3.activeTile) {
        gameState = closeRound3Tile(gameState);
        saveAppState(gameState);
        syncLiveState();
        stopTimerLoop();
        activeTimerKey = null;
        renderStage();
        return;
      }
      set("live/draw", null);
      window.location.href = "./round2.html";
    }

    function handleContinue() {
      if (gameState.round3.activeTile) {
        gameState = closeRound3Tile(gameState);
        saveAppState(gameState);
        syncLiveState();
        stopTimerLoop();
        activeTimerKey = null;
        renderStage();
        return;
      }
      set("live/draw", null);
      window.location.href = "./leaderboard.html";
    }

    function renderRulesStage(container) {
      stopTimerLoop();
      activeTimerKey = null;

      const rulesText = quizData.config?.round3_rules || "";
      const roundTitle = quizData.config?.round3_name || "Phần thi thứ ba: Xử lý tình huống truyền thông về PCCC và CNCH";

      container.innerHTML = `
        <div class="rules-stage" style="max-width: 960px; margin: 0 auto; padding: 1.5rem;">
          <div class="section-header" style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 1rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
              Quy định & Thể lệ
            </div>
            <h1 class="section-title" style="font-size: clamp(1.8rem, 3.5vw, 2.5rem); margin-bottom: 0.5rem;">
              ${escapeHtml(roundTitle)}
            </h1>
          </div>

          <div class="rules-card" style="background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius-lg, 16px); padding: clamp(1.5rem, 3vw, 2.5rem); box-shadow: var(--shadow-md, 0 4px 20px rgba(0,0,0,0.06)); margin-bottom: 2rem;">
            <div style="white-space: pre-wrap; font-family: var(--font-sans, system-ui); font-size: clamp(1.05rem, 1.8vw, 1.25rem); line-height: 1.8; color: var(--text);">${escapeHtml(rulesText)}</div>
          </div>

          <div style="display: flex; justify-content: center; gap: 1rem;">
            <button type="button" id="btn-dismiss-rules" class="btn btn-primary btn-lg" style="font-size: 1.25rem; padding: 0.85rem 2.5rem; font-weight: 700; border-radius: var(--radius-full, 9999px);">
              ${gameState?.round3?.activeTile ? "Quay lại phần thi →" : "Vào phần thi →"}
            </button>
          </div>
        </div>
      `;

      document.getElementById("btn-dismiss-rules")?.addEventListener("click", () => {
        showingRules = false;
        renderStage();
      });
    }

    function renderTeamSelectOptionsHtml(currentTeamId) {
      const roundTeams = getRoundTeams(quizData.teams, quizData.round_order, "round3");
      return roundTeams
        .map((team) => {
          const isSelected = team.id === currentTeamId ? "selected" : "";
          return `<option value="${escapeHtml(team.id)}" ${isSelected}>#${team.orderNumber} - ${escapeHtml(team.name)}</option>`;
        })
        .join("");
    }

    function runRound3Lottery() {
      const allTiles = quizData.round3Questions || [];
      const opened = gameState.round3.openedTiles || [];
      const remainingTiles = allTiles.filter((t) => !opened.includes(t.number));
      if (remainingTiles.length === 0) return;

      const roundTeams = getRoundTeams(quizData.teams, quizData.round_order, "round3");
      const team = roundTeams.find((t) => t.id === selectedTeamId) || roundTeams[0];
      const teamId = team ? team.id : selectedTeamId;

      showLotteryDrawModal({
        items: allTiles,
        exclude: opened,
        title: "BỐC THĂM Ô TÌNH HUỐNG VÒNG 3",
        getLabel: (tile) => `Ô số ${tile.number} (${tile.points}đ)`,
        onRolling: (drawnTile) => {
          set("live/draw", {
            round: "round3",
            status: "rolling",
            stageTeamId: teamId,
            pool: allTiles.map((t) => t.number),
            result: drawnTile.number
          });
        },
        onComplete: (drawnTile) => {
          set("live/draw", {
            round: "round3",
            status: "done",
            stageTeamId: teamId,
            pool: allTiles.map((t) => t.number),
            result: drawnTile.number
          });
          openTileByNumber(drawnTile.number, teamId);
        }
      });
    }

    function openTileByNumber(tileNumber, teamId) {
      const num = Number(tileNumber);
      const tile = quizData.round3Questions.find((q) => q.number === num);
      const roundTeams = getRoundTeams(quizData.teams, quizData.round_order, "round3");
      const targetTeamId = teamId || selectedTeamId || roundTeams[0]?.id || null;

      gameState = openRound3Tile(gameState, num, targetTeamId);
      if (tile && gameState.round3.activeTile) {
        gameState.round3.activeTile.question = tile.question;
      }
      saveAppState(gameState);
      syncLiveState();
      renderStage();
    }

    function renderDrawStage(container) {
      stopTimerLoop();
      activeTimerKey = null;

      const roundTeams = getRoundTeams(quizData.teams, quizData.round_order, "round3");
      if (!selectedTeamId && roundTeams.length > 0) {
        selectedTeamId = roundTeams[0].id;
      }
      const selectedTeam = roundTeams.find((t) => t.id === selectedTeamId) || roundTeams[0];
      const allTiles = quizData.round3Questions || [];
      const opened = gameState.round3.openedTiles || [];
      const remainingTiles = allTiles.filter((t) => !opened.includes(t.number));

      container.innerHTML = `
        <div class="section-header">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; width: 100%;">
            <div>
              ${quizData.config?.show_subtitle ? `<div class="stage-cluster-subtitle" style="font-size: 1rem; color: var(--accent); font-weight: 700; margin-bottom: 0.35rem;">${escapeHtml(quizData.config.show_subtitle)}</div>` : ""}
              <h1 class="section-title">${escapeHtml(quizData.config.round3_name)}</h1>
            </div>
            <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
              <button type="button" id="btn-open-rules" class="btn btn-icon" title="Thể lệ" aria-label="Thể lệ">📜</button>
            </div>
          </div>
        </div>

        <div class="round3-draw-container" style="max-width: 860px; margin: 2rem auto; display: flex; flex-direction: column; align-items: center; gap: 2rem; background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius-lg, 16px); padding: clamp(1.5rem, 3vw, 2.5rem); box-shadow: var(--shadow-md, 0 4px 20px rgba(0,0,0,0.06)); text-align: center;">
          <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1rem;">
            <div style="font-size: 0.85rem; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;">
              Đội thi trên sân khấu
            </div>
            <div class="question-team-banner" style="justify-content: center; padding: 0.75rem 1.75rem; border-radius: var(--radius-lg, 16px);">
              ${selectedTeam ? renderAvatarHtml(selectedTeam, "team-avatar-lg") : ""}
              <div style="text-align: left;">
                <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 700;">
                  #${selectedTeam?.orderNumber || "?"}
                </div>
                <div style="font-family: var(--font-serif); font-size: clamp(1.3rem, 2.5vw, 1.8rem); font-weight: 800; color: var(--text);">
                  ${selectedTeam ? escapeHtml(selectedTeam.name) : "Chưa chọn"}
                </div>
              </div>
            </div>

            <div class="team-select-group" style="display: flex; align-items: center; gap: 0.75rem; margin-top: 0.5rem;">
              <label for="r3-team-select" style="font-weight: 700; font-size: 1rem; color: var(--text-muted);">Chọn đội khác:</label>
              <select id="r3-team-select" class="team-dropdown" style="font-size: 1rem; padding: 0.5rem 1.25rem;">
                ${renderTeamSelectOptionsHtml(selectedTeamId)}
              </select>
            </div>
          </div>

          <div style="width: 100%; height: 1px; background: var(--border); margin: 0.5rem 0;"></div>

          <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem;">
            <button
              type="button"
              id="btn-start-lottery-r3"
              class="btn btn-primary btn-lg"
              style="font-size: clamp(1.2rem, 2vw, 1.5rem); font-weight: 800; padding: 1rem 3rem; border-radius: var(--radius-full, 9999px); box-shadow: 0 4px 25px rgba(217, 119, 87, 0.4); display: flex; align-items: center; gap: 0.75rem;"
              ${remainingTiles.length === 0 ? "disabled" : ""}
            >
              <span style="font-size: 1.5em;">🎲</span>
              <span>QUAY SỐ CHỌN Ô</span>
            </button>

            <div style="font-weight: 700; color: var(--text-muted); font-size: 1.05rem;">
              Đã mở: <strong style="color: var(--accent); font-size: 1.25rem;">${opened.length}</strong> / ${allTiles.length} ô tình huống
            </div>
          </div>
        </div>
      `;


      document.getElementById("btn-open-rules")?.addEventListener("click", () => {
        showingRules = true;
        renderStage();
      });

      document.getElementById("btn-start-lottery-r3")?.addEventListener("click", () => {
        runRound3Lottery();
      });

      document.getElementById("r3-team-select")?.addEventListener("change", (e) => {
        setSelectedTeam(e.target.value);
        renderStage();
      });
    }

    function renderActiveTileStage(container, activeTile) {
      const tile = quizData.round3Questions.find((q) => q.number === Number(activeTile.number));
      const roundTeams = getRoundTeams(quizData.teams, quizData.round_order, "round3");
      if (!tile) {
        gameState = closeRound3Tile(gameState);
        saveAppState(gameState);
        syncLiveState();
        renderStage();
        return;
      }

      const currentTeamId = activeTile.selectedTeamId || selectedTeamId || roundTeams[0]?.id || "";
      const currentTeam = roundTeams.find((t) => t.id === currentTeamId) || {
        id: currentTeamId,
        name: currentTeamId,
        color: "#D97757"
      };

      const phase = activeTile.phase === "answer" ? "answer" : "prep";
      const phaseSeconds = getRound3PhaseSeconds(quizData.config);
      const prepMin = Math.round(phaseSeconds.prep / 60);
      const answerMin = Math.round(phaseSeconds.answer / 60);
      ensureTileTimer(tile.number, phase, phase === "prep" ? phaseSeconds.prep : phaseSeconds.answer);

      container.innerHTML = `
        <div class="question-stage">
          <div class="screen-action-bar">
            <div class="screen-left-group">
              <button type="button" id="btn-screen-back" class="btn btn-icon" title="Quay lại" aria-label="Quay lại">←</button>
              <div class="question-team-banner">
                ${renderAvatarHtml(currentTeam, "team-avatar-sm")}
                <div>
                  <div style="font-size: 0.78rem; color: var(--accent); font-weight: 700; text-transform: uppercase;">
                    Ô tình huống #${tile.number} • ${tile.points} điểm
                  </div>
                  <div style="font-family: var(--font-serif); font-size: 1.3rem; font-weight: 700;">
                    ${escapeHtml(currentTeam.name)}
                  </div>
                </div>
              </div>
            </div>

            <div class="screen-right-group">
              <div class="team-select-group">
                <label for="r3-active-team-select" style="font-weight: 600; font-size: 0.92rem; color: var(--text-muted);">Đổi đội:</label>
                <select id="r3-active-team-select" class="team-dropdown">
                  ${renderTeamSelectOptionsHtml(currentTeamId)}
                </select>
              </div>

              <button type="button" id="btn-open-rules" class="btn btn-icon" title="Thể lệ" aria-label="Thể lệ">📜</button>

              <div id="r3-timer-box" class="top-timer-box">
                <span id="r3-timer-digits" class="top-timer-digits">${formatTimer(currentTimer.remainingSeconds)}</span>
                <span id="r3-timer-warning" class="top-timer-warning-text"></span>
                <button type="button" id="btn-start-timer" class="btn btn-primary btn-sm">
                  ▶ Bắt đầu
                </button>
              </div>

              ${
                phase === "prep"
                  ? `<button type="button" id="btn-finish-prep" class="btn btn-primary btn-sm" style="font-weight: 700; background: #0284c7; border-color: #0284c7;">
                      Hoàn thành chuẩn bị → Trả lời
                    </button>`
                  : ""
              }

              <button type="button" id="btn-screen-continue" class="btn btn-primary btn-lg">
                Đóng ô câu hỏi →
              </button>
            </div>
          </div>

          <div style="margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;">
            <div class="meta-pill" style="font-weight: 800; font-size: 0.95rem; padding: 0.4rem 1rem; border-radius: var(--radius-full); ${
              phase === "prep"
                ? "background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc;"
                : "background: #dcfce7; color: #15803d; border: 1px solid #86efac;"
            }">
              ${phase === "prep" ? `⏳ GIAI ĐOẠN CHUẨN BỊ (${prepMin} PHÚT)` : `🎤 GIAI ĐOẠN TRẢ LỜI (${answerMin} PHÚT)`}
            </div>
            ${phase === "prep" ? `<div style="font-size: 0.9rem; color: var(--text-muted);">Đội có ${prepMin} phút chuẩn bị. Bấm "Hoàn thành chuẩn bị" để trả lời ngay.</div>` : ""}
          </div>

          <article class="question-card">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem;">
              <span class="meta-pill accent" style="font-size: 1rem; padding: 0.4rem 1.1rem;">Tình huống #${tile.number} (${tile.points} điểm)</span>
              <span style="font-size: 0.95rem; color: var(--text-muted); font-weight: 600;">
                Thời gian: <strong>${prepMin} phút chuẩn bị + ${answerMin} phút trả lời</strong>
              </span>
            </div>
            <p class="question-text">${escapeHtml(tile.question)}</p>
            ${
              resolveImageUrl(tile.image_url)
                ? `<div class="question-image-wrap">
                    <img class="question-image" src="${escapeHtml(resolveImageUrl(tile.image_url))}" alt="" onerror="this.parentElement.remove()" />
                  </div>`
                : ""
            }
          </article>
        </div>
      `;

      updateTimerDom();

      document.getElementById("btn-screen-back")?.addEventListener("click", handleBack);
      document.getElementById("btn-screen-continue")?.addEventListener("click", handleContinue);
      document.getElementById("btn-open-rules")?.addEventListener("click", () => {
        showingRules = true;
        renderStage();
      });
      document.getElementById("r3-active-team-select")?.addEventListener("change", (e) => {
        setSelectedTeam(e.target.value);
        renderStage();
      });
      document.getElementById("btn-start-timer")?.addEventListener("click", () => {
        triggerStartTimer();
      });
      document.getElementById("btn-finish-prep")?.addEventListener("click", () => {
        handleFinishPrep();
      });
    }

    function renderStage() {
      const container = document.getElementById("round3-stage");
      if (showingRules) {
        renderRulesStage(container);
      } else {
        const activeTile = gameState.round3.activeTile;
        if (activeTile) {
          renderActiveTileStage(container, activeTile);
        } else {
          renderDrawStage(container);
        }
      }

      wireStageLayout({
        activePage: "round3",
        config: quizData.config,
        teams: quizData.teams,
        onBack: handleBack,
        onContinue: handleContinue,
        onReload: () => initRound3(true)
      });
    }

    async function initRound3(forceRefresh = false) {
      quizData = await fetchQuizData({ forceRefresh, portal: "host" });
      gameState = loadAppState(quizData.teams);
      document.title = `${quizData.config.round3_name} - ${quizData.config.show_title}`;

      update("live", {
        currentRound: "round3"
      });

      listen("drawRequest", (req) => {
        if (!req || !req.requestedAt) return;
        if (req.requestedAt === lastHandledDrawRequest) return;
        if (req.round !== "round3") return;
        if (!gameState.round3.activeTile && (req.teamId === selectedTeamId || req.teamId === "host")) {
          lastHandledDrawRequest = req.requestedAt;
          set("drawRequest", null);
          runRound3Lottery();
        }
      });

      // The database drops empty arrays and null values, so a missing field means
      // "empty" (for example right after "Đặt lại trận đấu"), not "unchanged".
      // Local mode re-delivers this path on every write under "live"; skip repeats
      // so a stale copy never overwrites a change that is about to be synced.
      let lastRemoteR3 = undefined;
      listen("live/round3", (remoteR3) => {
        const remoteJson = JSON.stringify(remoteR3 ?? null);
        if (remoteJson === lastRemoteR3) return;
        lastRemoteR3 = remoteJson;
        const r3 = remoteR3 || {};
        const opened = Array.isArray(r3.openedTiles)
          ? r3.openedTiles
          : r3.openedTiles && typeof r3.openedTiles === "object" ? Object.values(r3.openedTiles) : [];
        const before = JSON.stringify(gameState.round3.openedTiles || []);
        gameState.round3.openedTiles = opened;
        let changed = before !== JSON.stringify(opened);
        if (r3.activeTile) {
          if (gameState.round3.activeTile?.phase !== r3.activeTile.phase) changed = true;
          gameState.round3.activeTile = r3.activeTile;
        } else if (gameState.round3.activeTile) {
          gameState.round3.activeTile = null;
          stopTimerLoop();
          changed = true;
        }
        saveAppState(gameState);
        if (changed) renderStage();
      });

      renderStage();
    }

    initRound3(false);
  </script>
</body>
</html>
