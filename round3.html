<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vòng 3 - Dẫn Chương Trình</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar" aria-label="Thanh điều hướng bên trái"></aside>

    <main class="stage-main">
      <div id="round3-stage"></div>
    </main>
  </div>

  <script type="module">
    import {
      fetchQuizData,
      loadAppState,
      saveAppState,
      renderAvatarHtml,
      escapeHtml,
      wireStageLayout
    } from "./js/app.js";
    import { resolveImageUrl } from "./js/data.js";
    import { getRoundTeams } from "./js/content.js";
    import {
      isTileOpened,
      openRound3Tile,
      updateRound3TileSession,
      closeRound3Tile
    } from "./js/state.js";
    import { createTimer, startTimer, tickTimer, formatTimer } from "./js/timer.js";
    import { set, update, listen, getServerTime } from "./js/backend.js";

    const SELECTED_TEAM_KEY = "gameshow_r3_selected_team";

    let quizData = null;
    let gameState = null;
    let selectedTeamId = sessionStorage.getItem(SELECTED_TEAM_KEY) || "";
    let showingRules = true;

    let currentTimer = null;
    let timerInterval = null;
    let activeTimerKey = null;

    function stopTimerLoop() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function ensureTileTimer(tileNumber, durationSeconds) {
      const warnSec = Number(quizData?.config?.warning_seconds) || 5;
      const key = `r3_tile_${tileNumber}`;
      if (activeTimerKey !== key || !currentTimer) {
        stopTimerLoop();
        activeTimerKey = key;
        currentTimer = createTimer(durationSeconds, warnSec);
      }
    }

    function triggerStartTimer() {
      if (!currentTimer || currentTimer.finished || currentTimer.status === "running") {
        return false;
      }
      const warnSec = Number(quizData?.config?.warning_seconds) || 5;
      const now = getServerTime();
      currentTimer = startTimer(currentTimer, now);
      updateTimerDom();
      stopTimerLoop();

      // Publish live timer for judges and secondary screens
      update("live/round3", {
        timer: {
          startedAt: now,
          durationSeconds: currentTimer.totalSeconds,
          status: "running"
        }
      });

      timerInterval = setInterval(() => {
        currentTimer = tickTimer(currentTimer, getServerTime(), warnSec);
        updateTimerDom();
        if (currentTimer.finished) {
          stopTimerLoop();
          update("live/round3/timer", { status: "finished" });
        }
      }, 100);
      return true;
    }

    function updateTimerDom() {
      const box = document.getElementById("r3-timer-box");
      const digits = document.getElementById("r3-timer-digits");
      const warnText = document.getElementById("r3-timer-warning");
      const startBtn = document.getElementById("btn-start-timer");
      if (!box || !currentTimer) return;

      box.classList.toggle("running", currentTimer.status === "running" && !currentTimer.warning);
      box.classList.toggle("warning", Boolean(currentTimer.warning));
      box.classList.toggle("finished", Boolean(currentTimer.finished));

      if (digits) {
        digits.textContent = formatTimer(currentTimer.remainingSeconds);
      }
      if (warnText) {
        if (currentTimer.finished) {
          warnText.textContent = "HẾT GIỜ!";
        } else if (currentTimer.warning) {
          warnText.textContent = `⚠ Còn ${currentTimer.remainingSeconds} giây!`;
        } else {
          warnText.textContent = "";
        }
      }
      if (startBtn) {
        startBtn.disabled = currentTimer.status === "running" || currentTimer.finished;
        startBtn.textContent = currentTimer.finished
          ? "Đã hết giờ"
          : currentTimer.status === "running"
            ? "Đang chạy..."
            : "▶ Bắt đầu";
      }
    }

    function setSelectedTeam(teamId) {
      selectedTeamId = teamId;
      if (teamId) {
        sessionStorage.setItem(SELECTED_TEAM_KEY, teamId);
      } else {
        sessionStorage.removeItem(SELECTED_TEAM_KEY);
      }

      if (gameState.round3.activeTile) {
        gameState = updateRound3TileSession(gameState, teamId);
        saveAppState(gameState);
      }
      syncLiveState();
    }

    function syncLiveState() {
      set("live/round3", {
        openedTiles: gameState.round3.openedTiles || [],
        activeTile: gameState.round3.activeTile || null
      });
      set("live/currentRound", "round3");
      set("live/stageTeamId", gameState.round3.activeTile?.selectedTeamId || selectedTeamId || null);
    }

    function handleBack() {
      if (gameState.round3.activeTile) {
        gameState = closeRound3Tile(gameState);
        saveAppState(gameState);
        syncLiveState();
        stopTimerLoop();
        activeTimerKey = null;
        renderStage();
        return;
      }
      window.location.href = "./round2.html";
    }

    function handleContinue() {
      if (gameState.round3.activeTile) {
        gameState = closeRound3Tile(gameState);
        saveAppState(gameState);
        syncLiveState();
        stopTimerLoop();
        activeTimerKey = null;
        renderStage();
        return;
      }
      window.location.href = "./leaderboard.html";
    }

    function renderRulesStage(container) {
      stopTimerLoop();
      activeTimerKey = null;

      const rulesText = quizData.config?.round3_rules || "";
      const roundTitle = quizData.config?.round3_name || "Phần thi thứ ba: Xử lý tình huống truyền thông về PCCC và CNCH";

      container.innerHTML = `
        <div class="rules-stage" style="max-width: 960px; margin: 0 auto; padding: 1.5rem;">
          <div class="section-header" style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 1rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
              Quy định & Thể lệ
            </div>
            <h1 class="section-title" style="font-size: clamp(1.8rem, 3.5vw, 2.5rem); margin-bottom: 0.5rem;">
              ${escapeHtml(roundTitle)}
            </h1>
            <p class="section-subtitle" style="font-size: 1.1rem; color: var(--text-muted); margin: 0 auto;">
              MC đọc phổ biến thể lệ thi đấu trước khi bắt đầu phần thi
            </p>
          </div>

          <div class="rules-card" style="background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius-lg, 16px); padding: clamp(1.5rem, 3vw, 2.5rem); box-shadow: var(--shadow-md, 0 4px 20px rgba(0,0,0,0.06)); margin-bottom: 2rem;">
            <div style="white-space: pre-wrap; font-family: var(--font-sans, system-ui); font-size: clamp(1.05rem, 1.8vw, 1.25rem); line-height: 1.8; color: var(--text);">${escapeHtml(rulesText)}</div>
          </div>

          <div style="display: flex; justify-content: center; gap: 1rem;">
            <button type="button" id="btn-dismiss-rules" class="btn btn-primary btn-lg" style="font-size: 1.25rem; padding: 0.85rem 2.5rem; font-weight: 700; border-radius: var(--radius-full, 9999px);">
              ${gameState?.round3?.activeTile ? "Quay lại phần thi →" : "Vào phần thi →"}
            </button>
          </div>
        </div>
      `;

      document.getElementById("btn-dismiss-rules")?.addEventListener("click", () => {
        showingRules = false;
        renderStage();
      });
    }

    function renderTeamSelectOptionsHtml(currentTeamId) {
      const roundTeams = getRoundTeams(quizData.teams, quizData.round_order, "round3");
      return roundTeams
        .map((team) => {
          const isSelected = team.id === currentTeamId ? "selected" : "";
          return `<option value="${escapeHtml(team.id)}" ${isSelected}>#${team.orderNumber} - ${escapeHtml(team.name)}</option>`;
        })
        .join("");
    }

    function renderTileGridStage(container) {
      stopTimerLoop();
      activeTimerKey = null;

      const roundTeams = getRoundTeams(quizData.teams, quizData.round_order, "round3");
      if (!selectedTeamId && roundTeams.length > 0) {
        selectedTeamId = roundTeams[0].id;
      }
      const selectedTeam = roundTeams.find((t) => t.id === selectedTeamId) || roundTeams[0];

      const tilesHtml = quizData.round3Questions
        .map((tile) => {
          const opened = isTileOpened(gameState, tile.number);
          return `
            <button
              type="button"
              class="tile-btn ${opened ? "opened" : ""}"
              data-tile-number="${tile.number}"
              ${opened ? "disabled" : ""}
            >
              <span class="tile-number">${tile.number}</span>
              <span class="tile-points">${opened ? "Đã mở" : `${tile.points}đ`}</span>
            </button>
          `;
        })
        .join("");

      container.innerHTML = `
        <div class="section-header">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; width: 100%;">
            <div>
              ${quizData.config?.show_subtitle ? `<div class="stage-cluster-subtitle" style="font-size: 1rem; color: var(--accent); font-weight: 700; margin-bottom: 0.35rem;">${escapeHtml(quizData.config.show_subtitle)}</div>` : ""}
              <h1 class="section-title">${escapeHtml(quizData.config.round3_name)}</h1>
              <p class="section-subtitle">
                Chọn đội thi từ danh sách, sau đó bấm mở ô câu hỏi tình huống trên bảng để tính giờ.
              </p>
            </div>
            <button type="button" id="btn-open-rules" class="btn btn-outline" style="font-weight: 600; font-size: 0.95rem;">
              📜 Thể lệ phần thi
            </button>
          </div>
        </div>

        <div class="screen-action-bar" style="margin-bottom: 1.5rem; justify-content: space-between;">
          <div class="screen-left-group">
            <div class="question-team-banner">
              ${selectedTeam ? renderAvatarHtml(selectedTeam, "team-avatar-sm") : ""}
              <div>
                <div style="font-size: 0.78rem; color: var(--accent); font-weight: 700; text-transform: uppercase;">
                  Đội đang dự thi
                </div>
                <div style="font-family: var(--font-serif); font-size: 1.25rem; font-weight: 700;">
                  ${selectedTeam ? escapeHtml(selectedTeam.name) : "Chưa chọn"}
                </div>
              </div>
            </div>
            <div class="team-select-group" style="margin-left: 1rem;">
              <label for="r3-team-select" style="font-weight: 600; font-size: 0.92rem; color: var(--text-muted);">Đổi đội thi:</label>
              <select id="r3-team-select" class="team-dropdown">
                ${renderTeamSelectOptionsHtml(selectedTeamId)}
              </select>
            </div>
          </div>
          <div class="screen-right-group">
            <div style="font-weight: 700; color: var(--text-muted); font-size: 0.95rem;">
              Đã mở: <strong style="color: var(--accent); font-size: 1.15rem;">${gameState.round3.openedTiles?.length || 0}</strong> / ${quizData.round3Questions.length} ô
            </div>
          </div>
        </div>

        <div class="tiles-grid">
          ${tilesHtml}
        </div>
      `;

      document.getElementById("btn-open-rules")?.addEventListener("click", () => {
        showingRules = true;
        renderStage();
      });

      document.getElementById("r3-team-select")?.addEventListener("change", (e) => {
        setSelectedTeam(e.target.value);
        renderStage();
      });

      container.querySelectorAll(".tile-btn:not(.opened)").forEach((btn) => {
        btn.addEventListener("click", () => {
          const num = Number(btn.dataset.tileNumber);
          const tile = quizData.round3Questions.find((q) => q.number === num);
          gameState = openRound3Tile(gameState, num, selectedTeamId || roundTeams[0]?.id || null);
          if (tile && gameState.round3.activeTile) {
            gameState.round3.activeTile.question = tile.question;
          }
          saveAppState(gameState);
          syncLiveState();
          renderStage();
        });
      });
    }

    function renderActiveTileStage(container, activeTile) {
      const tile = quizData.round3Questions.find((q) => q.number === Number(activeTile.number));
      const roundTeams = getRoundTeams(quizData.teams, quizData.round_order, "round3");
      if (!tile) {
        gameState = closeRound3Tile(gameState);
        saveAppState(gameState);
        syncLiveState();
        renderStage();
        return;
      }

      const currentTeamId = activeTile.selectedTeamId || selectedTeamId || roundTeams[0]?.id || "";
      const currentTeam = roundTeams.find((t) => t.id === currentTeamId) || {
        id: currentTeamId,
        name: currentTeamId,
        color: "#D97757"
      };

      ensureTileTimer(tile.number, tile.time_seconds);

      container.innerHTML = `
        <div class="question-stage">
          <div class="screen-action-bar">
            <div class="screen-left-group">
              <button type="button" id="btn-screen-back" class="btn">
                ← Quay lại bảng ô số
              </button>
              <div class="question-team-banner">
                ${renderAvatarHtml(currentTeam, "team-avatar-sm")}
                <div>
                  <div style="font-size: 0.78rem; color: var(--accent); font-weight: 700; text-transform: uppercase;">
                    Ô tình huống #${tile.number} • ${tile.points} điểm
                  </div>
                  <div style="font-family: var(--font-serif); font-size: 1.3rem; font-weight: 700;">
                    ${escapeHtml(currentTeam.name)}
                  </div>
                </div>
              </div>
            </div>

            <div class="screen-right-group">
              <div class="team-select-group">
                <label for="r3-active-team-select" style="font-weight: 600; font-size: 0.92rem; color: var(--text-muted);">Đổi đội:</label>
                <select id="r3-active-team-select" class="team-dropdown">
                  ${renderTeamSelectOptionsHtml(currentTeamId)}
                </select>
              </div>

              <button type="button" id="btn-open-rules" class="btn btn-outline btn-sm">
                📜 Thể lệ
              </button>

              <div id="r3-timer-box" class="top-timer-box">
                <span id="r3-timer-digits" class="top-timer-digits">${formatTimer(currentTimer.remainingSeconds)}</span>
                <span id="r3-timer-warning" class="top-timer-warning-text"></span>
                <button type="button" id="btn-start-timer" class="btn btn-primary btn-sm">
                  ▶ Bắt đầu
                </button>
              </div>

              <button type="button" id="btn-screen-continue" class="btn btn-primary btn-lg">
                Đóng ô câu hỏi →
              </button>
            </div>
          </div>

          <article class="question-card">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem;">
              <span class="meta-pill accent" style="font-size: 1rem; padding: 0.4rem 1.1rem;">Tình huống #${tile.number} (${tile.points} điểm)</span>
              <span style="font-size: 0.95rem; color: var(--text-muted); font-weight: 600;">
                Thời gian: <strong>${Math.round(tile.time_seconds / 60)} phút</strong>
              </span>
            </div>
            <p class="question-text">${escapeHtml(tile.question)}</p>
            ${
              resolveImageUrl(tile.image_url)
                ? `<div class="question-image-wrap">
                    <img class="question-image" src="${escapeHtml(resolveImageUrl(tile.image_url))}" alt="" onerror="this.parentElement.remove()" />
                  </div>`
                : ""
            }
          </article>
        </div>
      `;

      updateTimerDom();

      document.getElementById("btn-screen-back")?.addEventListener("click", handleBack);
      document.getElementById("btn-screen-continue")?.addEventListener("click", handleContinue);
      document.getElementById("btn-open-rules")?.addEventListener("click", () => {
        showingRules = true;
        renderStage();
      });
      document.getElementById("r3-active-team-select")?.addEventListener("change", (e) => {
        setSelectedTeam(e.target.value);
        renderStage();
      });
      document.getElementById("btn-start-timer")?.addEventListener("click", () => {
        triggerStartTimer();
      });
    }

    function renderStage() {
      const container = document.getElementById("round3-stage");
      if (showingRules) {
        renderRulesStage(container);
      } else {
        const activeTile = gameState.round3.activeTile;
        if (activeTile) {
          renderActiveTileStage(container, activeTile);
        } else {
          renderTileGridStage(container);
        }
      }

      wireStageLayout({
        activePage: "round3",
        config: quizData.config,
        teams: quizData.teams,
        onReload: () => initRound3(true)
      });
    }

    async function initRound3(forceRefresh = false) {
      quizData = await fetchQuizData({ forceRefresh, portal: "host" });
      gameState = loadAppState(quizData.teams);
      document.title = `${quizData.config.round3_name} - ${quizData.config.show_title}`;

      update("live", {
        currentRound: "round3"
      });

      listen("live/round3", (remoteR3) => {
        if (!remoteR3) return;
        if (Array.isArray(remoteR3.openedTiles)) {
          gameState.round3.openedTiles = remoteR3.openedTiles;
        }
        if (remoteR3.activeTile !== undefined) {
          gameState.round3.activeTile = remoteR3.activeTile;
        }
        saveAppState(gameState);
      });

      renderStage();
    }

    initRound3(false);
  </script>
</body>
</html>
