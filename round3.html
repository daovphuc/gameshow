<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vòng 3 - Đấu Trường Tri Thức</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="stage-header">
    <div class="header-actions">
      <button id="btn-header-back" class="btn" type="button">
        ← Quay lại
      </button>
    </div>

    <div class="header-center">
      <div id="header-show-title" class="header-show-title">Đấu Trường Tri Thức</div>
      <nav class="header-nav-bar" aria-label="Điều hướng chính">
        <a href="./index.html" class="header-nav-link">Trang chủ</a>
        <a href="./round1.html" class="header-nav-link">Vòng 1</a>
        <a href="./round3.html" class="header-nav-link active">Vòng 3</a>
        <a href="./leaderboard.html" class="header-nav-link">Bảng xếp hạng</a>
        <a href="./scores.html" class="header-nav-link">Điểm số / Quản trị</a>
        <a href="./settings.html" class="header-nav-link">Cài đặt</a>
      </nav>
    </div>

    <div class="header-actions">
      <button id="btn-reload-data" class="btn btn-sm" type="button">
        ↻ Tải lại dữ liệu
      </button>
      <button id="btn-header-continue" class="btn btn-primary" type="button">
        Tiếp tục →
      </button>
    </div>
  </header>

  <main class="stage-main">
    <div id="round3-stage"></div>
  </main>

  <script type="module">
    import {
      fetchQuizData,
      loadAppState,
      saveAppState,
      renderAvatarHtml,
      escapeHtml,
      showToast,
      wireStageHeader
    } from "./js/app.js";
    import {
      isTileOpened,
      openRound3Tile,
      updateRound3TileSession,
      closeRound3Tile,
      recordAnswer
    } from "./js/state.js";
    import { createTimer, startTimer, tickTimer, formatTimer } from "./js/timer.js";

    const SELECTED_TEAM_KEY = "gameshow_r3_selected_team";

    let quizData = null;
    let gameState = null;
    let selectedTeamId = sessionStorage.getItem(SELECTED_TEAM_KEY) || "";

    let currentTimer = null;
    let timerInterval = null;
    let activeTimerKey = null;

    function stopTimerLoop() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function ensureTileTimer(tileNumber, durationSeconds) {
      const key = `r3_tile_${tileNumber}`;
      if (activeTimerKey !== key || !currentTimer) {
        stopTimerLoop();
        activeTimerKey = key;
        currentTimer = createTimer(durationSeconds);
      }
    }

    function triggerStartTimer() {
      if (!currentTimer || currentTimer.finished || currentTimer.status === "running") {
        return false;
      }
      currentTimer = startTimer(currentTimer, Date.now());
      updateTimerDom();
      stopTimerLoop();
      timerInterval = setInterval(() => {
        currentTimer = tickTimer(currentTimer, Date.now());
        updateTimerDom();
        if (currentTimer.finished) {
          stopTimerLoop();
        }
      }, 100);
      return true;
    }

    function updateTimerDom() {
      const panel = document.getElementById("r3-timer-panel");
      const digits = document.getElementById("r3-timer-digits");
      const status = document.getElementById("r3-timer-status");
      const bar = document.getElementById("r3-timer-bar");
      const startBtn = document.getElementById("btn-start-timer");
      if (!panel || !currentTimer) return;

      panel.classList.toggle("running", currentTimer.status === "running");
      panel.classList.toggle("finished", currentTimer.finished);
      if (digits) {
        digits.textContent = formatTimer(currentTimer.remainingSeconds);
      }
      if (status) {
        status.textContent = currentTimer.finished
          ? "HẾT GIỜ!"
          : currentTimer.status === "running"
            ? "Đang đếm ngược..."
            : "Sẵn sàng";
      }
      if (bar) {
        const pct =
          currentTimer.durationMs > 0
            ? Math.max(0, Math.min(100, (currentTimer.remainingMs / currentTimer.durationMs) * 100))
            : 0;
        bar.style.width = `${pct}%`;
      }
      if (startBtn) {
        startBtn.disabled = currentTimer.status === "running" || currentTimer.finished;
        startBtn.textContent = currentTimer.finished
          ? "Đã hết giờ"
          : currentTimer.status === "running"
            ? "Đang chạy..."
            : "▶ Bắt đầu đếm ngược (Space)";
      }
    }

    function setSelectedTeam(teamId) {
      selectedTeamId = teamId || "";
      sessionStorage.setItem(SELECTED_TEAM_KEY, selectedTeamId);
      if (gameState?.round3?.activeTile) {
        gameState = updateRound3TileSession(gameState, { selectedTeamId });
        saveAppState(gameState);
      }
    }

    function handleBack() {
      if (gameState.round3.activeTile) {
        gameState = closeRound3Tile(gameState);
        saveAppState(gameState);
        stopTimerLoop();
        activeTimerKey = null;
        renderStage();
        return;
      }
      window.location.href = "./round1.html";
    }

    function handleContinue() {
      if (gameState.round3.activeTile) {
        gameState = closeRound3Tile(gameState);
        saveAppState(gameState);
        stopTimerLoop();
        activeTimerKey = null;
        renderStage();
        return;
      }
      window.location.href = "./leaderboard.html";
    }

    function renderTeamChipsHtml(currentTeamId) {
      return quizData.teams
        .map((team) => {
          const active = team.id === currentTeamId;
          const r3Score = gameState.scores[team.id]?.round3 ?? 0;
          return `
            <button
              type="button"
              class="team-chip ${active ? "active" : ""}"
              data-select-team="${escapeHtml(team.id)}"
            >
              <span class="team-chip-dot" style="background-color: ${escapeHtml(team.color)}"></span>
              <span>${escapeHtml(team.name)}</span>
              <span style="opacity: 0.8; font-family: var(--font-mono);">(${r3Score})</span>
            </button>
          `;
        })
        .join("");
    }

    function renderTileGridStage(container) {
      stopTimerLoop();
      activeTimerKey = null;

      if (!selectedTeamId && quizData.teams.length > 0) {
        selectedTeamId = quizData.teams[0].id;
      }

      const openedCount = gameState.round3.openedTiles.length;
      const totalCount = quizData.round3Questions.length;

      const tilesHtml = quizData.round3Questions
        .map((tile) => {
          const opened = isTileOpened(gameState, tile.number);
          return `
            <button
              type="button"
              class="tile-btn ${opened ? "opened" : ""}"
              data-tile-number="${tile.number}"
              ${opened ? "disabled" : ""}
            >
              <span class="tile-number">${tile.number}</span>
              <span class="tile-points">${opened ? "Đã mở" : `+${tile.points}đ`}</span>
            </button>
          `;
        })
        .join("");

      container.innerHTML = `
        <div class="section-header">
          <div>
            <h1 class="section-title">${escapeHtml(quizData.config.round3_name)}</h1>
            <p class="section-subtitle">
              Chọn đội đang giành quyền trả lời, sau đó bấm mở ô câu hỏi trên bảng (${openedCount}/${totalCount} ô đã mở).
            </p>
          </div>
          <div>
            <a href="./leaderboard.html?tab=round3" class="btn">Xem Bảng xếp hạng Vòng 3</a>
          </div>
        </div>

        <div class="team-selector-bar" aria-label="Chọn đội trả lời">
          <strong style="font-size: 0.9rem; color: var(--text-muted); margin-right: 0.35rem;">Đội đang chọn:</strong>
          ${renderTeamChipsHtml(selectedTeamId)}
        </div>

        <div class="tiles-grid">
          ${tilesHtml}
        </div>
      `;

      container.querySelectorAll("[data-select-team]").forEach((btn) => {
        btn.addEventListener("click", () => {
          setSelectedTeam(btn.dataset.selectTeam);
          renderStage();
        });
      });

      container.querySelectorAll(".tile-btn:not(.opened)").forEach((btn) => {
        btn.addEventListener("click", () => {
          const num = Number(btn.dataset.tileNumber);
          gameState = openRound3Tile(gameState, num, selectedTeamId || quizData.teams[0]?.id || null);
          saveAppState(gameState);
          renderStage();
        });
      });

      const continueBtn = document.getElementById("btn-header-continue");
      if (continueBtn) {
        continueBtn.textContent = "Bảng xếp hạng →";
      }
    }

    function renderActiveTileStage(container, activeTile) {
      const tile = quizData.round3Questions.find((q) => q.number === Number(activeTile.number));
      if (!tile) {
        gameState = closeRound3Tile(gameState);
        saveAppState(gameState);
        renderStage();
        return;
      }

      const currentTeamId = activeTile.selectedTeamId || selectedTeamId || quizData.teams[0]?.id || "";
      const activeTeam = quizData.teams.find((t) => t.id === currentTeamId) || null;
      const questionKey = `r3__${tile.number}__${currentTeamId}`;
      const recorded = gameState.answeredQuestions?.[questionKey] || null;

      ensureTileTimer(tile.number, tile.time_seconds);

      container.innerHTML = `
        <div class="question-stage">
          <div class="question-topbar">
            <div class="question-team-banner">
              ${activeTeam ? renderAvatarHtml(activeTeam) : ""}
              <div>
                <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">
                  Ô CÂU HỎI SỐ #${tile.number} • ĐỘI TRẢ LỜI / CƯỚP ĐIỂM
                </div>
                <div style="font-family: var(--font-serif); font-size: 1.55rem; font-weight: 700;">
                  ${activeTeam ? escapeHtml(activeTeam.name) : "Chưa chọn đội"}
                  ${
                    activeTeam
                      ? `<span style="color: var(--accent); font-family: var(--font-mono);">(${gameState.scores[activeTeam.id]?.round3 ?? 0} điểm V3)</span>`
                      : ""
                  }
                </div>
              </div>
            </div>

            <div class="question-meta-pills">
              <span class="meta-pill">Ô số #${tile.number}</span>
              <span class="meta-pill accent">+${tile.points} điểm</span>
              <span class="meta-pill">${tile.time_seconds} giây</span>
            </div>
          </div>

          <div class="team-selector-bar" style="margin-bottom: 0;">
            <strong style="font-size: 0.9rem; color: var(--text-muted); margin-right: 0.35rem;">
              Đổi đội trả lời / Cướp điểm:
            </strong>
            ${renderTeamChipsHtml(currentTeamId)}
          </div>

          <div id="r3-timer-panel" class="timer-panel">
            <div class="timer-display-group">
              <div id="r3-timer-digits" class="timer-digits">${formatTimer(currentTimer.remainingSeconds)}</div>
              <div>
                <span id="r3-timer-status" class="timer-status-badge">Sẵn sàng</span>
                <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.35rem;">
                  Khi hết giờ, màn hình giữ nguyên câu hỏi cho đến khi MC bấm Tiếp tục.
                </div>
              </div>
            </div>

            <div class="header-actions">
              <button type="button" id="btn-start-timer" class="btn btn-primary btn-lg">
                ▶ Bắt đầu đếm ngược (Space)
              </button>
            </div>

            <div class="timer-progress-track">
              <div id="r3-timer-bar" class="timer-progress-bar" style="width: 100%;"></div>
            </div>
          </div>

          <article class="question-card">
            <p class="question-text">${escapeHtml(tile.question)}</p>
            ${
              tile.image_url
                ? `<div class="question-image-wrap">
                    <img class="question-image" src="${escapeHtml(tile.image_url)}" alt="Hình minh họa câu hỏi" />
                  </div>`
                : ""
            }
          </article>

          ${
            activeTile.revealed
              ? `<div class="answer-panel">
                  <div class="answer-label">ĐÁP ÁN Ô SỐ #${tile.number}</div>
                  <p class="answer-text">${escapeHtml(tile.answer)}</p>
                </div>`
              : ""
          }

          <div class="host-controls">
            <div class="scoring-buttons">
              <button type="button" id="btn-reveal-answer" class="btn btn-lg">
                ${activeTile.revealed ? "Ẩn đáp án" : "👁 Hiện đáp án"}
              </button>
              <button
                type="button"
                id="btn-mark-correct"
                class="btn btn-success btn-lg ${recorded?.correct === true ? "selected-outcome" : ""}"
                ${!activeTeam ? "disabled" : ""}
              >
                ✓ Đúng cho ${activeTeam ? escapeHtml(activeTeam.name) : "đội"} (+${tile.points}đ)
              </button>
              <button
                type="button"
                id="btn-mark-wrong"
                class="btn btn-danger btn-lg ${recorded?.correct === false ? "selected-outcome" : ""}"
                ${!activeTeam ? "disabled" : ""}
              >
                ✕ Sai (0đ)
              </button>
            </div>

            <div>
              <button type="button" id="btn-return-grid" class="btn btn-primary btn-lg">
                Tiếp tục (Về bảng 50 ô) →
              </button>
            </div>
          </div>
        </div>
      `;

      updateTimerDom();

      container.querySelectorAll("[data-select-team]").forEach((btn) => {
        btn.addEventListener("click", () => {
          setSelectedTeam(btn.dataset.selectTeam);
          renderStage();
        });
      });

      document.getElementById("btn-start-timer")?.addEventListener("click", () => {
        triggerStartTimer();
      });

      document.getElementById("btn-reveal-answer")?.addEventListener("click", () => {
        gameState = updateRound3TileSession(gameState, { revealed: !activeTile.revealed });
        saveAppState(gameState);
        renderStage();
      });

      document.getElementById("btn-mark-correct")?.addEventListener("click", () => {
        if (!activeTeam) return;
        gameState = recordAnswer(gameState, {
          round: 3,
          teamId: activeTeam.id,
          points: tile.points,
          correct: true,
          questionKey
        });
        saveAppState(gameState);
        showToast(`Đã cộng +${tile.points} điểm Vòng 3 cho ${activeTeam.name}!`);
        renderStage();
      });

      document.getElementById("btn-mark-wrong")?.addEventListener("click", () => {
        if (!activeTeam) return;
        gameState = recordAnswer(gameState, {
          round: 3,
          teamId: activeTeam.id,
          points: tile.points,
          correct: false,
          questionKey
        });
        saveAppState(gameState);
        showToast(`${activeTeam.name} trả lời Sai (0 điểm). Có thể chọn đội khác cướp điểm!`);
        renderStage();
      });

      document.getElementById("btn-return-grid")?.addEventListener("click", () => {
        handleContinue();
      });

      const continueBtn = document.getElementById("btn-header-continue");
      if (continueBtn) {
        continueBtn.textContent = "Về bảng 50 ô →";
      }
    }

    function renderStage() {
      const container = document.getElementById("round3-stage");
      const activeTile = gameState.round3.activeTile;

      if (activeTile) {
        renderActiveTileStage(container, activeTile);
      } else {
        renderTileGridStage(container);
      }

      wireStageHeader({
        config: quizData.config,
        onBack: handleBack,
        onContinue: handleContinue,
        onReload: () => initRound3(true),
        onSpace: () => {
          if (gameState.round3.activeTile) {
            return triggerStartTimer();
          }
          return false;
        }
      });
    }

    async function initRound3(forceRefresh = false) {
      quizData = await fetchQuizData({ forceRefresh });
      gameState = loadAppState(quizData.teams);
      document.title = `${quizData.config.round3_name} - ${quizData.config.show_title}`;
      renderStage();
    }

    initRound3(false);
  </script>
</body>
</html>
