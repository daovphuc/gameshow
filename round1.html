<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vòng 1 - Dẫn Chương Trình</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Serif:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar" aria-label="Thanh điều hướng bên trái"></aside>

    <main class="stage-main">
      <div id="round1-stage"></div>
    </main>
  </div>

  <script type="module">
    import {
      fetchQuizData,
      loadAppState,
      saveAppState,
      renderAvatarHtml,
      escapeHtml,
      showToast,
      wireStageLayout
    } from "./js/app.js";
    import { resolveImageUrl, getRound1TopicLabel } from "./js/data.js";
    import { getRoundTeams } from "./js/content.js";
    import {
      isTeamLocked,
      getAvailableRound1Packages,
      pickRound1Package,
      cancelRound1Session,
      finishRound1Package
    } from "./js/state.js";
    import { createTimer, startTimer, tickTimer, formatTimer } from "./js/timer.js";
    import { set, update, listen, getServerTime } from "./js/backend.js";

    const PENDING_TEAM_KEY = "gameshow_r1_pending_team";

    let quizData = null;
    let gameState = null;
    let pendingTeamId = sessionStorage.getItem(PENDING_TEAM_KEY) || null;
    let showingRules = true;

    let currentTimer = null;
    let timerInterval = null;
    let activeTimerKey = null;

    function stopTimerLoop() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function ensureQuestionTimer(questionKey, durationSeconds) {
      const warnSec = Number(quizData?.config?.warning_seconds) || 5;
      if (activeTimerKey !== questionKey || !currentTimer) {
        stopTimerLoop();
        activeTimerKey = questionKey;
        currentTimer = createTimer(durationSeconds, warnSec);
      }
    }

    function triggerStartTimer() {
      if (!currentTimer || currentTimer.finished || currentTimer.status === "running") {
        return false;
      }
      const warnSec = Number(quizData?.config?.warning_seconds) || 5;
      const now = getServerTime();
      currentTimer = startTimer(currentTimer, now);
      updateTimerDom();
      stopTimerLoop();

      // Publish timer start to live state for judges & secondary screens
      update("live/round1", {
        timer: {
          startedAt: now,
          durationSeconds: currentTimer.totalSeconds,
          status: "running"
        }
      });

      timerInterval = setInterval(() => {
        currentTimer = tickTimer(currentTimer, getServerTime(), warnSec);
        updateTimerDom();
        if (currentTimer.finished) {
          stopTimerLoop();
          update("live/round1/timer", { status: "finished" });
        }
      }, 100);
      return true;
    }

    function updateTimerDom() {
      const box = document.getElementById("r1-timer-box");
      const digits = document.getElementById("r1-timer-digits");
      const warnText = document.getElementById("r1-timer-warning");
      const startBtn = document.getElementById("btn-start-timer");
      if (!box || !currentTimer) return;

      box.classList.toggle("running", currentTimer.status === "running" && !currentTimer.warning);
      box.classList.toggle("warning", Boolean(currentTimer.warning));
      box.classList.toggle("finished", Boolean(currentTimer.finished));

      if (digits) {
        digits.textContent = formatTimer(currentTimer.remainingSeconds);
      }
      if (warnText) {
        if (currentTimer.finished) {
          warnText.textContent = "HẾT GIỜ!";
        } else if (currentTimer.warning) {
          warnText.textContent = `⚠ Còn ${currentTimer.remainingSeconds} giây!`;
        } else {
          warnText.textContent = "";
        }
      }
      if (startBtn) {
        startBtn.disabled = currentTimer.status === "running" || currentTimer.finished;
        startBtn.textContent = currentTimer.finished
          ? "Đã hết giờ"
          : currentTimer.status === "running"
            ? "Đang chạy..."
            : "▶ Bắt đầu";
      }
    }

    function setPendingTeam(teamId) {
      pendingTeamId = teamId;
      if (teamId) {
        sessionStorage.setItem(PENDING_TEAM_KEY, teamId);
      } else {
        sessionStorage.removeItem(PENDING_TEAM_KEY);
      }
      // Broadcast active team to judges
      update("live", {
        currentRound: "round1",
        stageTeamId: teamId || null
      });
    }

    function handleBack() {
      if (gameState.round1.activeSession) {
        gameState = cancelRound1Session(gameState, { releasePackage: true });
        saveAppState(gameState);
        setPendingTeam(null);
        syncLiveState();
        stopTimerLoop();
        activeTimerKey = null;
        renderStage();
        return;
      }
      if (pendingTeamId) {
        setPendingTeam(null);
        renderStage();
        return;
      }
      window.location.href = "./host.html";
    }

    function handleContinue() {
      const session = gameState.round1.activeSession;
      if (session) {
        const team = quizData.teams.find((t) => t.id === session.teamId);
        gameState = finishRound1Package(gameState, session.teamId);
        saveAppState(gameState);
        setPendingTeam(null);
        syncLiveState();
        stopTimerLoop();
        activeTimerKey = null;
        showToast(`Đã hoàn thành phần thi của ${team ? team.name : session.teamId}!`);
        renderStage();
        return;
      }

      if (pendingTeamId) {
        const offered = getAvailableRound1Packages(gameState, quizData.round1Packages, pendingTeamId, 2);
        if (offered.length > 0) {
          selectPackageForTeam(pendingTeamId, offered[0].id);
        }
        return;
      }

      window.location.href = "./round2.html";
    }

    function selectPackageForTeam(teamId, packageId) {
      try {
        gameState = pickRound1Package(gameState, teamId, packageId);
        saveAppState(gameState);
        syncLiveState();
        setPendingTeam(null);
        renderStage();
      } catch (err) {
        showToast(err.message || "Không thể chọn chủ đề này.");
      }
    }

    function syncLiveState() {
      set("live/round1", {
        lockedTeams: gameState.round1.lockedTeams || [],
        pickedPackages: gameState.round1.pickedPackages || [],
        teamPackages: gameState.round1.teamPackages || {},
        activeSession: gameState.round1.activeSession || null
      });
      set("live/currentRound", "round1");
      set("live/stageTeamId", gameState.round1.activeSession?.teamId || pendingTeamId || null);
    }

    function renderRulesStage(container) {
      stopTimerLoop();
      activeTimerKey = null;

      const rulesText = quizData.config?.round1_rules || "";
      const roundTitle = quizData.config?.round1_name || "Phần thi thứ nhất: Tuyên truyền về PCCC và CNCH";

      container.innerHTML = `
        <div class="rules-stage" style="max-width: 960px; margin: 0 auto; padding: 1.5rem;">
          <div class="section-header" style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 1rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem;">
              Quy định & Thể lệ
            </div>
            <h1 class="section-title" style="font-size: clamp(1.8rem, 3.5vw, 2.5rem); margin-bottom: 0.5rem;">
              ${escapeHtml(roundTitle)}
            </h1>
            <p class="section-subtitle" style="font-size: 1.1rem; color: var(--text-muted); margin: 0 auto;">
              MC đọc phổ biến thể lệ thi đấu trước khi bắt đầu phần thi
            </p>
          </div>

          <div class="rules-card" style="background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius-lg, 16px); padding: clamp(1.5rem, 3vw, 2.5rem); box-shadow: var(--shadow-md, 0 4px 20px rgba(0,0,0,0.06)); margin-bottom: 2rem;">
            <div style="white-space: pre-wrap; font-family: var(--font-sans, system-ui); font-size: clamp(1.05rem, 1.8vw, 1.25rem); line-height: 1.8; color: var(--text);">${escapeHtml(rulesText)}</div>
          </div>

          <div style="display: flex; justify-content: center; gap: 1rem;">
            <button type="button" id="btn-dismiss-rules" class="btn btn-primary btn-lg" style="font-size: 1.25rem; padding: 0.85rem 2.5rem; font-weight: 700; border-radius: var(--radius-full, 9999px);">
              ${(gameState?.round1?.activeSession || pendingTeamId) ? "Quay lại phần thi →" : "Vào phần thi →"}
            </button>
          </div>
        </div>
      `;

      document.getElementById("btn-dismiss-rules")?.addEventListener("click", () => {
        showingRules = false;
        renderStage();
      });
    }

    function renderTeamGridStage(container) {
      stopTimerLoop();
      activeTimerKey = null;

      const roundTeams = getRoundTeams(quizData.teams, quizData.round_order, "round1");

      const cardsHtml = roundTeams
        .map((team) => {
          const locked = isTeamLocked(gameState, team.id);
          const pickedPkgId = gameState.round1.teamPackages?.[team.id] || "";
          const pickedPkg = quizData.round1Packages.find((p) => p.id === pickedPkgId);
          const pickedLabel = pickedPkg ? getRound1TopicLabel(pickedPkg) : pickedPkgId;
          return `
            <button
              type="button"
              class="team-card ${locked ? "locked" : ""}"
              data-team-id="${escapeHtml(team.id)}"
              ${locked ? "disabled" : ""}
            >
              <div style="font-weight: 800; font-size: 0.85rem; color: var(--accent); margin-bottom: 0.25rem;">#${team.orderNumber}</div>
              ${renderAvatarHtml(team, "team-avatar-lg")}
              <div class="team-card-name">${escapeHtml(team.name)}</div>
              <div class="team-card-status">
                ${locked ? `✓ Đã hoàn thành${pickedLabel ? ` (${escapeHtml(pickedLabel)})` : ""}` : ""}
              </div>
            </button>
          `;
        })
        .join("");

      container.innerHTML = `
        <div class="section-header">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; width: 100%;">
            <div>
              ${quizData.config?.show_subtitle ? `<div class="stage-cluster-subtitle" style="font-size: 1rem; color: var(--accent); font-weight: 700; margin-bottom: 0.35rem;">${escapeHtml(quizData.config.show_subtitle)}</div>` : ""}
              <h1 class="section-title">${escapeHtml(quizData.config.round1_name)}</h1>
              <p class="section-subtitle">
                Danh sách ${roundTeams.length} đội tham gia Vòng 1 theo thứ tự bốc thăm. Bấm vào đội để bắt đầu chọn chủ đề.
              </p>
            </div>
            <button type="button" id="btn-open-rules" class="btn btn-outline" style="font-weight: 600; font-size: 0.95rem;">
              📜 Thể lệ phần thi
            </button>
          </div>
        </div>
        <div class="teams-grid">
          ${cardsHtml}
        </div>
      `;

      document.getElementById("btn-open-rules")?.addEventListener("click", () => {
        showingRules = true;
        renderStage();
      });

      container.querySelectorAll(".team-card:not(.locked)").forEach((btn) => {
        btn.addEventListener("click", () => {
          setPendingTeam(btn.dataset.teamId);
          renderStage();
        });
      });
    }

    function renderPackagePickStage(container, teamId) {
      stopTimerLoop();
      activeTimerKey = null;

      const team = quizData.teams.find((t) => t.id === teamId);
      if (!team || isTeamLocked(gameState, teamId)) {
        setPendingTeam(null);
        renderTeamGridStage(container);
        return;
      }

      const offeredLimit = Number(quizData.config.round1_packages_offered) || 2;
      const offered = getAvailableRound1Packages(gameState, quizData.round1Packages, teamId, offeredLimit);

      const renderPkgCard = (pkg, idx) => {
        const timeSec = pkg.time_seconds || pkg.questions?.[0]?.time_seconds || quizData.config.round1_time_seconds;
        const topicLabel = getRound1TopicLabel(pkg, idx);
        return `
          <button type="button" class="package-card" data-package-id="${escapeHtml(pkg.id)}">
            <div>
              <span class="package-card-tag">
                Lựa chọn ${idx + 1} • ${escapeHtml(team.name)}
              </span>
              <h2 class="package-card-title">${escapeHtml(topicLabel)}</h2>
              <p class="package-card-meta">
                Thời gian: <strong>${timeSec % 60 === 0 ? `${timeSec / 60} phút` : `${timeSec} giây`}</strong>
              </p>
            </div>
          </button>
        `;
      };

      container.innerHTML = `
        <div class="screen-action-bar">
          <div class="screen-left-group">
            <button type="button" id="btn-screen-back" class="btn">
              ← Quay lại danh sách đội
            </button>
            <div class="question-team-banner">
              ${renderAvatarHtml(team, "team-avatar-sm")}
              <strong style="font-family: var(--font-serif); font-size: 1.35rem;">${escapeHtml(team.name)}</strong>
            </div>
          </div>
          <div class="screen-right-group">
            <button type="button" id="btn-open-rules" class="btn btn-outline btn-sm">
              📜 Thể lệ
            </button>
          </div>
        </div>

        <div class="section-header">
          <div>
            <h1 class="section-title">Chọn 1 trong ${offered.length} chủ đề</h1>
          </div>
        </div>

        ${
          offered.length === 0
            ? `<div class="panel-card">
                <h2 class="panel-title">Không còn chủ đề khả dụng</h2>
                <p class="panel-desc">Các chủ đề của đội này đã hoàn thành.</p>
              </div>`
            : `<div class="packages-grid">
                ${offered.map((pkg, idx) => renderPkgCard(pkg, idx)).join("")}
              </div>`
        }
      `;

      document.getElementById("btn-screen-back")?.addEventListener("click", handleBack);
      document.getElementById("btn-open-rules")?.addEventListener("click", () => {
        showingRules = true;
        renderStage();
      });

      container.querySelectorAll(".package-card").forEach((card) => {
        card.addEventListener("click", () => {
          selectPackageForTeam(teamId, card.dataset.packageId);
        });
      });
    }

    function renderQuestionStage(container, session) {
      const team = quizData.teams.find((t) => t.id === session.teamId) || {
        id: session.teamId,
        name: session.teamId,
        color: "#D97757"
      };
      const pkg = quizData.round1Packages.find((p) => p.id === session.packageId);
      if (!pkg) {
        gameState = cancelRound1Session(gameState);
        saveAppState(gameState);
        syncLiveState();
        renderStage();
        return;
      }

      const question = pkg.questions?.[0] || pkg;
      const questionKey = `r1__${pkg.id}`;

      ensureQuestionTimer(questionKey, question.time_seconds);

      container.innerHTML = `
        <div class="question-stage">
          <div class="screen-action-bar">
            <div class="screen-left-group">
              <button type="button" id="btn-screen-back" class="btn">
                ← Quay lại
              </button>
              <div class="question-team-banner">
                ${renderAvatarHtml(team, "team-avatar-sm")}
                <div>
                  <div style="font-size: 0.78rem; color: var(--accent); font-weight: 700; text-transform: uppercase;">
                    ${escapeHtml(getRound1TopicLabel(pkg))}
                  </div>
                  <div style="font-family: var(--font-serif); font-size: 1.3rem; font-weight: 700;">
                    ${escapeHtml(team.name)}
                  </div>
                </div>
              </div>
            </div>

            <div class="screen-right-group">
              <button type="button" id="btn-open-rules" class="btn btn-outline btn-sm">
                📜 Thể lệ
              </button>
              <div id="r1-timer-box" class="top-timer-box">
                <span id="r1-timer-digits" class="top-timer-digits">${formatTimer(currentTimer.remainingSeconds)}</span>
                <span id="r1-timer-warning" class="top-timer-warning-text"></span>
                <button type="button" id="btn-start-timer" class="btn btn-primary btn-sm">
                  ▶ Bắt đầu
                </button>
              </div>

              <button type="button" id="btn-screen-continue" class="btn btn-primary btn-lg">
                Hoàn thành phần thi →
              </button>
            </div>
          </div>

          <article class="question-card">
            <p class="question-text">${escapeHtml(question.question)}</p>
            ${
              resolveImageUrl(question.image_url)
                ? `<div class="question-image-wrap">
                    <img class="question-image" src="${escapeHtml(resolveImageUrl(question.image_url))}" alt="" onerror="this.parentElement.remove()" />
                  </div>`
                : ""
            }
          </article>
        </div>
      `;

      updateTimerDom();

      document.getElementById("btn-screen-back")?.addEventListener("click", handleBack);
      document.getElementById("btn-open-rules")?.addEventListener("click", () => {
        showingRules = true;
        renderStage();
      });
      document.getElementById("btn-screen-continue")?.addEventListener("click", handleContinue);
      document.getElementById("btn-start-timer")?.addEventListener("click", () => {
        triggerStartTimer();
      });
    }

    function renderStage() {
      const container = document.getElementById("round1-stage");
      if (showingRules) {
        renderRulesStage(container);
      } else {
        const session = gameState.round1.activeSession;

        if (session) {
          renderQuestionStage(container, session);
        } else if (pendingTeamId) {
          renderPackagePickStage(container, pendingTeamId);
        } else {
          renderTeamGridStage(container);
        }
      }

      wireStageLayout({
        activePage: "round1",
        config: quizData.config,
        teams: quizData.teams,
        onReload: () => initRound1(true)
      });
    }

    async function initRound1(forceRefresh = false) {
      quizData = await fetchQuizData({ forceRefresh, portal: "host" });
      gameState = loadAppState(quizData.teams);
      document.title = `${quizData.config.round1_name} - ${quizData.config.show_title}`;

      // Synchronise live round to round 1
      update("live", {
        currentRound: "round1"
      });

      // Listen for remote state updates
      listen("live/round1", (remoteR1) => {
        if (!remoteR1) return;
        if (Array.isArray(remoteR1.lockedTeams)) {
          gameState.round1.lockedTeams = remoteR1.lockedTeams;
        }
        if (Array.isArray(remoteR1.pickedPackages)) {
          gameState.round1.pickedPackages = remoteR1.pickedPackages;
        }
        if (remoteR1.teamPackages) {
          gameState.round1.teamPackages = remoteR1.teamPackages;
        }
        saveAppState(gameState);
      });

      renderStage();
    }

    initRound1(false);
  </script>
</body>
</html>
